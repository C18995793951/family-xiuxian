<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家族修仙录</title>
<style>
/* ============ 古风修仙家族档案 · 固定深色主题 ============ */
:root {
  --bg: #17130f;
  --panel: #211a14;
  --panel-2: #2a2119;
  --line: #8a6d3f;
  --line-soft: #4a3b26;
  --accent: #e0a94f;
  --danger: #b5412f;
  --good: #5b9a85;
  --text: #e8dcc6;
  --muted: #a99d86;
  --title-font: "KaiTi", "STKaiti", "楷体", "SimSun", "宋体", "Noto Serif SC", "Source Han Serif SC", serif;
  --body-font: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  --fs: 15px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--body-font); font-size: var(--fs); line-height: 1.6; }
body { min-height: 100vh; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: var(--title-font); font-weight: 600; color: var(--accent); margin: 0 0 .5em; letter-spacing: .05em; }
h1 { font-size: 1.8em; } h2 { font-size: 1.35em; } h3 { font-size: 1.12em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--danger); } .warn { color: var(--accent); }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: .45em .9em; cursor: pointer; min-height: 36px; }
button:hover:not(:disabled) { background: #3a2c1e; }
button.primary { background: #6b4a1f; border-color: var(--accent); color: #fff3dc; font-weight: 600; }
button.danger { border-color: var(--danger); color: #f0b2a6; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { background: none; border: none; color: var(--accent); padding: 0 .1em; min-height: 0; text-decoration: underline dotted; }
select, input[type=text], input[type=number], textarea { background: #120f0b; border: 1px solid var(--line-soft); border-radius: 4px; padding: .35em .5em; min-height: 36px; }
textarea { width: 100%; min-height: 8em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 布局 */
.app { display: grid; grid-template-columns: 200px 1fr 300px; min-height: 100vh; }
.app.no-aside { grid-template-columns: 200px 1fr; }
nav.side { background: var(--panel); border-right: 1px solid var(--line-soft); padding: 1em .6em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav.side .brand { font-family: var(--title-font); font-size: 1.4em; color: var(--accent); text-align: center; margin-bottom: .2em; }
nav.side .sub { text-align: center; color: var(--muted); font-size: .85em; margin-bottom: 1em; }
nav.side button { display: block; width: 100%; text-align: left; margin-bottom: .3em; background: transparent; border-color: transparent; }
nav.side button.on { border-color: var(--line); background: var(--panel-2); color: var(--accent); }
.badge { display: inline-block; min-width: 1.5em; padding: 0 .4em; border-radius: 1em; background: var(--danger); color: #fff; font-size: .8em; text-align: center; margin-left: .3em; }
main { padding: 1.2em 1.5em 5em; min-width: 0; }
aside.right { background: var(--panel); border-left: 1px solid var(--line-soft); padding: 1em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1em; margin-bottom: 1em; }
.card.hl { border-color: var(--accent); }
.grid { display: grid; gap: 1em; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stat { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line-soft); padding: .2em 0; gap: .5em; }
.stat:last-child { border-bottom: none; }
.stat b { font-weight: 600; }
.big { font-size: 1.6em; font-family: var(--title-font); color: var(--accent); }
.bar { height: 8px; background: #120f0b; border-radius: 4px; overflow: hidden; border: 1px solid var(--line-soft); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.good > i { background: var(--good); } .bar.bad > i { background: var(--danger); }
.tag { display: inline-block; border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 .4em; margin: 0 .2em .2em 0; font-size: .88em; color: var(--muted); }
.tag.t-warn { border-color: var(--accent); color: var(--accent); }
.tag.t-bad { border-color: var(--danger); color: #f0b2a6; }
.tag.t-good { border-color: var(--good); color: #9fd2c0; }
.unfinished { border: 1px dashed var(--muted); color: var(--muted); padding: .5em .8em; border-radius: 4px; font-size: .92em; }
.unfinished::before { content: "未完成 · "; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .4em .5em; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { color: var(--muted); font-weight: normal; cursor: pointer; white-space: nowrap; }
tr.attn td { background: rgba(224, 169, 79, .08); }
tr.dead td { color: var(--muted); }
.clickable { cursor: pointer; }
.trace { cursor: help; text-decoration: underline dotted var(--muted); }
.log p { margin: .2em 0 .5em; }
.log .y { color: var(--muted); font-size: .85em; margin-right: .4em; }

/* 模态 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1em; animation: fade .15s; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.2em 1.4em; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.modal h2 { margin-top: 0; }
.opt { border: 1px solid var(--line-soft); border-radius: 6px; padding: .7em .9em; margin: .6em 0; background: var(--panel-2); }
.opt.disabled { opacity: .55; }
.opt .meta { font-size: .92em; color: var(--muted); }
.opt .meta b { color: var(--text); font-weight: normal; }
#toasts { position: fixed; bottom: 1em; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: .4em; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { background: var(--panel-2); border: 1px solid var(--accent); padding: .6em 1.2em; border-radius: 6px; animation: fade .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
@media (max-width: 720px) { #toasts { bottom: 64px; } }
.flash { animation: flash 1.2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flash { 0% { background: rgba(224,169,79,.35); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 开局 */
.start { max-width: 900px; margin: 0 auto; padding: 2em 1em; }
.origin { cursor: pointer; }
.origin.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

nav.bottom { display: none; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 180px 1fr; }
  aside.right { display: none; }
}
@media (max-width: 720px) {
  .app, .app.no-aside { display: block; }
  nav.side { display: none; }
  main { padding: .8em 16px 6em; }
  nav.bottom { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 40; }
  nav.bottom button { border: none; border-radius: 0; background: transparent; min-height: 52px; padding: .2em; font-size: .85em; }
  nav.bottom button.on { color: var(--accent); background: var(--panel-2); }
  .more-menu { position: fixed; bottom: 56px; right: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; z-index: 45; padding: .4em; }
  .more-menu button { display: block; width: 100%; text-align: left; margin: .2em 0; min-height: 44px; }
  table.resp thead { display: none; }
  table.resp tr { display: block; border: 1px solid var(--line-soft); border-radius: 6px; margin-bottom: .6em; padding: .4em; }
  table.resp td { display: flex; justify-content: space-between; border: none; padding: .2em .3em; }
  table.resp td::before { content: attr(data-l); color: var(--muted); margin-right: 1em; }
  button { min-height: 44px; }
  .modal { padding: 1em; }
}

/* AI 润色（表现层） */
.ai-text p { margin: .2em 0 .6em; text-indent: 2em; }
.ai-text h3 { margin-top: .8em; }
.ai-bar { display: flex; gap: .6em; align-items: center; flex-wrap: wrap; font-size: .88em; margin: .2em 0 .6em; }
.tag.ai-tag { border-color: #7a8fb5; color: #b8c8e8; }

</style>
</head>

/* ---------- core/rng.js ---------- */
/* ============================================================
 * rng —— 可序列化种子随机数（sfc32）。核心内所有随机都经由这里，
 * 状态保存在 state.rng.s 中，随存档保存。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function seedState(seed) {
    const f = xmur3(String(seed));
    const s = [f(), f(), f(), f()];
    const r = { algo: 'sfc32', s };
    for (let i = 0; i < 15; i++) nextU32(r);
    return r;
  }

  function nextU32(r) {
    const s = r.s;
    let a = s[0] >>> 0, b = s[1] >>> 0, c = s[2] >>> 0, d = s[3] >>> 0;
    const t = (((a + b) >>> 0) + d) >>> 0;
    d = (d + 1) >>> 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) >>> 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) >>> 0;
    s[0] = a >>> 0; s[1] = b >>> 0; s[2] = c >>> 0; s[3] = d >>> 0;
    return t;
  }

  // 以下函数都接收 rng 状态对象（state.rng）
  const R = {
    seedState,
    next(r) { return nextU32(r) / 4294967296; },
    chance(r, p) { return R.next(r) < p; },
    int(r, min, max) { return min + Math.floor(R.next(r) * (max - min + 1)); },
    range(r, min, max) { return min + R.next(r) * (max - min); },
    pick(r, arr) { return arr[Math.floor(R.next(r) * arr.length)]; },
    normal(r, mean, sd) {
      // Box–Muller，固定消耗两次随机数
      const u = Math.max(R.next(r), 1e-12);
      const v = R.next(r);
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    weighted(r, items, wf) {
      let total = 0;
      for (const it of items) total += Math.max(0, wf(it));
      if (total <= 0) return null;
      let x = R.next(r) * total;
      for (const it of items) {
        x -= Math.max(0, wf(it));
        if (x < 0) return it;
      }
      return items[items.length - 1];
    },
    shuffle(r, arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(R.next(r) * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
  };

  FX.RNG = R;

  /* ---------- 通用工具（纯函数）---------- */
  FX.U = {
    clamp(x, a, b) { return x < a ? a : x > b ? b : x; },
    round1(x) { return Math.round(x * 10) / 10; },
    sum(arr, f) { let s = 0; for (const x of arr) s += f ? f(x) : x; return s; },
    // FNV-1a 32 位哈希，用于存档校验和与状态哈希
    hash(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(16).padStart(8, '0');

      return tpl.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? params[k] : m));
    },
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ============================================================
 * economy —— 资源产出、建筑、坊市、炼丹、消耗与入不敷出
 * ============================================================ */

  // 差事人手加成：每人 +15%，上限为建筑等级 × 每级岗位数
  E.dutyBuilding = { field: 'field', shop: 'shop', industry: 'mine' };
  E.slots = (s, duty) => (s.family.buildings[E.dutyBuilding[duty]] || 0) * C().economy.slotsPerLevel;
  E.staffEff = (s, duty) => Math.min(E.slots(s, duty), U.sum(E.workers(s, duty), (p) => E.personEff(s, p)));
  E.managerMult = (s, duty) => 1 + C().economy.managerBonus * E.staffEff(s, duty);
  E.labor = (s, duty) => C().economy.laborYield[duty] * E.staffEff(s, duty);
  E.hasElement = (s, duty, els) => E.workers(s, duty).some((p) => p.root.elements.some((e) => els.includes(e)));

  E.upkeepCut = (s) => {
    const eff = U.sum(E.workers(s, 'industry'), (p) => E.personEff(s, p));
    return Math.min(C().economy.industryUpkeepMax, eff * C().economy.industryUpkeepCut);
  };

  E.grainCap = (s) => C().economy.grainCapBase + C().economy.grainCapPerField * (s.family.buildings.field || 0);

  E.consumption = (s) => {
    const up = C().realms.upkeep;
    let grain = 0, stone = 0;
    for (const p of P().living(s)) {
      const m = p.realm.major;
      grain += up[m][0];
      let st = up[m][1];
      if (p.duty.type === 'seclusion') st *= 1 + C().realms.seclusionStoneExtra;
      stone += st;
    }
    return { grain, stone };
  };

  E.upkeep = (s) => {
    let total = 0;
    for (const k in C().buildings) total += C().buildings[k].upkeep * (s.family.buildings[k] || 0);

  E.forecast = (s) => {
    const cf = C().economy, b = s.family.buildings, d = E.deficitEff(s);
    const out = { grain: 0, herb: 0, stone: 0, ore: 0, parts: [] };
    const fl = b.field || 0;
    const herbPlots = Math.min(s.family.settings.herbPlots, fl);
    // 入不敷出时：商铺、洞府、炼丹房效率减半；灵田灵矿靠人力照常产出，避免死亡螺旋
    const fm = E.managerMult(s, 'field') * (E.hasElement(s, 'field', ['木', '土']) ? 1 + C().roots.elementBonus : 1);
    const fLab = fl ? E.labor(s, 'field') * (fl - herbPlots) / fl : 0;
    out.grain += (fl - herbPlots) * cf.fieldGrain * fm + fLab;
    out.herb += herbPlots * cf.fieldHerb * fm;
    if (fl) out.parts.push({ label: '灵田 ' + fl + ' 级', text: `灵谷 ${Math.round((fl - herbPlots) * cf.fieldGrain * fm + fLab)}（含人手 ${Math.round(fLab)}），灵药 ${U.round1(herbPlots * cf.fieldHerb * fm)}（人手加成 ×${U.round1(fm)}）` });
    const ml = b.mine || 0;
    if (ml) {
      const me = (s.family.lowMine ? cf.fallenMineEff : 1) * E.managerMult(s, 'industry') * (E.hasElement(s, 'industry', ['金']) ? 1 + C().roots.elementBonus : 1);

      out.parts.push({ label: '商铺 ' + sl + ' 级', text: `基础收入 ${Math.round(v)}（对外政策 ×${U.round1(pol)}），另售库存` });

  // 按建议安排：默认只处理需要处理的人；all=true 时全族重排
  S.suggestAll = (s, all) => {
    const targets = all ? P().adults(s) : S.needsAttention(s);
    const ex = new Set(targets.map((p) => p.id));
    const c = S.dutyCounts(s, ex);
    const order = targets.slice().sort((a, b) => (P().hasRoot(a) && a.realm.major > 0) - (P().hasRoot(b) && b.realm.major > 0) || a.aptitude - b.aptitude || (a.id < b.id ? -1 : 1));
    for (const p of order) {
      if (p.health.state === 'heavy') { p.attention = null; continue; }
      const t = S.suggestFor(s, p, c);
      if (S.dutyAllowed(s, p, t) === true) { S.setDutyRaw(s, p, t, null, '按建议安排'); c[t]++; }
    }
    return { ok: true, count: targets.length };
  };
  S.batchSetDuty = (s, ids, type) => {
    const out = { ok: true, done: 0, failed: [] };
    for (const id of ids) {
      const r = S.setDuty(s, id, type);
      if (r.ok) out.done++; else out.failed.push(P().name(s, id) + '：' + r.error);
    }
    return out;
  };

  /* ---------- 回合 ---------- */
  S.snapshot = (s) => ({
    year: s.year,
    resources: Object.assign({}, s.family.resources),
    population: P().living(s).length,
    natives: P().natives(s).length,
    histFrom: s.nextHistId,
    prestige: s.family.prestige,
  });

  S.beginTurn = (s) => {
    s.phase = 'arrange';
    s.turnStart = S.snapshot(s);
    FX.Econ.refreshMarket(s);
    FX.Ev.processQueue(s);
    FX.Ev.draw(s);
  };

  S.advance = (s) => {
    if (s.ended) return { ok: false, error: '本局已结束' };
    if (s.pending.length) return { ok: false, error: '还有待决断的事件' };
    s.phase = 'advancing';
    let guard = 0;
    while (s.yearInTurn < C().yearsPerTurn) {
      if (guard++ > 10) throw new Error('年度结算超出迭代上限');
      S.runYear(s);
      s.yearInTurn++;
      if (s.ended) return { ok: true, ended: true };
      if (s.pending.length) return { ok: true, interrupted: true, year: s.year };
    }
    S.endTurn(s);
    return { ok: true, report: s.lastReport };
  };

  S.endTurn = (s) => {
    F().turnEnd(s);
    for (const p of P().living(s)) if (p.duty.type === 'seclusion') p.seclusionTurns++;
    const st = s.turnStart || S.snapshot(s);
    const now = S.snapshot(s);
    const delta = {};
    for (const k in now.resources) delta[k] = U.round1(now.resources[k] - (st.resources[k] || 0));
    s.lastReport = {
      turn: s.turn,
      fromYear: st.year, toYear: s.year,
      delta, population: [st.population, now.population],
      prestige: [st.prestige, now.prestige],
      entries: s.history.filter((e) => e.turn === s.turn && e.severity >= 2).map((e) => e.id),
    };
    S.checkEnd(s);
    if (s.ended) return;
    s.turn++;
    s.yearInTurn = 0;
    S.beginTurn(s);
  };

  /* ---------- 年度结算（固定顺序，第 5 章）---------- */
  S.runYear = (s) => {
    const cf = C(), r = s.rng;
    // 1. 年龄 +1、寿元 -1
    s.year++;
    for (const p of P().living(s)) p.lifespanLeft = P().lifespanLeft(s, p);
    // 2. 死亡判定
    for (const p of P().living(s).sort((a, b) => (a.id < b.id ? -1 : 1))) {
      if (!P().alive(p)) continue;
      const age = P().age(s, p);
      const left = p.lifespanLeft;
      if (left <= 0) { P().kill(s, p, '寿元耗尽', [], { key: 'lifespan' }); continue; }
      let pd;
      if (age <= cf.life.childAge) pd = cf.life.deathInfant;
      else pd = cf.life.deathAdult;
      const maxL = p.lifespanMax + p.lifespanBonus;
      if (left < maxL * cf.life.deathOldFrac) pd = cf.life.deathAdult + (1 - left / (maxL * cf.life.deathOldFrac)) * (cf.life.deathOldMax - cf.life.deathAdult);
      if (p.health.state === 'heavy') pd += cf.life.heavyInjuryDeath;
      const fam = s.family.famine || 0;
      if (fam > 0) pd += fam * (age <= cf.life.childAge || !P().hasRoot(p) || p.realm.major === 0 ? cf.life.famineDeathWeak : cf.life.famineDeath);
      if (R.chance(r, pd)) P().kill(s, p, fam > 0.2 ? '饥荒中饿病而死' : p.health.state === 'heavy' ? '伤重不治' : age <= cf.life.childAge ? '幼年夭折' : left < maxL * cf.life.deathOldFrac ? '年老病故' : '急病而亡', [], {});
    }
    if (S.checkEnd(s)) return;
    // 老祖寿元预警（C06）
    const top = F().strongest(s);
    if (top) {
      const left = P().lifespanLeft(s, top);
      for (const w of cf.leadership.ancestorWarnings) {
        const flag = 'warn' + w;
        if (left <= w && !top.flags.includes(flag)) {
          top.flags.push(flag);
          for (const w2 of cf.leadership.ancestorWarnings) if (w2 > w && !top.flags.includes('warn' + w2)) top.flags.push('warn' + w2);
          const hid = H().add(s, { type: 'event', tags: ['继承', '寿元'], actors: [top.id], key: 'event', params: { title: '老祖寿元预警', choice: '剩余 ' + left + ' 年', result: '' }, severity: 3 });
          FX.Ev.spawn(s, 'E24', { person: top.id }, [hid]);
          break;
        }
      }
    }
    // 3. 伤势恢复
    for (const p of P().living(s)) {
      if (p.health.state === 'healthy') continue;
      let step = 1;
      if (s.family.settings.useHeal && p.health.state === 'heavy' && s.family.resources.heal > 0) { s.family.resources.heal--; step = 2; }
      p.health.recoverYears -= step;
      if (p.health.recoverYears <= 0) {
        p.health = { state: 'healthy', recoverYears: 0 };
        if (P().isAdult(s, p)) p.attention = '康复';
      }
    }
    // 4. 产业收支
    if (s.family.austerityUntil >= s.turn) s.family.resources.stone += FX.Econ.consumption(s).stone * 0.3;
    FX.Econ.yearly(s);
    const yearlyNeed = FX.Econ.upkeep(s) + FX.Econ.consumption(s).stone;
    if (s.family.resources.stone < yearlyNeed * 2 && s.family.resources.stone < 400 && FX.Econ.forecast(s).netStone < 0 && (s.eventCooldowns.E07 || -1) <= s.turn && !s.pending.some((x) => x.defId === 'E07')) {
      FX.Ev.spawn(s, 'E07', {}, []);
    }
    // 5. 修炼与突破（只处理存活且有差事者）+ 历练
    FX.CU.yearly(s);
    S.travel(s);
    for (const p of P().living(s)) {
      const rk = P().realmRank(p);
      if (rk !== p.lastRank) { p.lastRank = rk; p.rankChangedTurn = s.turn; }
    }
    // 6. 人物自主行为
    F().autonomy(s);
    // 7. 婚嫁、生育与新生族人
    S.marriages(s);
    S.births(s);
    S.growUp(s);
    // 8. 外部势力演化（阶段 3）：核心修士增龄
    for (const k in s.factions) for (const c of s.factions[k].core) c.age++;
    // 9. 风险与危机（阶段 3 完整实现）
    // 家主、分支、忠诚、锋芒的年度漂移
    F().yearly(s);
    F().updateElder(s);
    if (!s.family.headId || !P().alive(s.people[s.family.headId])) F().succeed(s, [], 'vacant');
    S.recordPeaks(s);
    FX.Ev.prune(s);
    // 10. 状态自检断言
    S.check(s);
  };

  S.travel = (s) => {
    const T = C().travel, r = s.rng;
    for (const p of P().living(s).filter((q) => q.duty.type === 'travel' && P().isAdult(s, q))) {
      let risk = 1;
      if (p.traits.includes('谨慎')) risk *= T.cautiousFactor;
      if (p.root.mutant === '风') risk *= C().roots.mutantTravelRisk;
      const roll = R.next(r);
      if (roll < T.death * risk) { P().kill(s, p, '外出历练遇险身亡', [], { key: 'travel' }); continue; }
      if (roll < (T.death + T.injury) * risk && p.health.state === 'healthy') {
        const heavy = R.chance(r, T.heavyShare);
        p.health = { state: heavy ? 'heavy' : 'light', recoverYears: heavy ? C().life.heavyInjuryYears : C().life.lightInjuryYears };
        if (heavy) { p.duty = { type: null, target: null }; p.attention = '重伤'; }
        H().add(s, { type: 'injury', tags: ['历练', '受伤'], actors: [p.id], key: 'travel_injury', params: { name: p.name, level: heavy ? '重伤' : '轻伤' }, severity: heavy ? 2 : 1 });
        continue;
      }
      if (R.chance(r, T.fortune)) {
        const rw = R.weighted(r, T.rewards, (x) => x.w);
        const q = R.int(r, rw.min, rw.max);
        s.family.resources[rw.kind] += q;
        H().add(s, { type: 'fortune', tags: ['历练', '奇遇'], actors: [p.id], key: 'travel_fortune', params: { name: p.name, reward: C().items[rw.kind] + ' ' + q }, severity: rw.kind === 'rareHerb' ? 2 : 1 });
      }
    }
  };

  S.marriages = (s) => {
    const L = C().life, r = s.rng;
    const singles = P().living(s).filter((p) => P().isNative(p) && P().canMarry(s, p)).sort((a, b) => (a.id < b.id ? -1 : 1));
    for (const p of singles) {
      if (!P().canMarry(s, p)) continue;
      // 族内婚配（三代以内血亲不得婚配）
      if (R.chance(r, L.marryInternalChance)) {
        const mates = singles.filter((q) => q !== p && q.sex !== p.sex && P().canMarry(s, q) && !P().bloodWithin(s, p.id, q.id, L.generationsBan));
        if (mates.length) { P().marry(s, p, R.pick(r, mates)); continue; }
      }
      if (!R.chance(r, L.marryOutsiderChance)) continue;
      if (p.sex === 'F' && !R.chance(r, L.daughterUxorilocal)) {
        // 外嫁离族
        const to = R.pick(r, C().names.surnames.slice(0, 120)) + '家';
        const hid = H().add(s, { type: 'marriage', tags: ['婚嫁', '外嫁'], actors: [p.id], key: 'marry_out', params: { name: p.name, to }, severity: 2 });
        p.marriedOutTo = to;
        P().leave(s, p, '外嫁' + to, [hid], 'leave');
        continue;
      }
      S.marryOutsider(s, p, {}, []);
    }
  };

  S.births = (s) => {
    const L = C().life, r = s.rng;
    const mothers = P().living(s).filter((m) => m.sex === 'F' && m.spouseId && P().age(s, m) >= L.marryMin && P().age(s, m) <= L.fertileMaxMother).sort((a, b) => (a.id < b.id ? -1 : 1));
    for (const m of mothers) {
      const f = s.people[m.spouseId];
      if (!f || !P().alive(f)) continue;
      if (!P().isNative(m) && !P().isNative(f)) continue;
      const shared = m.childIds.filter((id) => f.childIds.includes(id)).length;
      if (shared >= L.maxChildren) continue;
      const mult = Math.min(L.birthRealmMult[m.realm.major], L.birthRealmMult[f.realm.major]);
      if (!R.chance(r, L.birthChance * mult * (1 - (s.family.famine || 0)))) continue;
      S.bear(s, f, m, {});
    }
  };

  S.growUp = (s) => {
    const L = C().life;
    for (const p of P().living(s)) {
      const age = P().age(s, p);
      if (age === L.rootTestAge && P().isNative(p)) {
        H().add(s, { type: 'rootTest', tags: ['灵根'], actors: [p.id], key: 'rootTest', params: { name: p.name, root: C().roots.names[p.root.type] + (p.root.mutant ? '（' + p.root.mutant + '）' : ''), apt: p.aptitude }, severity: ['single', 'mutant'].includes(p.root.type) ? 2 : 1 });
      }
      if (age === L.adultAge) {
        p.attention = '新成年';
        H().add(s, { type: 'adult', tags: ['成年'], actors: [p.id], key: 'adult', params: { name: p.name }, severity: 1 });
      }
    }
  };

  S.recordPeaks = (s) => {
    const n = P().living(s).length;
    const cur = s.records.peaks.population;
    if (!cur || n > cur.value) s.records.peaks.population = { value: n, year: s.year, hid: null };
    if (n > 30) F().milestone(s, 'pop30', '族人超过 30 口', null);
    let gen = 0;
    for (const p of P().natives(s)) gen = Math.max(gen, p.generation || 0);
    if (gen >= 4) F().milestone(s, 'gen5', '传承到第 5 代', null);
    if (gen >= 9) F().milestone(s, 'gen10', '传承到第 10 代', null);
  };

  /* ---------- 结局 ---------- */
  S.checkEnd = (s) => {
    if (s.ended) return true;
    if (P().natives(s).length === 0) {
      S.endGame(s, 'extinct', '家族断嗣');
      return true;
    }
    return false;
  };
  S.endGame = (s, type, what) => {
    const hid = H().add(s, { type: 'ending', tags: ['结局'], key: 'ending', params: { what }, severity: 5 });
    s.pending = [];
    s.ended = { type, what, year: s.year, hid, rating: S.rating(s, type) };
    s.phase = 'ended';
  };
  S.seal = (s) => {
    if (s.ended) return { ok: false, error: '本局已结束' };
    S.endGame(s, 'sealed', '家主封存族史');
    return { ok: true };
  };

  S.rating = (s, type) => {
    const rc = C().rating;
    const years = s.year - C().startYear;
    let best = 0, bestKey = null;
    for (const p of Object.values(s.people)) {
      if (p.origin === 'guest') continue;
      const rk = p.peakRank || P().realmRank(p);
      if (rk > best) best = rk;
    }
    if (best >= 1 && best <= 9) bestKey = '1';
    else if (best >= 10 && best <= 12) bestKey = '2-' + (best - 9);
    else if (best >= 13) bestKey = '3-' + (best - 12);
    let lv = 0;
    for (const k in s.family.buildings) lv += s.family.buildings[k] || 0;
    const parts = [
      { label: '传承年数', value: Math.min(rc.yearsMax, years / rc.yearsDiv) },
      { label: '最高修为', value: bestKey ? rc.realmScore[bestKey] : 0 },
      { label: '人口峰值', value: Math.min(rc.popMax, ((s.records.peaks.population || {}).value || 0) / rc.popDiv) },
      { label: '产业', value: Math.min(rc.buildMax, lv / rc.buildDiv) },
      { label: '声望', value: Math.min(rc.prestigeMax, s.family.prestige / rc.prestigeDiv) },
      { label: '历史成就', value: Math.min(rc.milestoneMax, s.family.milestones.length) },
    ];
    const total = Math.round(U.sum(parts, (x) => x.value) * 10) / 10;
    const g = rc.grades.find((x) => total >= x[0]);
    const why = type === 'extinct' ? '终因断嗣而衰' : type === 'sealed' ? '族史封存于第 ' + s.year + ' 年' : '';
    return { total, grade: g[1], title: g[2], why, parts: parts.map((x) => ({ label: x.label, value: Math.round(x.value * 10) / 10 })) };
  };

  /* ---------- 状态自检（第 4 章原则 14 / 第 22 章 2、3、4）---------- */
  S.check = (s) => {
    const errs = [];
    const caps = C().economy.caps;
    for (const k in s.family.resources) {
      const v = s.family.resources[k];
      if (!Number.isFinite(v) || v < 0 || v > (caps[k] || 1e9)) errs.push('资源越界 ' + k + '=' + v);
    }
    for (const p of Object.values(s.people)) {
      if (p.status !== 'alive' && p.duty.type) errs.push('非在世者仍有差事 ' + p.id);
      if (p.status === 'dead' && (p.deathYear === null || p.deathYear < p.birthYear)) errs.push('死亡年份异常 ' + p.id);
      if (p.birthYear > s.year) errs.push('出生年份在未来 ' + p.id);
      for (const pid of [p.fatherId, p.motherId]) {
        if (!pid) continue;
        const par = s.people[pid];
        if (!par) { errs.push('父母引用缺失 ' + p.id); continue; }
        if (p.birthYear - par.birthYear < C().life.adultAge) errs.push('子女与父母年龄差不足 ' + p.id);
        if (!par.childIds.includes(p.id)) errs.push('亲缘不对称 ' + p.id);
        if (par.status === 'dead' && par.deathYear < p.birthYear && pid === p.motherId) errs.push('母亲死后出生 ' + p.id);
      }
      if (p.status === 'alive' && p.spouseId) {
        const sp = s.people[p.spouseId];
        if (!sp || (sp.status === 'alive' && sp.spouseId !== p.id)) errs.push('配偶不互指 ' + p.id);
        if (sp && sp.status === 'alive' && P().isNative(p) && P().isNative(sp) && P().bloodWithin(s, p.id, sp.id, C().life.generationsBan)) errs.push('三代内血亲婚配 ' + p.id);
      }
      if (p.status === 'alive' && !Number.isFinite(p.progress)) errs.push('修为非数 ' + p.id);
    }
    for (const id of s.family.focusIds) if (!P().alive(s.people[id])) errs.push('重点培养对象不在世 ' + id);
    for (const r of s.relations) if (!P().alive(s.people[r.a]) || !P().alive(s.people[r.b])) errs.push('关系对引用失效');
    if (!s.ended && P().living(s).length && !P().alive(s.people[s.family.headId])) errs.push('家主不在世');
    for (const p of P().living(s)) if (p.duty.type === 'mentor' && p.duty.target && !P().alive(s.people[p.duty.target])) errs.push('导师对象失效 ' + p.id);
    if (errs.length) {
      const e = new Error('状态自检失败：' + errs.slice(0, 5).join('；'));
      e.errors = errs;
      throw e;
    }
    return true;
  };

  FX.Sim = S;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/save.js ---------- */
/* ============================================================
 * save（核心部分）—— 序列化、校验、迁移、校验和

(function (G) {

  SV.hashState = (s) => U.hash(JSON.stringify(s));

    return {
      surname: s.family.surname,
      origin: s.family.origin,
      originName: FX.CONFIG.origins[s.family.origin].name,
      seed: s.seed,

  };

  SV.migrations = {
    // 1: (state) => { ...; state.schemaVersion = 2; return state; },
  };

    state: ['schemaVersion', 'seed', 'rng', 'year', 'turn', 'yearInTurn', 'family', 'people', 'relations', 'factions', 'eventQueue', 'pending', 'history', 'records'],
    family: ['surname', 'origin', 'headId', 'rules', 'resources', 'buildings', 'branches', 'headAuthority', 'settings'],

    const cur = FX.CONFIG.schemaVersion;
    let st = save.state;
    if (typeof save.schemaVersion !== 'number') return { ok: false, error: '缺少 schemaVersion' };
    if (save.schemaVersion > cur) return { ok: false, error: `存档版本 ${save.schemaVersion} 比游戏版本 ${cur} 新，请更新游戏` };
    // 校验和针对原始 state 计算

(function (G) {

  };

    newGame: (opts) => FX.Sim.newGame(opts || {}),
    advance: (s) => FX.Sim.advance(s),
    // 中断后继续完成本回合剩余年份
    resume: (s) => FX.Sim.advance(s),
    resolveEvent: (s, instId, optId) => {
      const r = FX.Ev.resolve(s, instId, optId);
      if (r.ok) FX.Sim.checkEnd(s);
      return r;
    },
    pendingEvents: (s) => s.pending.map((i) => FX.Ev.view(s, i)),

    setDuty: wrap(FX.Sim.setDuty),
    batchSetDuty: wrap(FX.Sim.batchSetDuty),
    confirmDuty: wrap(FX.Sim.confirmDuty),
    applySuggestions: wrap((s, all) => FX.Sim.suggestAll(s, all)),
    breakthroughPreview: (s, id) => {
      const p = s.people[id];
      if (!p) return null;
      const can = FX.CU.canAttempt(s, p);
      return Object.assign({ can }, FX.CU.chance(s, p) || {});
    },
    attemptBreakthrough: wrap((s, id) => FX.CU.attempt(s, s.people[id])),
    upgrade: wrap(FX.Econ.upgrade),
    buy: wrap(FX.Econ.buy),
    sell: wrap(FX.Econ.sell),
    setSetting: wrap((s, key, val) => {
      if (!(key in s.family.settings)) return { ok: false, error: '无此设置' };
      if (key === 'herbPlots') val = Math.max(0, Math.min(s.family.buildings.field || 0, Math.floor(val)));
      s.family.settings[key] = val;
      return { ok: true };
    }),
    designateHeir: wrap(FX.Family.designateHeir),
    abdicate: wrap(FX.Family.abdicate),
    changeRule: wrap(FX.Family.changeRule),
    setFocus: wrap(FX.Family.setFocus),
    answerRequest: wrap(FX.Family.answerRequest),
    useYanshou: wrap((s, id) => ({ ok: true, text: FX.Sim.takeYanshou(s, s.people[id]) })),
    seal: (s) => FX.Sim.seal(s),
    // 记一笔玩家侧决策说明（如 AI 托管的理由）：只进历史，不影响任何规则数值
    note: (s, text, tag) => {
      const t = String(text || '').replace(/\s+/g, ' ').trim().slice(0, 200);
      if (!t) return { ok: false, error: '空说明' };
      return { ok: true, hid: FX.H.add(s, { type: 'agent', tags: [tag || 'AI 家主'], key: 'agent', params: { text: t }, severity: 1 }) };
    },

    /* ---------- 视图数据（只读）---------- */
    view: {
      overview(s) {
        const top = FX.Family.strongest(s);
        const head = s.people[s.family.headId];
        return {
          year: s.year, turn: s.turn, yearInTurn: s.yearInTurn, phase: s.phase,
          surname: s.family.surname, origin: FX.CONFIG.origins[s.family.origin].name,
          ancestor: top ? { id: top.id, name: top.name, realm: P.realmName(top), left: P.lifespanLeft(s, top), power: Math.round(P.power(s, top) * 10) / 10 } : null,
          successors: FX.Family.successorCultivators(s).slice(0, 3).map((p) => ({ id: p.id, name: p.name, realm: P.realmName(p), left: P.lifespanLeft(s, p) })),
          head: head ? { id: head.id, name: head.name, realm: P.realmName(head), age: P.age(s, head), prestige: Math.round(s.family.headAuthority.prestige) } : null,
          heir: s.family.heirId ? { id: s.family.heirId, name: P.name(s, s.family.heirId) } : null,
          branches: s.family.branches,
          resources: s.family.resources,
          edge: s.family.edge,
          edgeTarget: FX.Family.edgeTarget(s),
          defense: FX.Family.defensePower(s),
          population: P.living(s).length,
          natives: P.natives(s).length,
          prestige: Math.round(s.family.prestige),
          deficit: s.family.deficit,
          attention: FX.Sim.needsAttention(s).length,
          requests: s.family.requests.length,
          pending: s.pending.length,
          forecast: FX.Econ.forecast(s),
          ended: s.ended,

      },
      person(s, id) {
        const p = s.people[id];
        if (!p) return null;

          p,

          loyaltyBase: Math.round(FX.Family.loyaltyBaseline(s, p)),
          history: s.history.filter((e) => e.actors.includes(p.id)).slice(-30).map((e) => ({ id: e.id, year: e.year, text: FX.H.text(e) })),

      chronicle: (s, turn) => FX.H.chronicle(s, turn),
      historyText: (e) => FX.H.text(e),
    },

    save: {
      serialize: (s, savedAt) => FX.Save.serialize(s, savedAt),
      deserialize: (t) => FX.Save.deserialize(t),
      hash: (s) => FX.Save.hashState(s),

  };

  FX.Game = Game;
