    if (job) {
      const member = p.factionId && s.factions[p.factionId].seatId === place.id;
      for (const d of [job.days, job.days * 6]) add({ type: 'work', days: d, label: job.name + ' ' + T().dur(d), group: '营生', ok: !job.memberOnly || member, reason: job.memberOnly && !member ? '只有本门/本族中人可做' : '' });
    }
    // 托墟市代寻
    for (const o of Act.orderable(s)) add({ type: 'order', item: o.item, days: 0, cost: o.cost, label: '托人代寻' + W().itemName(o.item) + '（' + o.cost + ' 符钱，约 ' + T().dur(o.days) + '后送到）', group: '坊市', ok: s.player.stone >= o.cost, reason: s.player.stone >= o.cost ? '' : '符钱不够（需 ' + o.cost + '）' });
    // 宗门、家族：拜入、符诏、请授、兑换、上交（见 sect.js）
    FX.Sect.list(s, add);
    // 天下大事与洞府（见 saga.js）
    FX.Saga.list(s, add);
    // 道术参习、法器祭炼（见 arsenal.js）
    FX.Ars.list(s, add);
    FX.Yao.list(s, add);
    // 静养
    if (p.health.state !== 'healthy') for (const d of cf.actions.restDays) add({ type: 'rest', days: d, label: '静养 ' + T().dur(d), group: '修炼' });
    // 拜访在场的人
    for (const q of P().at(s, place.id)) {
      if (q.id === p.id) continue;
      add({ type: 'befriend', npc: q.id, days: cf.actions.befriendDays, label: '拜访' + q.name, group: '人物' });
      const cc = Act.canConsult(s, q);
      if (P().realmRank(q) > P().realmRank(p) && P().relValue(s, p.id, q.id) > 0) add({ type: 'consult', npc: q.id, days: cf.actions.consultDays, label: '向' + q.name + '请教', group: '人物', ok: cc === true, reason: cc === true ? '' : cc });
    }
    return out;
  };

  Act.canConsult = (s, q) => {
    const p = me(s);
    if (P().realmRank(q) <= P().realmRank(p)) return '对方修为不比你高';
    if (P().relValue(s, p.id, q.id) < C().relations.consultMin) return '交情不够（需 ' + C().relations.consultMin + '）';
    if (q.lastConsultYear === s.year) return '今年已请教过';
    return true;
  };

  // 校验一项行动是否在清单里（防止界面或 AI 传入清单外的东西）
  Act.find = (s, a) => Act.list(s).find((x) => x.type === a.type && !!x.coin === !!a.coin && !!x.until === !!a.until && ['days', 'to', 'npc', 'item', 'tech', 'fid', 'gid', 'n', 'path', 'zf', 'hall'].every((k) => a[k] === undefined || x[k] === a[k]));
  Act.coinCost = (p, days) => Math.ceil((CU().coinPerYear(p) * days) / C().daysPerYear);

  Act.run = (s, a) => {
    if (s.ended) return { ok: false, error: '这一生已经结束' };
    if (s.pending.length) return { ok: false, error: '眼前还有事要先决断' };
    if (a && (a.type === 'buy' || a.type === 'sell')) { const r = Act[a.type](s, a.item, a.qty); FX.Ars.sync(s); return r; }
    // 七个通用动作（自由输入用）：校验与结算在 deeds.js
    if (a && a.type === 'deed') { const r = FX.Deed.run(s, a); FX.Ars.sync(s); Sim().checkEnd(s); if (r.ok) FX.Hook.flush(s); return r; }
    const item = a && Act.find(s, a);
    if (!item) return { ok: false, error: '此刻不能这样做' };
    if (!item.ok) return { ok: false, error: item.reason };
    s.player.stats.actions++;
    // 兑换可以一次换多份
    const req = Object.assign({}, item);
    if (item.type === 'redeem' && a.qty > 1) {
      req.qty = Math.floor(a.qty);
      if (item.cost * req.qty > s.player.merit) return { ok: false, error: C().house.meritName + '不够（需 ' + item.cost * req.qty + '）' };
    }
    if (item.type === 'donate' && a.qty > 1) {
      req.qty = Math.floor(a.qty);
      if (item.cost * req.qty > s.player.stone) return { ok: false, error: '符钱不够（需 ' + item.cost * req.qty + '）' };
    }
    const r = (Act.DO[item.type] || FX.Sect.DO[item.type] || FX.Saga.DO[item.type] || FX.Ars.DO[item.type] || FX.Yao.DO[item.type])(s, req);
    FX.Ars.sync(s);
    Sim().checkEnd(s);
    FX.Hook.flush(s);
    return Object.assign({ ok: true }, r);
  };

  Act.DO = {};

  /* ---------- 修炼 ---------- */
  Act.DO.cultivate = (s, a) => {
    const p = me(s), place = here(s);
    if (a.coin) s.player.stone -= a.cost; // 符钱先炼进去，被打断也回不来
    let r = Sim().passDays(s, a.days, 'cultivate', { interruptible: a.days >= 90, coin: !!a.coin, untilFull: !!a.until && !a.wait });
    // 闭关到圆满：估的时日是按眼下速度算的，丹药续不上时会差一点，差多少再补几个月（至多两年）
    for (let k = 0; a.until && k < 24 && P().alive(p) && !r.interrupted && !s.pending.length && !P().isFull(p); k++) {
      const r2 = Sim().passDays(s, C().daysPerMonth, 'cultivate', { interruptible: true, untilFull: true });
      r = { used: r.used + r2.used, gained: Math.round((r.gained + r2.gained) * 10) / 10, pills: (r.pills || 0) + (r2.pills || 0), interrupted: r2.interrupted, saga: r2.saga };
    }
    if (!P().alive(p)) return { text: '' };
    const dur = T().dur(r.used);
    let key = a.coin ? 'cultivate_coin' : 'cultivate';
    if (r.interrupted) key = 'cultivate_cut';
    else if (r.gained <= 0) key = 'cultivate_idle';
    const what = ['气感', '胎息'][p.realm.major] || '修为';
    const verb = ['静坐', '温养胎息'][p.realm.major] || (a.days >= 360 ? '闭关' : '修炼');
    const pills = r.pills ? '，其间服下' + C().items.qiju.name + ' ' + r.pills + ' 颗' : '';
    H().add(s, { type: 'cultivate', tags: ['修炼'], actors: [p.id], places: [place.id], key, pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(a.until && !r.interrupted ? r.used : a.days), done: r.used, gain: r.gained, cost: a.cost || 0, what, verb, pills } });
    const woke = r.saga ? '。「' + r.saga + '」起了，先出关看看' : '';
    if (a.wait) return { text: `静修 ${dur}${woke || (r.interrupted ? '，中途被打断' : p.restUntil <= s.t ? '，休养已满，可以再冲关' : '')}`, interrupted: r.interrupted };
    if (r.gained <= 0 && P().isFull(p) && CU().capped(p) && CU().gateKind(p)) {
      const B = C().breakthrough, acc = Math.min(B.accumMax, Math.floor(p.fullDays / C().daysPerYear) * B.accumPerYear);
      return { text: `${verb} ${dur}，${what}早已圆满，只是打磨根基${acc ? '：冲关把握 +' + acc + '%' + (acc >= B.accumMax ? '，已到头' : '') : ''}${woke}`, interrupted: r.interrupted };
    }
    return { text: `${a.coin ? '以符钱修行' : verb} ${dur}，${what} +${r.gained}${pills}${woke}`, interrupted: r.interrupted };
  };

  Act.DO.breakthrough = (s, a) => {
    const p = me(s);
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p) || s.pending.length) return { text: '闭关冲关途中出了变故', interrupted: true };
    const res = CU().attempt(s, p, { path: a.path });
    if (!res.ok) return { text: res.error };
    seek(s, res.success);
    const v = res.verb || '冲击';
    return { text: res.success ? `${v}${res.target}成功` : `${v}${res.target}失败${res.died ? '，身死道消' : ''}`, success: res.success, used: r.used };
  };

  Act.DO.use = (s, a) => {
    const p = me(s), cf = C();
    s.player.inv[a.item]--;
    let effect;
    if (a.item === 'qiju') { s.player.qijuUntil = Math.max(s.player.qijuUntil, s.t) + cf.cultivation.qijuDays; effect = '此后修炼加快，药力持续到 ' + T().fmt(s.player.qijuUntil); }
    else if (a.item === 'heal') { const healed = P().heal(p, cf.life.healPillDays); effect = healed ? '伤势痊愈' : '伤势好转，还需 ' + T().dur(p.health.days); }
    else if (a.item === 'zhengyang' || a.item === 'xudu') { const g = CU().addProgress(s, p, a.item === 'xudu' ? cf.xuduGain : cf.zhengyangGain); effect = '丹力推升，修为 +' + Math.round(g); }
    else if (a.item === 'dadong') { const g = CU().addProgress(s, p, Math.round(P().need(p) * cf.dadongFrac)); effect = '感悟元神之妙，修为 +' + Math.round(g); }
    else { const y = cf.yanshouYears[p.yanshouTaken]; p.yanshouTaken++; p.lifespanBonus += y; effect = '寿元 +' + y + ' 年'; }
    H().add(s, { type: 'item', tags: ['物品'], actors: [p.id], key: 'use_item', pov: true, severity: 1, params: { name: p.name, item: cf.items[a.item].name, effect } });
    return { text: effect };
  };

  Act.DO.learn = (s, a) => {
    const p = me(s);
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    const first = !p.techniqueId;
    let loss = '';
    if (!first && p.realm.major === 2) {
      p.progress = Math.floor(p.progress * (1 - C().switchLoss));
      loss = '，真炁性质不同，修为折去 ' + Math.round(C().switchLoss * 100) + '%';
    }
    p.techniqueId = a.tech;
    H().add(s, { type: 'learn', tags: ['功法'], actors: [p.id], key: first ? 'learn_first' : 'learn', pov: true, severity: 2, params: { name: p.name, tech: C().techniques[a.tech].name, loss } });
    CU().autoAdvance(s, p);
    return { text: (first ? '研习《' : '改修《') + C().techniques[a.tech].name + '》' + loss };
  };

  Act.DO.rest = (s, a) => {
    const p = me(s), place = here(s);
    const r = Sim().passDays(s, a.days, 'rest');
    if (!P().alive(p)) return { text: '' };
    const state = p.health.state === 'healthy' ? '伤已养好' : '伤势未愈，还需 ' + T().dur(p.health.days);
    H().add(s, { type: 'rest', tags: ['静养'], actors: [p.id], places: [place.id], key: 'rest', pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(r.used), state } });
    return { text: state };
  };

  /* ---------- 营生与买卖 ---------- */
  Act.DO.work = (s, a) => {
    const p = me(s), place = here(s);
    const job = C().actions.work[place.type];
    // 一次做几个月（一个月或半年）：按月结算，中途出了事就只结做完的月份
    const months = Math.max(1, Math.round(a.days / job.days));
    let stone = 0, merit = 0, used = 0, cut = false;
    for (let k = 0; k < months; k++) {
      const r = Sim().passDays(s, job.days, 'other');
      used += r.used;
      if (!P().alive(p)) return { text: '' };
      if (r.interrupted) { cut = true; break; }
      const pay = Math.round(R.int(s.rng, job.stone[0], job.stone[1]) * C().actions.workPayMult[p.realm.major]) + Math.round(P().realmRank(p) * job.perRank);
      stone += pay;
      s.player.stone += pay;
      // 本门、本族的差事另由功德房记道功
      const m = job.merit ? FX.Sect.taskMerit(p) : 0;
      merit += m;
      s.player.merit += m;
      if (s.pending.length && k < months - 1) { cut = true; break; }
    }
    if (!stone && cut) return { text: '差事没做完就出了事', interrupted: true };
    const r = { used };
    const mtxt = merit ? '，记' + C().house.meritName + ' ' + merit : '';
    H().add(s, { type: 'work', tags: ['营生'], actors: [p.id], places: [place.id], key: 'work', pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(r.used), job: job.name, stone, merit: mtxt } });
    return { text: `得符钱 ${stone}${mtxt}${cut ? '（中途有事，先停下）' : ''}`, interrupted: cut };
  };

  // 某类地方的营生一个月大约挣多少（“下一步”估还要做几个月用）
  Act.workPay = (s, type) => {
    const p = me(s), job = C().actions.work[type];
    if (!job) return null;
    const stone = Math.round(((job.stone[0] + job.stone[1]) / 2) * C().actions.workPayMult[p.realm.major]) + Math.round(P().realmRank(p) * job.perRank);
    return { name: job.name, stone, merit: job.merit ? FX.Sect.taskMerit(p) : 0, memberOnly: !!job.memberOnly };
  };

  Act.marketOf = (s) => (W().hasMarket(s, here(s).id) ? s.markets[here(s).id] : null);

  // 可托墟市代寻的稀罕货（只在墟市办，价钱照原价加成，不随年景浮动）
  Act.orderable = (s) => {
    const O = C().market.order;
    const place = here(s);
    if (place.type !== O.placeType) return [];
    return C().market[place.type].rare.map((x) => {
      const base = x.item.startsWith('tech:') ? C().techniques[x.item.slice(5)].price : C().items[x.item].price;
      return { item: x.item, cost: Math.round(base * (1 + O.fee)), days: O.slowDays[x.item] || O.days };
    }).filter((o) => !(s.markets[place.id] && s.markets[place.id].stock.some((x) => x.item === o.item && x.qty > 0))
      && !(o.item.startsWith('tech:') && (s.player.manuals.includes(o.item.slice(5)) || s.player.orders.some((y) => y.item === o.item))));
  };

  Act.DO.order = (s, a) => {
    const p = me(s), o = Act.orderable(s).find((x) => x.item === a.item);
    s.player.stone -= a.cost;
    s.player.orders.push({ item: a.item, due: s.t + o.days, placeId: p.locationId });
    H().add(s, { type: 'trade', tags: ['坊市'], actors: [p.id], places: [p.locationId], key: 'order', pov: true, severity: 1, params: { name: p.name, place: here(s).name, item: W().itemName(a.item), cost: a.cost, dur: T().dur(o.days) } });
    return { text: '托人代寻' + W().itemName(a.item) + '，约 ' + T().dur(o.days) + '后送到' };
  };

  // 月末：到期的代寻货送到手上
  Act.deliverOrders = (s) => {
    const p = me(s);
    const due = s.player.orders.filter((o) => o.due <= s.t);
    if (!due.length || !P().alive(p)) return;
    s.player.orders = s.player.orders.filter((o) => o.due > s.t);
    for (const o of due) {
      if (o.item.startsWith('tech:')) { const t = o.item.slice(5); if (!s.player.manuals.includes(t)) s.player.manuals.push(t); }
      else giveItem(s, o.item, 1);
      H().add(s, { type: 'trade', tags: ['坊市'], actors: [p.id], key: 'order_arrive', pov: true, severity: 2, params: { name: p.name, place: s.places[o.placeId].name, item: W().itemName(o.item) } });
    }
  };

  Act.buy = (s, item, qty) => {
    const m = Act.marketOf(s);
    if (!m) return { ok: false, error: '此地没有坊市' };
    qty = Math.max(1, Math.floor(qty || 1));
    const slot = m.stock.find((x) => x.item === item);
    if (!slot || slot.qty < qty) return { ok: false, error: '货不够' };
    const cost = slot.price * qty;
    if (s.player.stone < cost) return { ok: false, error: '符钱不足（需 ' + cost + '）' };
    s.player.stone -= cost;
    slot.qty -= qty;
    if (item.startsWith('tech:')) { const t = item.slice(5); if (!s.player.manuals.includes(t)) s.player.manuals.push(t); }
    else giveItem(s, item, qty);
    const p = me(s);
    H().add(s, { type: 'trade', tags: ['坊市'], actors: [p.id], places: [here(s).id], key: 'buy', pov: true, severity: 1, params: { name: p.name, place: here(s).name, item: W().itemName(item), qty, cost } });
    return { ok: true, text: '买下' + W().itemName(item) + '×' + qty };
  };

  Act.sell = (s, item, qty) => {
    if (!Act.marketOf(s)) return { ok: false, error: '此地没有坊市' };
    if (!C().items[item]) return { ok: false, error: '无此物品' };
    qty = Math.max(1, Math.floor(qty || 1));
    if ((s.player.inv[item] || 0) < qty) return { ok: false, error: '数量不够' };
    const gain = W().sellPrice(s, item) * qty;
    s.player.inv[item] -= qty;
    s.player.stone += gain;
    const p = me(s);
    H().add(s, { type: 'trade', tags: ['坊市'], actors: [p.id], places: [here(s).id], key: 'sell', pov: true, severity: 1, params: { name: p.name, place: here(s).name, item: C().items[item].name, qty, gain } });
    return { ok: true, text: '卖得符钱 ' + gain };
  };

  /* ---------- 赶路（逐段走，每段按危险度可能出事）---------- */
  Act.DO.travel = (s, a) => {
    const p = me(s);
    const from = here(s);
    const to = s.places[a.to];
    const r = Sim().passDays(s, a.days, 'travel');
    if (!P().alive(p)) return { text: '' };
    if (r.interrupted) return { text: '路上出了事', interrupted: true };
    p.locationId = to.id;
    if (!s.player.visited.includes(to.id)) {
      // 第一次踏进东弥州腹地的某一域
      if (to.region && to.region !== '南域' && !s.player.visited.some((id) => s.places[id].region === to.region)) {
        H().add(s, { type: 'travel', tags: ['赶路', '大事'], actors: [p.id], places: [to.id], key: 'outer_first', pov: true, severity: 3, params: { name: p.name, region: to.region } });
      }
      s.player.visited.push(to.id);
    }
    const danger = Math.max(from.danger, to.danger);
    const hid = H().add(s, { type: 'travel', tags: ['赶路'], actors: [p.id], places: [from.id, to.id], key: 'travel', pov: true, severity: 1, params: { name: p.name, from: from.name, to: to.name, dur: T().dur(r.used) } });
    const member = !!FX.Sect.mine(s);
    if (danger > 0 && R.chance(s.rng, Math.min(0.3, C().world.travelEncounterPerDanger * danger * (member ? C().world.travelMemberMult : 1))) && Act.spawnDanger(s, to, '赶路途中，', [hid])) {
      return { text: '抵达' + to.name + '时遇上了麻烦', interrupted: true };
    }
    return { text: '抵达' + to.name };
  };

  /* ---------- 游历 ---------- */
  Act.encounterWeights = (s, place, days) => {
    const E = C().encounter;
    const w = {};
    if (isTown(place)) Object.assign(w, E.townWeights);
    else {
      Object.assign(w, E.weights);
      w.beast *= place.danger;
      w.trouble *= place.danger + 1;
      w.fortune *= place.qi / 3;
    }
    if (me(s).traits.includes('野心勃勃')) w.fortune *= 1.2;
    if (days >= 30) for (const k in w) if (k !== 'nothing') w[k] *= E.longFactor;
    return w;
  };

  Act.DO.explore = (s, a) => {
    const p = me(s), place = here(s), E = C().encounter;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (r.interrupted) return { text: '游历途中出了事', interrupted: true };
    s.player.stats.explores++;
    const w = Act.encounterWeights(s, place, a.days);
    const keys = Object.keys(w).sort();
    let kind = R.weighted(s.rng, keys, (k) => w[k]) || 'nothing';
    // 劫修只挑看得上的人下手：此地没有敢劫你的人，这一回就什么也没遇上
    let robber = null;
    if (kind === 'trouble' && !isTown(place)) { robber = Act.pickRobber(s, place); if (!robber) kind = 'nothing'; }
    // 奇遇冷却：五年内只算一次，多出来的降为普通收获
    let downgraded = false;
    if (kind === 'fortune' && s.t - s.player.lastFortuneT < E.fortuneCooldownDays) downgraded = true;
    const base = { name: p.name, place: place.name, dur: T().dur(a.days) };
    const add = (key, params, sev, extra) => H().add(s, Object.assign({ type: 'explore', tags: ['游历', kind], actors: [p.id], places: [place.id], key, pov: true, severity: sev || 1, params: Object.assign({}, base, params) }, extra || {}));
    switch (kind) {
      case 'herb': {
        const q = R.int(s.rng, E.herbQty[0], E.herbQty[1]);
        giveItem(s, 'herb', q);
        let loot = C().items.herb.name + '×' + q;
        if (R.chance(s.rng, E.rareHerbChance)) { giveItem(s, 'rareHerb', 1); loot += '、' + C().items.rareHerb.name + '×1'; }
        add('explore_herb', { loot });
        seek(s, true);
        return { text: '采得' + loot };
      }
      case 'beast': {
        const d = Math.max(1, place.danger);
        const power = Math.round(E.dangerPower[d] * R.range(s.rng, E.beastSwing[0], E.beastSwing[1]) * 10) / 10;
        const beast = R.pick(s.rng, FX.Combat.beastNames[d]);
        FX.Ev.spawn(s, 'BEAST', { place: place.id, _beast: beast, _power: power, _danger: d }, []);
        seek(s, false); // 是否有收获取决于接下来的决断，这里按“游历本身无收获”记
        s.player.stats.exploreNothing++;

    // 道脉出身的金丹真人，可凭道脉符书改投上宗（不看运气）
    if (place.factionId && place.factionId !== f.id) {
      const g = s.factions[place.factionId], j = Sect.def(g).join;
      if (j && j.daomai && j.daomai === f.key) {
        const why = p.realm.major < j.minMajor ? '道脉弟子要到' + cf.realms.names[j.minMajor] + '才收' : '';
        add({ type: 'transfer', fid: g.id, days: HS().joinDays, label: '持道脉符书改投' + g.name + '（' + M() + '照记）', group: '宗门', ok: !why, reason: why });
      }
    }
    const at = Sect.atSeat(s, f);
    const away = at ? '' : Sect.awayReason(s, f);
    // 辞出：放在宗门页，不放在“此刻”页，免得误点
    add({ type: 'leave', fid: f.id, days: 0, label: '辞出' + f.name + '（' + M() + '作废' + (f.leaderId === p.id ? '，掌门之位交给门中最强的人' : '') + '）', group: '库藏', ok: true, reason: '' });
    // 符诏：除妖
    const mm = Sect.missionMerit(p);
    const hurt = p.health.state === 'heavy' ? '重伤未愈' : '';
    if (mm) add({ type: 'mission', days: HS().mission.days, label: (f.type === 'clan' ? '替家族除妖' : '领符诏除妖') + ' ' + T().dur(HS().mission.days) + '（胜了记 ' + mm + ' ' + M() + '）', group: '宗门', ok: at && !hurt, reason: away || hurt });
    // 长老房请授功法
    for (const e of Sect.library(f)) {
      if (s.player.manuals.includes(e.tech)) continue;
      const lu = Sect.perkOf(s, p, 'daolu'); // 道录殿：传功少花道功
      const t = cf.techniques[e.tech], cost = Math.round((e.merit || 0) * (lu ? 0.8 - 0.1 * lu : 1));
      // 神通不传无缘之人：有的看金丹品第、元神法相、道基，有的要先修过上卷
      const why = e.minMajor && p.realm.major < e.minMajor ? '要到' + cf.realms.names[e.minMajor] + '才传'
        : e.minPin && !(p.danPin && p.danPin <= e.minPin) ? '要' + cf.realms.danPinNames[e.minPin] + '以上才传'
        : e.minXiang && !(p.xiang >= e.minXiang) ? '要' + cf.realms.xiangNames[e.minXiang] + '以上才传'
        : e.minDaoji && !(p.daoji >= e.minDaoji) ? '要' + cf.daojiNames[e.minDaoji] + '以上才传'
        : e.needTech && !s.player.manuals.includes(e.needTech) ? '要先修过《' + cf.techniques[e.needTech].name + '》'
        : cost > s.player.merit ? M() + '不够（需 ' + cost + '）' : away;
      add({ type: 'sect_learn', tech: e.tech, days: HS().learnDays, cost, label: (cost ? '以 ' + cost + ' ' + M() + '换《' : '请授《') + t.name + '》', group: '库藏', ok: !why, reason: why });
      // 二十五正法：四院大比魁首凭道录殿符诏任取一门，不论道功、品第、法相
      if (e.zf && (s.player.inv.dulu || 0) > 0) add({ type: 'sect_learn', tech: e.tech, zf: true, days: HS().learnDays, cost: 0, label: '持道录殿符诏取《' + t.name + '》（' + e.zf + '）', group: '库藏', ok: !away, reason: away });
    }
    // 库藏兑换
    for (const e of Sect.store(f)) {
      const cost = Math.max(1, Math.round(e.merit * redeemMult(s, e.item)));
      const why = e.minMajor && p.realm.major < e.minMajor ? '要到' + cf.realms.names[e.minMajor] + '才换给你' : cost > s.player.merit ? M() + '不够（需 ' + cost + '）' : away;
      add({ type: 'redeem', item: e.item, days: 0, cost, label: '以 ' + cost + ' ' + M() + '换' + cf.items[e.item].name, group: '库藏', ok: !why, reason: why });
    }
    // 功德房：上交妖物内丹、外药，献上本门没有的道书抄本
    for (const k in HS().submit) if (s.player.inv[k] > 0) {
      const n = s.player.inv[k], gain = Math.round(n * HS().submit[k] * gainMult(s));
      add({ type: 'submit', item: k, days: 0, gain, label: '上交' + cf.items[k].name + '×' + n + '（记 ' + gain + ' ' + M() + '）', group: '库藏', ok: at, reason: away });
    }
    // 功德殿捐输：八派六宗的门人可以拿符钱折道功
    const DN = HS().donate;
    if (f.tier >= DN.minTier) {
      const why = s.player.stone < DN.stone ? '符钱不够（需 ' + DN.stone + '）' : away;
      const gain = Math.round(DN.merit * gainMult(s));
      add({ type: 'donate', days: 0, cost: DN.stone, gain, label: '向功德殿捐输 ' + DN.stone + ' 符钱（记 ' + gain + ' ' + M() + '）', group: '库藏', ok: !why, reason: why });
    }
    // 玉宸九殿：元神以后入殿任职，转殿要隔几十年
    if (f.key === 'yuchen' && p.realm.major >= 7) {
      const HD = HL(), wait = p.hall && p.hallYear !== undefined ? HD.every - (s.year - p.hallYear) : 0;
      for (const k of HD.order) {
        if (p.hall === k) continue;
        const d = HD.defs[k];
        const why = d.minMajor && p.realm.major < d.minMajor ? '要到' + cf.realms.names[d.minMajor] + '才入得（' + d.name + '是高辈上真清修之所）'
          : d.minXiang && !(p.xiang >= d.minXiang) ? '要' + cf.realms.xiangNames[d.minXiang] + '以上'
          : d.needShida && !(p.flags.includes('shida') || p.realm.major >= 8) ? '要是上宗真传（四院大比入过十大弟子），或已成返虚'
          : wait > 0 ? '转殿要隔 ' + HD.every + ' 年（还要 ' + wait + ' 年）' : away;
        add({ type: 'hall', hall: k, days: HD.days, label: (p.hall ? '转入' : '入') + d.name + '任职', group: '库藏', ok: !why, reason: why });
      }
    }
    for (const t of s.player.manuals) {
      const g = Math.round(Sect.manualMerit(s, f, t) * gainMult(s));
      if (g > 0) add({ type: 'submit', tech: t, days: 0, gain: g, label: '献上《' + cf.techniques[t].name + '》抄本（记 ' + g + ' ' + M() + '）', group: '库藏', ok: at, reason: away });
    }
  };

  /* ---------- 结算 ---------- */
  const DO = {};

  DO.join = (s, a) => {
    const p = me(s), f = s.factions[a.fid];
    const ch = Sect.joinChance(s, f);
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (s.pending.length) return { text: '还没见到人，先出了变故', interrupted: true };
    const ok = R.next(s.rng) * 100 < ch.chance;
    const tried = s.player.joinTried[f.id] || { year: 0, fails: 0 };
    s.player.joinTried[f.id] = { year: s.year, fails: tried.fails + (ok ? 0 : 1) };
    Act().seek(s, ok);
    if (!ok) {
      H().add(s, { type: 'join', tags: ['宗门'], actors: [p.id], factions: [f.id], places: [f.seatId], key: 'join_fail', pov: true, severity: 2, params: { name: p.name, faction: f.name, chance: ch.chance } });
      return { text: f.name + '没有收你（' + ch.chance + '%）' };
    }
    p.factionId = f.id;
    p.role = 'member';
    f.relToPlayer = Math.max(f.relToPlayer, 10);
    if (f.leaderId && P().alive(s.people[f.leaderId])) P().adjustRelation(s, p.id, f.leaderId, 8, '同门');
    const hid = H().add(s, { type: 'join', tags: ['宗门'], actors: [p.id], factions: [f.id], places: [f.seatId], key: 'join_ok', pov: true, severity: 3, params: { name: p.name, faction: f.name, chance: ch.chance } });
    H().markFirst(s, 'join', hid);
    return { text: '拜入' + f.name + '（' + ch.chance + '%）' };
  };

  DO.sect_learn = (s, a) => {
    const p = me(s), f = Sect.mine(s);
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    s.player.merit -= a.cost;
    if (a.zf) s.player.inv.dulu--;
    if (!s.player.manuals.includes(a.tech)) s.player.manuals.push(a.tech);
    const t = C().techniques[a.tech];
    H().add(s, { type: 'learn', tags: ['功法', '宗门'], actors: [p.id], factions: [f.id], key: a.cost ? 'sect_learn_merit' : 'sect_learn', pov: true, severity: 2, params: { name: p.name, faction: f.name, tech: t.name, cost: a.cost, merit: M() } });
    const hint = t.kind === 'lianqi' && p.techniqueId !== a.tech ? '，可去行囊里研习' : t.kind === 'shu' ? '，可去行囊里参习' : '';
    return { text: '得了《' + t.name + '》' + hint };
  };

  DO.hall = (s, a) => {
    const p = me(s), f = Sect.mine(s), d = HL().defs[a.hall];
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    const from = p.hall ? HL().defs[p.hall].name : '';
    p.hall = a.hall; p.hallYear = s.year;
    if (a.hall === 'danfu' && !p.hallDan) p.hallDan = s.year;
    H().add(s, { type: 'post', tags: ['宗门'], actors: [p.id], factions: [f.id], key: 'hall_join', pov: true, severity: 3, params: { name: p.name, hall: d.name, post: Sect.postName(s, f, p), from: from ? '从' + from + '转来，' : '', duty: d.duty, perk: d.perk } });
    return { text: '入' + d.name + '任职：' + d.perk };
  };

  DO.redeem = (s, a) => {
    const p = me(s), f = Sect.mine(s), n = a.qty || 1;
    s.player.merit -= a.cost * n;
    s.player.inv[a.item] = (s.player.inv[a.item] || 0) + n;
    const item = C().items[a.item].name + (n > 1 ? '×' + n : '');
    H().add(s, { type: 'redeem', tags: ['宗门'], actors: [p.id], factions: [f.id], key: 'redeem', pov: true, severity: 1, params: { name: p.name, faction: f.name, item, cost: a.cost * n, merit: M() } });
    return { text: '换得' + item };
  };

  DO.donate = (s, a) => {
    const p = me(s), f = Sect.mine(s), n = a.qty || 1;
    s.player.stone -= a.cost * n;
    s.player.merit += a.gain * n;
    H().add(s, { type: 'submit', tags: ['宗门'], actors: [p.id], factions: [f.id], key: 'submit', pov: true, severity: 1, params: { name: p.name, faction: f.name, what: '符钱 ' + a.cost * n, gain: a.gain * n, merit: M() } });
    return { text: '捐输符钱 ' + a.cost * n + '，记 ' + a.gain * n + ' ' + M() };
  };

  DO.submit = (s, a) => {
    const p = me(s), f = Sect.mine(s);
    let what;
    if (a.tech) { s.player.submitted.push(a.tech); what = '《' + C().techniques[a.tech].name + '》抄本'; }
    else { what = C().items[a.item].name + '×' + s.player.inv[a.item]; s.player.inv[a.item] = 0; }
    s.player.merit += a.gain;
    H().add(s, { type: 'submit', tags: ['宗门'], actors: [p.id], factions: [f.id], key: 'submit', pov: true, severity: 1, params: { name: p.name, faction: f.name, what, gain: a.gain, merit: M() } });
    return { text: '记 ' + a.gain + ' ' + M() };
  };

  // 符诏：赶到附近的荒野除一头妖物。对手按你的战力定；打赢才记道功，逃了就算没办成
  DO.mission = (s, a) => {
    const p = me(s), f = Sect.mine(s), E = C().encounter, MS = HS().mission;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (r.interrupted || s.pending.length) return { text: '还没动身就出了变故', interrupted: true };
    // 去离山门最近的几处荒野；筑基以后也会被派去险地
    const wild = (x) => x.type === 'wild' || (x.type === 'danger' && p.realm.major >= 3);
    const spots = Object.values(s.places).filter(wild).map((x) => ({ x, d: FX.World.route(s, f.seatId, x.id) })).filter((o) => o.d)
      .sort((a, b) => a.d.days - b.d.days || (a.x.id < b.x.id ? -1 : 1)).slice(0, 3);
    const spot = R.pick(s.rng, spots).x;
    const power = Math.round(P().power(s, p) * R.range(s.rng, MS.powerSwing[0], MS.powerSwing[1]) * 10) / 10;
    let d = 1;
    for (let i = 1; i < E.dangerPower.length; i++) if (Math.abs(E.dangerPower[i] - power) < Math.abs(E.dangerPower[d] - power)) d = i;
    const beast = R.pick(s.rng, FX.Combat.beastNames[d]);
    const why = f.type === 'clan' ? '族里托你除掉的那头' : '奉事房符诏上要除的那头';
    FX.Ev.spawn(s, 'BEAST', { place: spot.id, _beast: beast, _power: power, _danger: d, _why: why, _merit: Sect.missionMerit(p), _stone: R.int(s.rng, MS.stone[0], MS.stone[1]) }, []);
    return { text: '在' + spot.name + '找到了' + beast, interrupted: true };
  };

  // 离开本门：掌门（家主）之位交给门中修为最高的人
  const leaveFaction = (s, p, f) => {
    if (f.leaderId === p.id) {
      const next = P().living(s).filter((q) => q.factionId === f.id && q.id !== p.id).sort((a, b) => P().realmRank(b) - P().realmRank(a) || (a.id < b.id ? -1 : 1))[0];
      f.leaderId = next ? next.id : null;
      if (next) next.role = 'leader';
    }
    p.factionId = null;
    p.role = 'loose';
    s.player.post = 0;
    s.player.tuijuDeclined = null;
  };
  DO.leave = (s, a) => {
    const p = me(s), f = s.factions[a.fid];
    leaveFaction(s, p, f);
    s.player.merit = 0;
    H().add(s, { type: 'join', tags: ['宗门'], actors: [p.id], factions: [f.id], key: 'leave', pov: true, severity: 3, params: { name: p.name, faction: f.name } });
    return { text: '辞出了' + f.name };
  };
  DO.transfer = (s, a) => {
    const p = me(s), from = Sect.mine(s), g = s.factions[a.fid];
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (s.pending.length) return { text: '还没见到人，先出了变故', interrupted: true };
    const def = C().factionDefs.find((d) => d.key === g.key);
    const note = def && def.transferNote ? def.transferNote : '';
    leaveFaction(s, p, from);
    p.factionId = g.id;
    p.role = 'member';
    g.relToPlayer = Math.max(g.relToPlayer, 20);
    if (g.leaderId && P().alive(s.people[g.leaderId])) P().adjustRelation(s, p.id, g.leaderId, 8, '同门');
    const hid = H().add(s, { type: 'join', tags: ['宗门', '大事'], actors: [p.id], factions: [g.id, from.id], places: [g.seatId], key: 'transfer', pov: true, severity: 4, params: { name: p.name, from: from.name, faction: g.name, note: note ? '，' + note : '' } });
    H().markFirst(s, 'join_' + g.key, hid);
    return { text: '改投' + g.name + (note ? '，' + note : '') };
  };

  Sect.DO = DO;

  FX.EVENTS.TUIJU = {
    name: '推举掌门', category: '宗门', severity: 4,
    text: (s, b, n) => { const q = s.people[b.lead]; return `${n.faction}的${n.lead}（${P().realmName(q)}）执掌门户多年，可如今你已是${P().realmName(me(s))}，修为远在其上。门中长老商议，要推举你接任${s.factions[b.faction].type === 'clan' ? '家主' : '掌门'}。`; },
    options: [
      {
        id: 'accept', label: '接任',
        cost: () => '往后要担起门户', risk: () => '无', outcome: (s, b) => '成为' + s.factions[b.faction].name + (s.factions[b.faction].type === 'clan' ? '家主' : '掌门') + '，俸禄按'+(s.factions[b.faction].type === 'clan' ? '家主' : '掌门')+'的份例发',
        apply(s, b) {
          const f = s.factions[b.faction], p = me(s), q = s.people[b.lead];
          f.leaderId = p.id; p.role = 'leader'; q.role = 'elder';
          P().adjustRelation(s, p.id, q.id, -5, '让位');
          return { text: '接任' + f.name + (f.type === 'clan' ? '家主' : '掌门') };
        },
      },
      {
        id: 'decline', label: '推辞',
        cost: () => '无', risk: () => '无', outcome: () => '照旧做长老，专心修行；' + HS().tuijuAgain + ' 年内不再提',
        apply(s, b) { s.player.tuijuDeclined = s.year; P().adjustRelation(s, me(s).id, b.lead, 5, '推辞'); return { text: '推辞了掌门之位' }; },
      },
    ],
  };
  FX.Sect = Sect;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/saga.js ---------- */
/* ============================================================
 * saga —— 天下大事与后期玩法：地渊开启、花神府撷芳宴、玉宸派道脉校考、天魔潮、丹元大会、仇家寻仇、洞府、洞天
 * 大事的日期开局就由种子排好，提前几年放出风声（写进纪事），玩家可以预先准备。
 * 成败照旧由规则掷骰；但每件大事都给出稳妥的选项，运气只决定得多得少。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;
  const H = () => FX.H;
  const T = () => FX.T;
  const W = () => FX.World;
  const CU = () => FX.CU;
  const Sim = () => FX.Sim;
  const Sect = () => FX.Sect;
  const Cb = () => FX.Combat;

  const Saga = {};
  const SG = () => C().saga;
  const KINDS = ['diyuan', 'xiefang', 'jiaokao', 'tianmo', 'danyuan', 'liuhuo', 'dabi'];
  const me = (s) => P().player(s);
  const pl = (s) => P().player(s);
  const give = (s, k, n) => { s.player.inv[k] = (s.player.inv[k] || 0) + n; };
  const giveAny = (s, key) => {
    if (key.startsWith('tech:')) { const t = key.slice(5); if (!s.player.manuals.includes(t)) s.player.manuals.push(t); return W().itemName(key); }
    give(s, key, 1);
    return C().items[key].name;
  };
  const factionByKey = (s, key) => Object.values(s.factions).find((f) => f.key === key) || null;
  const placeByName = (s, name) => Object.values(s.places).find((x) => x.name === name) || null;

  /* ---------- 排期 ---------- */
  // 只补上还没有排期的大事（旧存档迁移时，已有的排期不动）
  Saga.init = (s) => {
    s.saga = s.saga || {};
    for (const k of KINDS) if (!s.saga[k]) s.saga[k] = { next: s.year + R.int(s.rng, SG()[k].first[0], SG()[k].first[1]), open: null, done: null, count: 0 };
  };

  // 本次大事正在进行（返回开始的年份），否则 null
  Saga.openYear = (s, k) => (s.saga[k].open && s.year <= s.saga[k].open.until ? s.saga[k].open.from : null);

  // 返回今年起了的、和主角沾边的大事名（闭关时据此出关）
  Saga.yearly = (s) => {
    const n = SG().notice;
    let woke = null;
    for (const k of KINDS) {
      const st = s.saga[k], cfg = SG()[k];
      if (st.open && s.year > st.open.until) {
        if (k === 'diyuan') Saga.diyuanToll(s);
        if (k === 'tianmo') Saga.tianmoToll(s);
        if (k === 'liuhuo') Saga.liuhuoToll(s);
        st.open = null;
        st.next = s.year + R.int(s.rng, cfg.every[0], cfg.every[1]);
      }
      if (st.open) continue;
      // 和你沾不上边的大事（比如元神真人看撷芳宴）只记作传闻，不写进你的经历
      const rel = Saga.relevant(s, k);
      if (s.year === st.next - n) H().add(s, { type: 'saga', tags: ['大事', '风声'], key: 'saga_notice', pov: rel, severity: 3, params: { what: cfg.name, year: st.next, hint: Saga.hint(s, k) } });
      if (s.year >= st.next) {
        st.open = { from: s.year, until: s.year + cfg.years - 1 };
        st.count++;
        H().add(s, { type: 'saga', tags: ['大事'], key: 'saga_open_' + k, pov: rel, severity: rel ? 4 : 2, params: { what: cfg.name, hint: Saga.hint(s, k) } });
        if (rel && !woke) woke = cfg.name;
      }
    }
    Saga.revengeYear(s);
    Sect().tuijuYear(s);
    return woke;
  };

  // 这件大事和主角眼下沾不沾边
  Saga.relevant = (s, k) => {
    const p = me(s), m = p.realm.major, f = Sect().mine(s);
    if (k === 'diyuan') return m >= SG().diyuan.minMajor && m <= 6;
    if (k === 'xiefang') return !p.factionId && m >= SG().xiefang.minMajor && m <= 5;
    if (k === 'jiaokao') return !!f && f.key === SG().jiaokao.faction;
    if (k === 'tianmo') return m >= SG().tianmo.minMajor;
    if (k === 'danyuan') return m >= 5;
    if (k === 'liuhuo') return !!f && f.key === SG().liuhuo.faction && m >= SG().liuhuo.minMajor;
    if (k === 'dabi') return !!f && f.key === SG().dabi.faction && m === SG().dabi.major && P().age(s, p) <= SG().dabi.maxAge;
    return true;
  };

  // 每件大事对玩家的提示：去哪、要什么条件
  Saga.hint = (s, k) => {
    const cfg = SG()[k];
    if (k === 'danyuan') return '胥都天八派六宗的金丹天骄争雄斗法，魁首得胥都大丹；八派六宗的金丹门人回本门山门，由本门遣送赴会';
    if (k === 'dabi') return '玉宸四大下院的年轻弟子在齐云山连斗五场，三场以上入十大弟子，五场全胜的魁首得道录殿符诏、可从二十五正法里任取一门；玉宸的金丹门人（年不过 ' + cfg.maxAge + '）回宵明大泽由本门遣送';
    if (k === 'liuhuo') return '玉宸派金丹以上的门人可到' + cfg.place + '，入洞天寻造化：外层稳得火炁，往深处去要斗法';
    if (k === 'diyuan') { const pl2 = placeByName(s, cfg.place); return '到' + (pl2 ? pl2.name : cfg.place) + '去，练炁以上都能进'; }
    if (k === 'xiefang') { const f = factionByKey(s, cfg.faction); return '无门无派、练炁以上的散修可到' + (f ? s.places[f.seatId].name : '花神府') + '赴宴，要交供奉'; }
    if (k === 'tianmo') return '天魔从' + cfg.places.join('、') + '一带涌出，玉宸派发下敕令，召各家' + C().realms.names[cfg.minMajor] + '以上的修士前去镇守';
    const f = factionByKey(s, cfg.faction);
    return (f ? f.name : '玄真派') + '弟子回' + (f ? s.places[f.seatId].name : '山门') + '应考，按同辈排名评上、中、下考';
  };

  // 天下大事一览（界面用）：正在进行的、有了风声的；道脉校考三十年一回，人人知道日子
  Saga.view = (s) => KINDS.map((k) => {
    const st = s.saga[k], cfg = SG()[k];
    const open = Saga.openYear(s, k) !== null;
    const known = open || k === 'jiaokao' || st.next - s.year <= SG().notice;
    return { kind: k, name: cfg.name, open, known, relevant: Saga.relevant(s, k), year: open ? st.open.from : st.next, until: open ? st.open.until : null, done: open && st.done === st.open.from, hint: Saga.hint(s, k), at: open || st.next - s.year <= SG().notice ? Saga.where(s, k) : null };
  });

  // 赴这件大事要去哪里（界面上给“赶过去”用）；天魔潮有几处，给离得最近的
  Saga.where = (s, k) => {
    const cf = SG()[k], mf = Sect().mine(s), p = me(s);
    if (k === 'diyuan' || k === 'liuhuo') { const pl = placeByName(s, cf.place); return pl ? pl.id : null; }
    if (k === 'xiefang' || k === 'jiaokao') { const f = factionByKey(s, cf.faction); return f ? f.seatId : null; }
    if (k === 'danyuan' || k === 'dabi') return mf ? mf.seatId : null;
    if (k === 'tianmo') {
      let best = null;
      for (const n of cf.places) { const pl = placeByName(s, n); const r = pl && FX.World.route(s, p.locationId, pl.id, p); if (r && (!best || r.days < best.days)) best = { id: pl.id, days: r.days }; }
      return best ? best.id : null;
    }
    return null;
  };

  /* ---------- 行动清单（由 Act.list 调用）---------- */
  Saga.list = (s, add) => {
    const p = me(s), place = s.places[p.locationId], cf = C();
    // 地渊
    const dy = SG().diyuan;
    if (Saga.openYear(s, 'diyuan') !== null && place.name === dy.place) {
      const done = s.saga.diyuan.done === s.saga.diyuan.open.from;
      const why = done ? '这回地渊开启已经进去过了' : p.realm.major < dy.minMajor ? '练炁以上才进得去' : p.health.state === 'heavy' ? '重伤未愈' : '';
      add({ type: 'diyuan', days: dy.days, label: '深入地渊 ' + T().dur(dy.days), group: '大事', ok: !why, reason: why });
    }
    // 撷芳宴
    const xf = SG().xiefang;
    const hs = factionByKey(s, xf.faction);
    if (hs && Saga.openYear(s, 'xiefang') !== null && place.id === hs.seatId && !p.factionId) {
      const fee = Saga.xiefangFee(p);
      const done = s.saga.xiefang.done === s.saga.xiefang.open.from;
      const why = done ? '这回撷芳宴你已经赴过了' : p.realm.major < xf.minMajor ? '练炁以上才收' : p.health.state !== 'healthy' ? '带伤赴宴是送死' : s.player.stone < fee ? '供奉不够（需 ' + fee + ' 符钱）' : '';
      add({ type: 'xiefang', days: xf.days, cost: fee, label: '赴撷芳宴（供奉 ' + fee + ' 符钱，连斗 ' + xf.rounds + ' 场）', group: '大事', ok: !why, reason: why });
    }
    // 道脉校考
    const jk = SG().jiaokao;
    const xz = factionByKey(s, jk.faction);
    if (xz && Saga.openYear(s, 'jiaokao') !== null && p.factionId === xz.id) {
      const done = s.saga.jiaokao.done === s.saga.jiaokao.open.from;
      const why = done ? '这回校考已经应过了' : place.id !== xz.seatId ? '要回到' + s.places[xz.seatId].name + '应考' : '';
      add({ type: 'jiaokao', days: jk.days, label: '应道脉校考（预计' + Saga.grade(s).name + '）', group: '大事', ok: !why, reason: why });
    }
    // 天魔潮
    const tm = SG().tianmo;
    if (Saga.openYear(s, 'tianmo') !== null && tm.places.includes(place.name)) {
      const done = s.saga.tianmo.done === s.saga.tianmo.open.from && s.saga.tianmo.doneYear === s.year;
      const why = done ? '今年已经镇守过一回了' : p.realm.major < tm.minMajor ? C().realms.names[tm.minMajor] + '以上才收' : p.health.state === 'heavy' ? '重伤未愈' : '';
      add({ type: 'tianmo', days: tm.days, label: '应敕令镇守' + place.name + ' ' + T().dur(tm.days), group: '大事', ok: !why, reason: why });
    }
    // 丹元大会：八派六宗的金丹门人在本门山门由本门遣送
    const dy2 = SG().danyuan;
    const mf = Sect().mine(s);
    if (Saga.openYear(s, 'danyuan') !== null && mf && mf.tier >= dy2.tier && place.id === mf.seatId) {
      const done = s.saga.danyuan.done === s.saga.danyuan.open.from;
      const why = done ? '这回丹元大会已经去过了' : p.realm.major !== dy2.major ? '只有金丹真人能赴会' : p.health.state !== 'healthy' ? '带伤赴会是自取其辱' : '';
      add({ type: 'danyuan', days: dy2.days, label: '随本门赴丹元大会（连斗 ' + dy2.rounds + ' 场，可随时认输）', group: '大事', ok: !why, reason: why });
    }
    // 玉宸四院大比：玉宸的年轻金丹门人在宵明大泽由本门遣送
    const db = SG().dabi;
    if (Saga.openYear(s, 'dabi') !== null && mf && mf.key === db.faction && place.id === mf.seatId) {
      const done = s.saga.dabi.done === s.saga.dabi.open.from;
      const why = done ? '这回大比已经去过了' : p.realm.major !== db.major ? '只有金丹门人能赴会' : P().age(s, p) > db.maxAge ? '年岁太大，四院不收' : p.health.state !== 'healthy' ? '带伤赴会是自取其辱' : '';
      add({ type: 'dabi', days: db.days, label: '赴玉宸四院大比（连斗 ' + db.rounds + ' 场，可随时认输）', group: '大事', ok: !why, reason: why });
    }
    // 流火宏化洞天
    const lh = SG().liuhuo;
    if (Saga.openYear(s, 'liuhuo') !== null && place.name === lh.place) {
      const done = s.saga.liuhuo.done === s.saga.liuhuo.open.from;
      const why = done ? '这回洞天显世已经进去过了' : !mf || mf.key !== lh.faction ? '洞天归玉宸派所有，外人进不去' : p.realm.major < lh.minMajor ? C().realms.names[lh.minMajor] + '以上的门人才放进去' : p.health.state === 'heavy' ? '重伤未愈' : '';
      add({ type: 'liuhuo', days: lh.days, label: '入流火宏化洞天寻造化 ' + T().dur(lh.days), group: '大事', ok: !why, reason: why });
    }
    // 拜谒颜熙真君（元神以后，到真君所在之处）
    const yx = SG().yanxi;
    const yan = Object.values(s.people).find((q) => q.notable === 'yanxi');
    if (yan && P().alive(yan) && yan.locationId === place.id && !p.flags.includes('yanxi')) {
      const again = s.player.yanxiTried && s.year < s.player.yanxiTried + yx.again;
      const why = p.realm.major < yx.minMajor ? '真君不见元神以下的修士' : again ? '上回没见着，' + (s.player.yanxiTried + yx.again) + ' 年后再来' : '';
      add({ type: 'yanxi', npc: yan.id, days: 30, label: '拜谒颜熙真君，求问返虚之道（约 ' + yx.chance + '% 肯见）', group: '大事', ok: !why, reason: why });
    }
    // 洞天（元神以后，在东海）
    const DT = cf.dongtian;
    if (place.type === DT.placeType && s.player.dongtian !== place.id) {
      const ji = s.player.inv.dongtianji > 0;
      const cost = ji ? Math.round(DT.cost / 2) : DT.cost, days = ji ? DT.days - 360 : DT.days;
      const why = p.realm.major < DT.minMajor ? C().realms.names[DT.minMajor] + '以后才开得了洞天' : s.player.stone < cost ? '符钱不够（需 ' + cost + '）' : '';
      add({ type: 'dongtian', days, cost, label: '在' + place.name + '开辟洞天（' + cost + ' 符钱，' + T().dur(days) + (ji ? '，用上洞天残基' : '') + '）', group: '修炼', ok: !why, reason: why });
    }
    // 洞府
    const D = cf.dongfu;
    if ((place.type === 'wild' || place.type === 'danger') && place.qi >= D.minQi && s.player.dongfu !== place.id) {
      const cost = D.cost[place.qi];
      const why = p.realm.major < D.minMajor ? '筑基以后才开得了洞府' : s.player.stone < cost ? '符钱不够（需 ' + cost + '）' : '';
      add({ type: 'dongfu', days: 30, cost, label: (s.player.dongfu ? '把洞府迁到此地（' : '在此开辟洞府（') + cost + ' 符钱）', group: '修炼', ok: !why, reason: why });
    }
  };

  /* ---------- 地渊 ---------- */
  const DIYUAN_FOES = [['阴马', '行尸'], ['金纹豹妖', '恶嗔阴魔'], ['下位天魔', '朱厌大妖']];
  Saga.DO = {};
  Saga.DO.diyuan = (s, a) => {
    const p = me(s), dy = SG().diyuan;
    s.player.stats.sagas = (s.player.stats.sagas || 0) + 1;
    s.saga.diyuan.done = s.saga.diyuan.open.from; // 先记下：进去的这一趟可能跨年，地渊合上也算这回去过
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (r.interrupted || s.pending.length) return { text: '还没进去就出了变故', interrupted: true };
    const my = P().power(s, p);
    const pick = (i) => R.pick(s.rng, DIYUAN_FOES[i]);
    const xz = factionByKey(s, 'xuanzhen');
    const fuzhao = xz && p.factionId === xz.id ? Sect().taskMerit(p) : 0;
    FX.Ev.spawn(s, 'DIYUAN', {
      place: p.locationId, _fuzhao: fuzhao,
      _midBeast: pick(Math.min(2, Math.max(0, p.realm.major - 2))), _midPower: Math.round(my * R.range(s.rng, dy.midSwing[0], dy.midSwing[1]) * 10) / 10,
      _deepBeast: pick(Math.min(2, Math.max(0, p.realm.major - 1))), _deepPower: Math.round(my * R.range(s.rng, dy.deepSwing[0], dy.deepSwing[1]) * 10) / 10,
    }, []);
    return { text: '下到地渊里头', interrupted: true };
  };
  // 地渊合上时，进去的人里总有几个没出来
  Saga.diyuanToll = (s) => {
    const dy = SG().diyuan;
    const pool = P().living(s).filter((q) => !P().isPlayer(s, q) && q.realm.major >= 2 && q.realm.major <= 3).sort((a, b) => (a.id < b.id ? -1 : 1));
    const n = R.int(s.rng, dy.npcDeaths[0], dy.npcDeaths[1]);
    for (let i = 0; i < n && pool.length; i++) {
      const q = pool.splice(R.int(s.rng, 0, pool.length - 1), 1)[0];
      P().kill(s, q, '殒于地渊', [], {});
    }
  };
  // 越深所得越好；打赢就一定有，按境界给用得上的
  const deepGift = (p) => (p.realm.major >= 6 ? 'dingshen' : p.realm.major >= 5 ? 'ningdan' : p.realm.major >= 4 ? 'yusui' : 'danmusha');
  const meritFor = (s, b, layer) => { const m = b._fuzhao * SG().diyuan.merit[layer]; if (m) s.player.merit += m; return m ? '，地渊符诏记' + C().house.meritName + ' ' + m : ''; };
  const layerFoe = (layer) => (s, b) => ({
    name: b[layer === 'deep' ? '_deepBeast' : '_midBeast'], power: b[layer === 'deep' ? '_deepPower' : '_midPower'],
    winText: layer === 'deep' ? '斩了它，取深处的大药' : '斩了它，取中层的五行之精',
    onWin(s2, b2) {
      const p = pl(s2);
      const got = [];
      if (layer === 'deep') { got.push(giveAny(s2, deepGift(p))); give(s2, 'wujing', 2); got.push(C().items.wujing.name + '×2'); }
      else { give(s2, 'wujing', 1); give(s2, 'rareHerb', 2); got.push(C().items.wujing.name, C().items.rareHerb.name + '×2'); }
      return '得' + got.join('、') + meritFor(s2, b2, layer);
    },
  });
  const layerOpt = (layer, label) => Object.assign({}, Cb().fightOpt(layerFoe(layer)), {
    id: layer, label,
    outcome: (s, b) => (layer === 'deep' ? '打赢可得' + C().items[deepGift(pl(s))].name + '与先天五行之精×2' : '打赢可得先天五行之精、人面芝×2') + (b._fuzhao ? '，并记道功' : ''),
  });

  /* ---------- 撷芳宴 ---------- */
  Saga.xiefangFee = (p) => SG().xiefang.fee.base + P().realmRank(p) * SG().xiefang.fee.perRank;
  Saga.DO.xiefang = (s, a) => {
    const p = me(s);
    s.player.stone -= a.cost;
    s.player.stats.sagas = (s.player.stats.sagas || 0) + 1;
    s.saga.xiefang.done = s.saga.xiefang.open.from;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (s.pending.length) return { text: '开宴前出了变故，供奉没退', interrupted: true };
    H().add(s, { type: 'saga', tags: ['大事', '撷芳宴'], actors: [p.id], places: [p.locationId], key: 'xiefang_enter', pov: true, severity: 3, params: { name: p.name, fee: a.cost } });
    Saga.xiefangRound(s, 1);
    return { text: '撷芳宴开席', interrupted: true, used: r.used };
  };
  Saga.xiefangRound = (s, round) => {
    const p = me(s), xf = SG().xiefang;
    const rank = U.clamp(P().realmRank(p) + R.int(s.rng, xf.foeRank[0], xf.foeRank[1]), 2, P().rankOf(6, 3));
    const foe = W().spawnNpc(s, { realm: P().realmFromRank(rank), locationId: p.locationId, kind: 'loose' });
    FX.Ev.spawn(s, 'XIEFANG', { place: p.locationId, foe: foe.id, _round: round }, []);
  };
  const xiefangFoe = (s, b) => {
    const q = s.people[b.foe];
    return {
      name: q.name, power: P().power(s, q), winText: b._round < SG().xiefang.rounds ? '胜了这场，进下一场' : '胜下最后一场，拜入花神府',
      onWin(s2, b2) {
        const xf = SG().xiefang;
        if (R.chance(s2.rng, xf.loserDies)) P().kill(s2, q, '殒于撷芳宴', [], {}); else P().injure(s2, q, 'heavy');
        if (b2._round < xf.rounds) { Saga.xiefangRound(s2, b2._round + 1); return '第 ' + b2._round + ' 场胜了，还有 ' + (xf.rounds - b2._round) + ' 场'; }
        const p = pl(s2), f = factionByKey(s2, xf.faction);
        p.factionId = f.id; p.role = 'member';
        f.relToPlayer = Math.max(f.relToPlayer, 10);
        const hid = H().add(s2, { type: 'join', tags: ['宗门', '撷芳宴'], actors: [p.id], factions: [f.id], key: 'xiefang_win', pov: true, severity: 4, params: { name: p.name, faction: f.name } });
        H().markFirst(s2, 'join', hid);
        return '连胜 ' + xf.rounds + ' 场，拜入' + f.name;
      },
      onLose() {},
    };
  };

  /* ---------- 道脉校考 ---------- */
  // 按同辈排名评定（确定的，不掷骰）：同辈里修为最高为上考，不低于中位为中考，否则下考
  Saga.grade = (s) => {
    const p = me(s), jk = SG().jiaokao;
    const age = P().age(s, p), my = P().realmRank(p);
    const peers = P().living(s).filter((q) => q.id !== p.id && q.factionId === p.factionId && Math.abs(P().age(s, q) - age) <= jk.peerAge).map((q) => P().realmRank(q)).sort((a, b) => a - b);
    let g;
    if (!peers.length) g = p.realm.major >= 3 ? 3 : 2;
    else if (my >= peers[peers.length - 1]) g = 3;
    else if (my >= peers[Math.floor(peers.length / 2)]) g = 2;
    else g = 1;
    return { g, name: ['', '下考', '中考', '上考'][g], peers: peers.length };
  };
  Saga.DO.jiaokao = (s, a) => {
    const p = me(s), jk = SG().jiaokao, f = s.factions[p.factionId];
    s.player.stats.sagas = (s.player.stats.sagas || 0) + 1;
    s.saga.jiaokao.done = s.saga.jiaokao.open.from;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (r.interrupted || s.pending.length) return { text: '应考前出了变故', interrupted: true };
    const gr = Saga.grade(s);
    const tm = Sect().taskMerit(p);
    let what;
    if (gr.g === 3) {
      const gift = jk.upperGift[p.realm.major];
      const giftName = gift && !(gift.startsWith('tech:') && s.player.manuals.includes(gift.slice(5))) && !(C().items[gift] && C().items[gift].book && s.player.inv[gift] > 0) ? giveAny(s, gift) : null;
      s.player.merit += tm * jk.upperMerit;
      // 荐入玉宸派听讲三年
      Sim().passDays(s, jk.tingjiangDays, 'other');
      if (!P().alive(p)) return { text: '' };
      const gain = Math.round(CU().addProgress(s, p, Math.min(P().need(p), 20000) * jk.tingjiangGain) * 10) / 10;
      // 修为早已圆满的，听讲所得化作冲关前的积累
      if (!gain && P().isFull(p)) p.fullDays += jk.tingjiangDays;
      const got = gain ? '修为 +' + gain : '修为早已圆满，听讲三年只添了几分积累';
      what = '评为上考，由派主举荐入玉宸派听讲三年，' + got + (giftName ? '，得玉宸派下赐' + giftName : '') + '，记' + C().house.meritName + ' ' + tm * jk.upperMerit;
    } else if (gr.g === 2) {
      s.player.merit += tm * jk.midMerit;
      give(s, 'qiju', jk.midQiju);
      what = '评为中考，记' + C().house.meritName + ' ' + tm * jk.midMerit + '，得' + C().items.qiju.name + '×' + jk.midQiju;
    } else what = '评为下考，同辈里修为落在后头，什么也没得';
    H().add(s, { type: 'saga', tags: ['大事', '校考'], actors: [p.id], factions: [f.id], key: 'jiaokao', pov: true, severity: gr.g === 3 ? 4 : 2, params: { name: p.name, what } });
    return { text: what };
  };

  /* ---------- 仇家寻仇 ---------- */
  Saga.revengeYear = (s) => {
    const p = me(s), rv = SG().revenge;
    if (!P().alive(p) || s.pending.length) return;
    const f = Sect().mine(s);
    if (f && p.locationId === f.seatId) return; // 在山门里，仇家不敢来
    const foes = P().relationsOf(s, p.id).filter((r) => r.strength <= C().relations.feudThreshold && r.tags.includes('交手'))

      .sort((a, b) => (a.id < b.id ? -1 : 1));
    for (const q of foes) {
      if (!R.chance(s.rng, rv.chance * (FX.Sect.perkOf(s, p, 'xuanjiao') ? 0.5 : 1))) continue;

  /* ---------- 天魔潮 ---------- */
  Saga.DO.tianmo = (s, a) => {

    const my = P().power(s, p);

  /* ---------- 丹元大会 ---------- */
  Saga.DO.danyuan = (s, a) => {

    H().add(s, { type: 'saga', tags: ['大事', '丹元大会'], actors: [p.id], key: 'danyuan_enter', pov: true, severity: 4, params: { name: p.name, faction: Sect().mine(s).name } });

  Saga.danyuanRound = (s, round) => {
    const p = me(s), dy = SG().danyuan, mf = Sect().mine(s);

    FX.Ev.spawn(s, 'DANYUAN', { place: p.locationId, _round: round, _foe: R.pick(s.rng, pool) + '的金丹天骄', _power: power }, []);
  };
  // 按胜场排名次、发赏
  Saga.danyuanSettle = (s, wins) => {
    const p = me(s), dy = SG().danyuan, rw = dy.reward[wins];
    const names = ['没能进前列', '得了个名次', '得了个靠前的名次', '名列前茅', '夺得魁首'];
    const got = [];
    for (const k of ['xudu', 'zhengyang', 'dingshen', 'miluo', 'huanghua']) if (rw[k]) { give(s, k, rw[k]); got.push(C().items[k].name + (rw[k] > 1 ? '×' + rw[k] : '')); }
    let merit = '';
    if (Sect().mine(s)) { s.player.merit += rw.merit; merit = '，本门记' + C().house.meritName + ' ' + rw.merit; }
    const what = '胜 ' + wins + ' 场，' + names[wins] + (got.length ? '，得' + got.join('、') : '') + merit;
    const hid = H().add(s, { type: 'saga', tags: ['大事', '丹元大会'], actors: [p.id], key: 'danyuan', pov: true, severity: wins >= dy.rounds ? 5 : wins >= 3 ? 4 : 3, params: { name: p.name, what } });

      return Saga.danyuanSettle(s2, dy.rounds);

      place: p.locationId,

  const lhLayer = (layer) => Object.assign({}, Cb().fightOpt((s, b) => ({

    onWin(s2) {
      const p = pl(s2), lh = SG().liuhuo;
      const got = [lhGain(s2, lhVal(layer === 'deep' ? lh.deepGain : lh.midGain, p))];
      if (layer === 'deep') { give(s2, 'dongtianji', 1); got.push(C().items.dongtianji.name); if (R.chance(s2.rng, 0.5)) { give(s2, 'huanghua', 1); got.push(C().items.huanghua.name); } } else { const it = p.realm.major === 6 ? 'zhengyang' : 'dingshen'; give(s2, it, p.realm.major === 6 ? 2 : 1); got.push(C().items[it].name + (p.realm.major === 6 ? '×2' : '')); }

/* ============================================================

 *    道术要参习，分入门、小成、中成、大成。

  /* ---------- 法器 ---------- */

 * 十三味一个不缺才可能丹成上三品；大派都有让弟子外出寻药的规矩，采药途中打磨道心，好凝出内药。

 * ============================================================ */
(function (G) {

  Yao.waiHave = (s) => DC().wai.filter((k) => (s.player.inv[k] || 0) > 0);

  // NPC 结丹时采得几味：大派弟子多半齐全，散修多半凑不齐
  Yao.npcCount = (r, f) => { const rg = DC().npc[f ? Math.min(3, f.tier || 1) : 0]; return R.int(r, rg[0], rg[1]); };

  Yao.breakPart = (s, p) => { const n = Yao.count(s, p); return n ? { label: '十三味大药采得 ' + n + ' 味', value: Math.round(n * DC().breakPer) } : null; };

  // 结丹前的一条清单
  Yao.requirement = (s, p) => {

    const n = wh.length + nh.length;
    const note = '外药 ' + wh.length + '/6' + (wMiss.length ? '（缺' + wMiss.join('、') + '：荒山、险地、海外寻药，金谷墟市可托人代寻，宗门库藏可换）' : '') +

  // 每月调用：洞玄三重的日子累计起来，到了就凝成

      if (p.dxDays - from >= Yao.neiYears(s, p, k) * C().daysPerYear) {
        p.neiyao.push(k);
        H().add(s, { type: 'realm', tags: ['修炼', '大药'], actors: [p.id], key: 'neiyao', pov: true, severity: 2, params: { name: p.name, yao: N[k].name, desc: N[k].desc, n: Yao.count(s, p) } });

    }
  };

  /* ---------- 外出寻药 ---------- */
  Yao.list = (s, add) => {
    const p = me(s), place = s.places[p.locationId], D = DC();

  };
  Yao.DO = {
    xunyao(s, a) {
      const p = me(s), place = s.places[p.locationId], D = DC(), I = C().items;
      const r = Sim().passDays(s, a.days, 'other');

      if (r.interrupted || s.pending.length) return { text: '寻药途中出了事', interrupted: true };

      let hurt = false;
      if (D.hurt[place.type] && R.chance(s.rng, D.hurt[place.type])) { P().injure(s, p, 'light'); hurt = true; }
      if (!R.chance(s.rng, D.seekChance[place.type])) {
        FX.Act.seek(s, false); s.player.stats.exploreNothing++;
        H().add(s, { type: 'explore', tags: ['大药'], actors: [p.id], places: [place.id], key: 'yao_none', pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(a.days), hurt: hurt ? '，还受了些轻伤' : '' } });

      const k = R.pick(s.rng, miss.length ? miss : pool);

      return { text: '寻得' + I[k].name + (hurt ? '，受了轻伤' : '') };

  // 返回 { ok, say, steps } | { ok, ask } | { ok, cannot } | { ok:false, why }

    const r = Prop().checkSpec(s, Intent.SPEC, j.value);
    if (!r.ok) return { ok: false, why: r.errors.slice(0, 3).join('；') };
    const v = r.value;

    for (const f of ['say', 'ask', 'cannot']) if (v[f]) { const why = Prop().checkText(s, v[f], facts, { maxLen: 120 }); if (why) { if (f === 'say') delete v.say; else return { ok: false, why: f + '：' + why }; } }

    if (v.cannot) return { ok: true, cannot: v.cannot };

        add('与' + nm + '叙话', toQ([dd({ verb: 'talk', npc: q.id, aim: 'chat' })]));

  Hook.scan = (s) => {
    const p = me(s), place = s.places[p.locationId], out = [];
    const add = (kind, w, ctx) => { if (cdOk(s, kind)) out.push({ kind, w, ctx }); };
    const friends = others(s).filter((q) => rel(s, q) >= K.friendMin).sort(sortId);
    const foes = others(s).filter((q) => rel(s, q) <= K.foeMax).sort(sortId);
    // 交情
    const hurtF = friends.filter((q) => q.health.state !== 'healthy');
    if (hurtF.length) add('friend_hurt', 3, { npc: hurtF[0].id });
    if (friends.length) add('friend_visit', 2, { npc: friends[R.int(s.rng, 0, friends.length - 1)].id });
    // 仇怨
    if (foes.length) {
      const f = foes[R.int(s.rng, 0, foes.length - 1)];
      add(f.health.state !== 'healthy' ? 'foe_hurt' : 'foe_probe', 2, { npc: f.id });
    }
    // 宗门
    const fm = FX.Sect.mine(s);
    if (fm) {
      add('sect_task', 2, {});
      const peers = P().living(s).filter((q) => q.id !== p.id && q.factionId === fm.id && Math.abs(P().realmRank(q) - P().realmRank(p)) <= 3).sort(sortId);
      if (peers.length) add('sect_rival', 2, { npc: peers[R.int(s.rng, 0, peers.length - 1)].id });
    }
    // 市面：手里的稀罕货有人求购
    const rare = Object.keys(s.player.inv).filter((k) => s.player.inv[k] > 0 && C().items[k] && C().items[k].price >= 30 && !['heal'].includes(k)).sort();
    if (rare.length) add('market_buyer', 2, { item: rare[R.int(s.rng, 0, rare.length - 1)] });
    // 主角本身：卡关缺的东西、伤、欠的人情
    const need = FX.Guide && FX.Guide.needs(s).find((n) => n.keys.length && C().items[n.keys[0]]);
    if (need) add('self_need', 2, { item: need.keys[0] });
    if (p.health.state !== 'healthy') add('self_hurt', 2, {});
    // 名声：同境界的人慕名来讨教
    if (p.realm.major >= 1) {
      const peers = P().living(s).filter((q) => q.id !== p.id && q.realm.major === p.realm.major && q.locationId !== p.locationId && W().route(s, q.locationId, p.locationId)).sort(sortId);
      if (peers.length) add('self_challenge', 1.2, { npc: peers[R.int(s.rng, 0, peers.length - 1)].id });
    }
    const owe = favors(s).find((f) => f.kind === 'owe' && P().alive(s.people[f.npc]));
    if (owe) add('self_debt', 3, { npc: owe.npc });
    // 地方：同住一处的人、山里的妖物
    const nb = P().at(s, place.id).filter((q) => q.id !== p.id && Math.abs(rel(s, q)) < K.friendMin).sort(sortId);
    if (nb.length) add('place_neighbor', 1.2, { npc: nb[R.int(s.rng, 0, nb.length - 1)].id });
    // 路过的人：邻近地方的修士途经此地
    const by = place.links.map((l) => l.to).flatMap((id) => P().at(s, id)).filter((q) => q.id !== p.id && Math.abs(rel(s, q)) < K.friendMin).sort(sortId);
    if (by.length) add('place_visitor', 1.5, { npc: by[R.int(s.rng, 0, by.length - 1)].id });
    // 货郎：常用的丹药上门兜售
    const ware = ['qiju', 'heal', 'herb'].filter((k) => C().items[k]);
    if (ware.length) add('market_peddler', 1.2, { item: ware[R.int(s.rng, 0, ware.length - 1)] });
    if (place.danger >= 1) add('place_beasts', 1.5, {});
    // 大事余波：三年内开过的天下大事
    const saga = s.history.slice(-400).reverse().find((e) => /^saga_open_/.test(e.key) && s.t - e.t <= 3 * C().daysPerYear);
    if (saga && nb.length) add('saga_after', 2, { npc: nb[R.int(s.rng, 0, nb.length - 1)].id, what: saga.params.what });
    return out;
  };

  // 月末：按预算抽一个钩子排进队里（不打断闭关）
  Hook.rate = (s) => {
    const p = me(s);
    const friends = others(s).filter((q) => rel(s, q) >= K.friendMin).length;
    const fm = FX.Sect.mine(s);
    const home = (fm && p.locationId === fm.seatId) || s.player.dongfu === p.locationId || s.player.dongtian === p.locationId;
    // 不在自己的山门、洞府（在外奔走、寄居他处）事多一点；凡人、散修住的地方就算家
    const roaming = (fm || s.player.dongfu) && !home;
    return K.perYear * (1 + K.friendBonus * Math.min(5, friends)) * (fm ? K.memberMult : 1) * (roaming ? K.awayMult : 1);
  };
  Hook.monthly = (s) => {
    const p = me(s);
    if (!P().alive(p) || s.ended) return;
    const q = st(s).queue;
    if (q.length >= K.queueMax) return;
    if (!R.chance(s.rng, Hook.rate(s) / C().monthsPerYear)) return;
    const c = Hook.scan(s);
    if (!c.length) return;
    const h = R.weighted(s.rng, c, (x) => x.w);
    q.push(Object.assign({ id: 'k' + s.nextId++, kind: h.kind, t: s.t, ripe: false }, h.ctx));
    st(s).log.push({ kind: h.kind, t: s.t });
    if (st(s).log.length > 60) st(s).log.splice(0, st(s).log.length - 60);
  };

  // 送一件已经排过一回的钩子上门；没有就什么也不做
  Hook.deliver = (s) => {
    const q = st(s).queue;
    while (!s.pending.length && !s.ended) {
      const i = q.findIndex((x) => x.ripe && x.t <= s.t);
      if (i < 0) return;
      const h = q.splice(i, 1)[0];
      const ai = FX.Prop && FX.Prop.get(s, 'k:' + h.id);
      const prop = Hook.build(s, h, ai && ai.out);
      if (prop) FX.Ev.spawn(s, 'HOOK', prop.bound, []);
    }
  };
  // 行动结束：上一回排进来的钩子找上门（这一回新排的，等下一回，好让 AI 在后台写）
  Hook.flush = (s) => {
    const q = st(s).queue;
    Hook.deliver(s);
    for (const x of q) x.ripe = true;
    // 排了太久、当事人已不在的钩子丢掉
    st(s).queue = q.filter((x) => s.t - x.t < 10 * C().daysPerYear && (!x.npc || P().alive(s.people[x.npc])));
  };

  /* ---------- 模板：每种钩子一个 ---------- */
  // 选项：{ label, check, size, win:[effects], lose:[effects] }
  const opt = (label, check, size, win, lose) => ({ label, check, size, win: win || [], lose: lose || [] });
  const TPL = {
    friend_hurt: (s, b, n) => ({ title: '故人负伤', text: `${n.npc}受了伤，托人捎信来，想向你求一颗${n.item}。`, item: 'heal', max: 'mid',
      options: [opt('送药过去', 'none', 'mid', ['item-', 'rel+', 'favor_owed']), opt('亲去探望，替他护法几日', 'time', 'small', ['rel+']), opt('回信婉拒', 'none', 'small', ['rel-'])] }),
    friend_visit: (s, b, n) => ({ title: '故人相邀', text: `${n.npc}路过${n.place}，邀你同去附近山里采药。`, item: 'herb', max: 'small',
      options: [opt('同去', 'notice', 'small', ['item+', 'rel+'], ['hurt']), opt('留他叙旧', 'none', 'small', ['rel+']), opt('推说闭关', 'none', 'small', [])] }),
    foe_probe: (s, b, n) => ({ title: '仇家打探', text: `有人在${n.place}一带打探你的行踪，看来路是${n.npc}的人。`, max: 'mid',
      options: [opt('设法反探', 'notice', 'small', ['intel'], ['rel-']), opt('当面挑明，看能否化解', 'talk', 'mid', ['rel+'], ['feud']), opt('避一避风头', 'time', 'small', [])] }),
    foe_hurt: (s, b, n) => ({ title: '仇家负伤', text: `听说${n.npc}身上带伤，有人劝你趁机了结旧怨。`, max: 'mid', weaken: true,
      options: [opt('前去寻他', 'fight', 'mid', ['coin+', 'rel-'], ['hurt', 'feud']), opt('遣人送药示好', 'talk', 'mid', ['rel+'], []), opt('罢了', 'none', 'small', [])] }),
    sect_task: (s, b, n) => ({ title: '押送差事', text: `宗门长老差你押送一批货去${n.dest}，路上未必太平。`, max: 'mid', power: 0.9,
      options: [opt('应下差事', 'fight', 'mid', ['merit+', 'coin+'], ['hurt']), opt('推辞', 'none', 'small', [])] }),
    sect_rival: (s, b, n) => ({ title: '同门相争', text: `同门${n.npc}与你争一桩差事，话里带着火气。`, max: 'small',
      options: [opt('相让', 'none', 'small', ['rel+']), opt('比试一场定输赢', 'fight', 'small', ['merit+'], ['rel-']), opt('找长老评理', 'lore', 'small', ['merit+'], ['rel-']), opt('不理会', 'none', 'small', [])] }),
    market_buyer: (s, b, n) => ({ title: '有人求购', text: `有人听说你手里有${n.item}，托人来问肯不肯出手。`, item: b._item, max: 'mid', sell: true,
      options: [opt('卖给他', 'none', 'mid', ['item-', 'coin+']), opt('讨个高价', 'talk', 'mid', ['item-', 'coin+'], []), opt('不卖', 'none', 'small', [])] }),
    place_visitor: (s, b, n) => ({ title: '路人借宿', text: `${n.npc}途经${n.place}，天色已晚，想在你这里借宿一宿。`, max: 'small',
      options: [opt('留他住下，攀谈一番', 'talk', 'small', ['rel+', 'intel'], []), opt('指条路让他走', 'none', 'small', []), opt('闭门不见', 'none', 'small', ['rel-'])] }),
    market_peddler: (s, b, n) => ({ title: '货郎上门', text: `一个货郎挑着担子到了${n.place}，担子里有${n.item}。`, item: b._item, max: 'small', buy: true,
      options: [opt('买一份', 'pay', 'small', ['item+']), opt('看看就算', 'none', 'small', [])] }),
    self_challenge: (s, b, n) => ({ title: '慕名讨教', text: `${n.npc}听说你在${n.place}修行，专程来讨教几招。`, max: 'small',
      options: [opt('应下，点到为止', 'fight', 'small', ['rel+', 'progress+'], ['hurt', 'rel+']), opt('以茶代酒，论道一番', 'lore', 'small', ['rel+', 'progress+'], []), opt('婉拒', 'none', 'small', [])] }),
    self_need: (s, b, n) => ({ title: '游商上门', text: `一个游商听说你缺${n.item}，上门兜售。`, item: b._item, max: 'mid', buy: true,
      options: [opt('照价买下', 'pay', 'mid', ['item+']), opt('不要', 'none', 'small', [])] }),
    self_hurt: (s, b, n) => ({ title: '游方郎中', text: `一个游方郎中路过${n.place}，看出你身上有伤。`, item: 'heal', max: 'small', buy: true,
      options: [opt('买一颗' + C().items.heal.name, 'pay', 'small', ['item+']), opt('不必', 'none', 'small', [])] }),
    self_debt: (s, b, n) => ({ title: '来讨人情', text: `${n.npc}来了，说起你欠他的那个人情，想请你替他护法一阵。`, max: 'mid',
      options: [opt('去护法', 'time', 'mid', ['repay', 'rel+']), opt('拿符钱抵', 'pay', 'mid', ['repay']), opt('推脱', 'none', 'small', ['repay', 'rel-', 'rel-'])] }),
    place_neighbor: (s, b, n) => ({ title: '邻人相求', text: `同在${n.place}落脚的${n.npc}想借你的静室闭关些时日。`, max: 'mid',
      options: [opt('借给他', 'none', 'mid', ['rel+', 'favor_owed']), opt('收些租钱', 'talk', 'small', ['coin+'], ['rel-']), opt('不借', 'none', 'small', ['rel-'])] }),
    place_beasts: (s, b, n) => ({ title: '妖物成群', text: `${n.place}一带近来妖物成群，常有人受伤。`, item: 'beastHide', max: 'mid', power: 1.1,
      options: [opt('出手清剿', 'fight', 'mid', ['item+', 'merit+'], ['hurt']), opt('闭门不出', 'none', 'small', [])] }),
    saga_after: (s, b, n) => ({ title: '大事余波', text: `「${b._what}」之后，${n.npc}带着伤找上门来，求你收留几日。`, item: 'heal', max: 'mid',
      options: [opt('收留他', 'time', 'small', ['rel+', 'favor_owed']), opt('赠他一颗' + C().items.heal.name, 'none', 'mid', ['item-', 'rel+']), opt('拒之门外', 'none', 'small', ['rel-'])] }),
    follow: (s, b, n) => ({ title: '旧事后续', text: `${n.npc}又来了，还记着上回「${b._ref}」的事。`, max: 'small',
      options: [opt('叙叙旧', 'none', 'small', ['rel+']), opt('托他打听些消息', 'talk', 'small', ['intel'], []), opt('不见', 'none', 'small', ['rel-'])] }),
  };
  Hook.TPL = TPL;
  Hook.KINDS = Object.keys(TPL);
  Hook.FAMILY = { friend_hurt: '交情', friend_visit: '交情', foe_probe: '仇怨', foe_hurt: '仇怨', sect_task: '宗门', sect_rival: '宗门', market_buyer: '市面', self_need: '主角', self_hurt: '主角', self_challenge: '主角', self_debt: '主角', place_neighbor: '地方', place_beasts: '地方', place_visitor: '地方', market_peddler: '市面', saga_after: '大事余波', follow: '后续' };

  // 钩子 → 事件绑定（含模板或 AI 提案）。当事人已不在、条件已变（比如伤好了）就返回 null
  Hook.build = (s, h, ai) => {
    const p = me(s), place = s.places[p.locationId];
    if (h.npc && !P().alive(s.people[h.npc])) return null;
    const b = { place: place.id, _kind: h.kind, _hid: h.id };
    if (h.npc) b.npc = h.npc;
    if (h.item) b._item = h.item;
    if (h.what) b._what = h.what;
    if (h.ref) b._ref = h.ref;
    if (h.kind === 'sect_task') { const l = place.links[R.int(s.rng, 0, place.links.length - 1)]; b._dest = l ? l.to : place.id; }
    const n = Hook.names(s, b);
    const t = TPL[h.kind](s, b, n);
    if (t.item) b._item = t.item;
    if (t.power) b._power = Math.round(P().power(s, p) * t.power * R.range(s.rng, 0.8, 1.2) * 10) / 10;
    if (t.weaken) b._weak = 0.6;
    if (t.sell) b._coin = Math.round(C().items[b._item].price * 1.3);
    if (t.buy) b._cost = Math.round(C().items[b._item].price * 1.2);
    b._max = t.max;
    b._p = { title: t.title, text: t.text, options: t.options, via: 'tpl' };
    if (ai && Hook.okProposal(s, b, ai)) b._p = Object.assign({}, ai, { via: 'ai' });
    return { bound: b };
  };
  Hook.names = (s, b) => ({
    npc: b.npc && s.people[b.npc] ? s.people[b.npc].name : '',
    place: s.places[b.place].name,
    item: b._item ? W().itemName(b._item) : '',
    dest: b._dest ? s.places[b._dest].name : '',
  });

  /* ---------- 检定与后果（规则） ---------- */
  Hook.chance = (s, b, o) => {
    const p = me(s), q = b.npc ? s.people[b.npc] : null;
    switch (o.check) {
      case 'fight': { const pw = (q && o.check === 'fight' && !b._power ? P().power(s, q) * (b._weak || 1) : foePower(s, b)); return Cb().fightChance(s, p, pw).chance; }
      case 'flee': return Cb().fleeChance(s, p, foePower(s, b)).chance;
      case 'talk': return Math.round(U.clamp(45 + (q ? P().relValue(s, p.id, q.id) / 2 - Math.min(25, Math.max(0, P().realmRank(q) - P().realmRank(p)) * 2) : 0), 10, 90));
      case 'notice': return Math.round(U.clamp(30 + p.aptitude / 2, 10, 90));
      case 'lore': return Math.round(U.clamp(30 + p.realm.major * 8, 10, 90));
      default: return 100;
    }
  };
  const costOf = (s, b, o) => (o.check === 'pay' ? (b._cost || coinAmt(me(s), o.size)) : 0);
  // 一条后果的具体数值（按境界取）与说明
  const effText = (s, b, e, size) => {
    const p = me(s), n = Hook.names(s, b);
    switch (e) {
      case 'coin+': return '符钱 +' + (b._coin || coinAmt(p, size));
      case 'coin-': return '符钱 −' + coinAmt(p, size);
      case 'item+': return '得' + n.item;
      case 'item-': return '失' + n.item;
      case 'merit+': return FX.Sect.mine(s) ? C().house.meritName + ' +' + meritAmt(p, size) : '';
      case 'progress+': return '修为 +' + progAmt(p, size);
      case 'hurt': return size === 'big' ? '重伤' : '轻伤';
      case 'rel+': return n.npc ? '与' + n.npc + '交情 +' + relAmt(size) : '';
      case 'rel-': return n.npc ? '与' + n.npc + '交情 −' + relAmt(size) : '';
      case 'feud': return n.npc ? '与' + n.npc + '结仇' : '';
      case 'favor_owed': return n.npc ? n.npc + '欠你一个人情' : '';
      case 'favor_owe': return n.npc ? '欠' + n.npc + '一个人情' : '';
      case 'repay': return '还了人情';
      case 'intel': return '得一条消息';
      case 'followup': return '日后还有下文';
      default: return '';
    }
  };
  const describe = (s, b, list, size) => list.map((e) => effText(s, b, e, size)).filter(Boolean).join('，');
  const avail = (s, b, o) => {
    const all = o.win.concat(o.lose);
    if (all.includes('item-') && !((s.player.inv[b._item] || 0) > 0)) return '行囊里没有' + Hook.names(s, b).item;
    if (o.check === 'pay' && s.player.stone < costOf(s, b, o)) return '符钱不够（要 ' + costOf(s, b, o) + '）';
    if ((o.check === 'fight' || all.includes('hurt')) && me(s).health.state === 'heavy') return '重伤在身';
    return true;
  };
  const applyEff = (s, b, e, size, ctx) => {
    const p = me(s), q = b.npc ? s.people[b.npc] : null;
    switch (e) {
      case 'coin+': s.player.stone += b._coin || coinAmt(p, size); break;
      case 'coin-': s.player.stone -= Math.min(s.player.stone, coinAmt(p, size)); break;
      case 'item+': s.player.inv[b._item] = (s.player.inv[b._item] || 0) + 1; break;
      case 'item-': if (s.player.inv[b._item] > 0) s.player.inv[b._item]--; break;
      case 'merit+': if (FX.Sect.mine(s)) s.player.merit += meritAmt(p, size); break;
      case 'progress+': FX.CU.addProgress(s, p, progAmt(p, size)); break;
      case 'hurt': P().injure(s, p, size === 'big' ? 'heavy' : 'light'); break;
      case 'rel+': if (q) P().adjustRelation(s, p.id, q.id, relAmt(size), '往来'); break;
      case 'rel-': if (q) P().adjustRelation(s, p.id, q.id, -relAmt(size), '往来'); break;
      case 'feud': if (q) P().adjustRelation(s, p.id, q.id, -40, '结怨'); break;
      case 'favor_owed': if (q) favors(s).push({ npc: q.id, kind: 'owed', t: s.t }); break;
      case 'favor_owe': if (q) favors(s).push({ npc: q.id, kind: 'owe', t: s.t }); break;
      case 'repay': { const f = q && favors(s).find((x) => x.npc === q.id && x.kind === 'owe'); if (f) favors(s).splice(favors(s).indexOf(f), 1); break; }
      case 'intel': ctx.intel = FX.Deed.intel(s, FX.Guide && FX.Guide.next(s) ? 'way' : 'rumor', {}); break;
      case 'followup': if (q) st(s).queue.push({ id: 'k' + s.nextId++, kind: 'follow', npc: q.id, ref: b._p.title, t: s.t + R.int(s.rng, 1, 3) * C().daysPerYear, ripe: false }); break;
    }
  };

  // 给 events.js 用的选项视图与结算
  Hook.options = (s, b) => b._p.options.map((o, i) => {
    const ch = Hook.chance(s, b, o);
    const cost = costOf(s, b, o);
    return {
      id: 'o' + i, label: o.label,
      chance: o.check === 'none' || o.check === 'pay' || o.check === 'time' ? undefined : (s2, b2) => ({ chance: Hook.chance(s2, b2, o), parts: [{ label: Hook.CHECKS[o.check] + '（按' + { fight: '双方战力', flee: '遁行与战力对比', talk: '交情与境界差', notice: '资质', lore: '境界' }[o.check] + '）', value: Hook.chance(s2, b2, o) + '%' }] }),
      cost: () => (cost ? '符钱 −' + cost : o.check === 'time' ? T().dur(daysOf(o.size)) : '无'),
      risk: () => (o.check === 'none' || o.check === 'pay' || o.check === 'time' ? (describe(s, b, o.lose, o.size) || '无') : Hook.CHECKS[o.check] + ' ' + ch + '%' + (o.lose.length ? '；不成则' + describe(s, b, o.lose, o.size) : '')),
      outcome: () => describe(s, b, o.win, o.size) || '什么也不会发生',
      avail: (s2, b2) => avail(s2, b2, o),
      apply(s2, b2, ctx) {
        const c = Hook.chance(s2, b2, o);
        if (cost) s2.player.stone -= cost;
        const win = c >= 100 || R.next(s2.rng) * 100 < c;
        const list = win ? o.win : o.lose;
        for (const e of list) applyEff(s2, b2, e, o.size, ctx);

        const pv = Intent().preview(s, pl.steps);

        if (ts.length) { const t = ts[Math.floor(rng() * ts.length)]; d.roam = { from: p.locationId, to: t.to, t: s.t }; return out({ act: t }, '在' + s.places[p.locationId].name + '住久了，想去' + s.places[t.to].name + '看看。'); }

  };
  // 苦修路上的心声（模板；只在换了做法时才记）

      case 'cultivate': return a.coin ? '符钱尚足，以符钱修行快些。' : '闭关修炼，不问外事。';
      case 'rest': case 'use': return a.item && a.item !== 'heal' ? '' : '伤还没好，先养伤。';

      case 'join': return '无门无派难有出路，去求入山门。';
      case 'learn': case 'sect_learn': return '换一门更好的功法。';
      case 'redeem': case 'order': case 'buy': return a.item === 'qiju' ? '中孚丹快用完了，补上几颗。' : '冲关缺的东西，得先备齐。';
      case 'mission': case 'work': return '道功、符钱不够，先去挣。';

  };
