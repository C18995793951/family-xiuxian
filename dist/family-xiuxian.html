<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17130f">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="修仙录">
<title>家族修仙录</title>
<style>
/* ============ 古风修仙家族档案 · 固定深色主题 ============ */
:root {
  --bg: #17130f;
  --panel: #211a14;
  --panel-2: #2a2119;
  --line: #8a6d3f;
  --line-soft: #4a3b26;
  --accent: #e0a94f;
  --danger: #b5412f;
  --good: #5b9a85;
  --text: #e8dcc6;
  --muted: #a99d86;
  --title-font: "KaiTi", "STKaiti", "楷体", "SimSun", "宋体", "Noto Serif SC", "Source Han Serif SC", serif;
  --body-font: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  --fs: 15px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--body-font); font-size: var(--fs); line-height: 1.6; }
body { min-height: 100vh; overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
button, [data-act], summary, label { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
h1, h2, h3, h4 { font-family: var(--title-font); font-weight: 600; color: var(--accent); margin: 0 0 .5em; letter-spacing: .05em; }
h1 { font-size: 1.8em; } h2 { font-size: 1.35em; } h3 { font-size: 1.12em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--danger); } .warn { color: var(--accent); }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: .45em .9em; cursor: pointer; min-height: 36px; }
@media (hover: hover) { button:hover:not(:disabled) { background: #3a2c1e; } } /* 手机上点过的按钮不留“悬停”底色 */
button.primary { background: #6b4a1f; border-color: var(--accent); color: #fff3dc; font-weight: 600; }
button.danger { border-color: var(--danger); color: #f0b2a6; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { background: none; border: none; color: var(--accent); padding: 0 .1em; min-height: 0; text-decoration: underline dotted; }
select, input[type=text], input[type=number], input[type=password], textarea { background: #120f0b; border: 1px solid var(--line-soft); border-radius: 4px; padding: .35em .5em; min-height: 36px; }
textarea { width: 100%; min-height: 8em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 布局 */
.app { display: grid; grid-template-columns: 200px 1fr 300px; min-height: 100vh; }
.app.no-aside { grid-template-columns: 200px 1fr; }
nav.side { background: var(--panel); border-right: 1px solid var(--line-soft); padding: 1em .6em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav.side .brand { font-family: var(--title-font); font-size: 1.4em; color: var(--accent); text-align: center; margin-bottom: .2em; }
nav.side .sub { text-align: center; color: var(--muted); font-size: .85em; margin-bottom: 1em; }
nav.side button { display: block; width: 100%; text-align: left; margin-bottom: .3em; background: transparent; border-color: transparent; }
nav.side button.on { border-color: var(--line); background: var(--panel-2); color: var(--accent); }
.badge { display: inline-block; min-width: 1.5em; padding: 0 .4em; border-radius: 1em; background: var(--danger); color: #fff; font-size: .8em; text-align: center; margin-left: .3em; }
main { padding: 1.2em 1.5em 5em; min-width: 0; }
aside.right { background: var(--panel); border-left: 1px solid var(--line-soft); padding: 1em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1em; margin-bottom: 1em; }
.card.hl { border-color: var(--accent); }
.grid { display: grid; gap: 1em; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stat { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line-soft); padding: .2em 0; gap: .5em; }
.stat:last-child { border-bottom: none; }
.stat b { font-weight: 600; }
.stat > .row { flex: 0 1 auto; max-width: 64%; justify-content: flex-end; }
.stat > :first-child { min-width: 34%; }
.stat > span:first-child { flex: 1 1 auto; }
.saga { border-bottom: 1px dashed var(--line-soft); padding: .3em 0; }
.saga:last-child { border-bottom: none; }
.saga .muted { font-size: .9em; }
.stat > .row button { white-space: nowrap; }
.big { font-size: 1.6em; font-family: var(--title-font); color: var(--accent); }
.bar { height: 8px; background: #120f0b; border-radius: 4px; overflow: hidden; border: 1px solid var(--line-soft); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.good > i { background: var(--good); } .bar.bad > i { background: var(--danger); }
.tag { display: inline-block; white-space: nowrap; border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 .4em; margin: 0 .2em .2em 0; font-size: .88em; color: var(--muted); }
.tag.t-warn { border-color: var(--accent); color: var(--accent); }
.tag.t-bad { border-color: var(--danger); color: #f0b2a6; }
.tag.t-good { border-color: var(--good); color: #9fd2c0; }
.unfinished { border: 1px dashed var(--muted); color: var(--muted); padding: .5em .8em; border-radius: 4px; font-size: .92em; }
.unfinished::before { content: "未完成 · "; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .4em .5em; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { color: var(--muted); font-weight: normal; cursor: pointer; white-space: nowrap; }
tr.attn td { background: rgba(224, 169, 79, .08); }
tr.dead td { color: var(--muted); }
.clickable { cursor: pointer; }
.trace { cursor: help; text-decoration: underline dotted var(--muted); }
.log p { margin: .2em 0 .5em; }
.log .y { color: var(--muted); font-size: .85em; margin-right: .4em; }

/* 模态 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1em; animation: fade .15s; }
.modal-bg.still { animation: none; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-width: 720px; width: 100%; max-height: 90vh; max-height: 90dvh; overflow-y: auto; padding: 1.2em 1.4em; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.modal h2 { margin-top: 0; }
.opt { border: 1px solid var(--line-soft); border-radius: 6px; padding: .7em .9em; margin: .6em 0; background: var(--panel-2); }
.opt.disabled { opacity: .55; }
.opt .meta { font-size: .92em; color: var(--muted); }
.opt .meta b { color: var(--text); font-weight: normal; }
#toasts { position: fixed; bottom: 1em; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: .4em; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { background: var(--panel-2); border: 1px solid var(--accent); padding: .6em 1.2em; border-radius: 6px; animation: fade .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
@media (max-width: 720px) { #toasts { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); } }
.flash { animation: flash 1.2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flash { 0% { background: rgba(224,169,79,.35); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 开局 */
.start { max-width: 900px; margin: 0 auto; padding: 2em 1em; }
.origin { cursor: pointer; }
.origin.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

nav.bottom { display: none; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 180px 1fr; }
  aside.right { display: none; }
}
@media (max-width: 720px) {
  .app, .app.no-aside { display: block; }
  nav.side { display: none; }
  main { padding: .8em 16px calc(6em + env(safe-area-inset-bottom, 0px)); }
  nav.bottom { display: grid; grid-template-columns: repeat(8, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 40; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  nav.bottom button { border: none; border-radius: 0; background: transparent; min-height: 52px; padding: .2em; font-size: .85em; }
  nav.bottom button.on { color: var(--accent); background: var(--panel-2); }
  .more-menu { position: fixed; bottom: calc(56px + env(safe-area-inset-bottom, 0px)); right: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; z-index: 45; padding: .4em; }
  .more-menu button { display: block; width: 100%; text-align: left; margin: .2em 0; min-height: 44px; }
  table.resp thead { display: none; }
  table.resp tr { display: block; border: 1px solid var(--line-soft); border-radius: 6px; margin-bottom: .6em; padding: .4em; }
  table.resp td { display: flex; justify-content: space-between; border: none; padding: .2em .3em; }
  table.resp td::before { content: attr(data-l); color: var(--muted); margin-right: 1em; }
  button { min-height: 44px; }
  .modal { padding: 1em; }
}

/* 个人主角 */
.col { display: flex; flex-direction: column; gap: .4em; }
.col button { text-align: left; }
.act-group { margin-bottom: .7em; }
.act-group > .muted { display: block; font-size: .88em; margin-bottom: .25em; }
.tabs { margin-bottom: .8em; }
.tabs button.on { border-color: var(--accent); color: var(--accent); background: var(--panel-2); }
.log p.rumor, .rumor { color: var(--muted); }
.map-wrap { overflow-x: auto; padding: .5em; }
svg.map { width: 100%; min-width: 560px; height: auto; display: block; }
svg.map .road { stroke: var(--line-soft); stroke-width: 2; }
svg.map .days { fill: var(--muted); font-size: 10px; text-anchor: middle; }
svg.map .node { cursor: pointer; }
svg.map .node circle { stroke: var(--bg); stroke-width: 2; }
svg.map .node.seen circle { stroke: var(--accent); }
svg.map .node.here circle { stroke: #fff3dc; stroke-width: 3; }
svg.map .node:focus-visible circle { stroke: #fff; stroke-width: 4; }
svg.map .pname { fill: var(--text); font-size: 12px; text-anchor: middle; }
.t-city circle, .legend.t-city { fill: #b08bb8; color: #b08bb8; }
.t-town circle, .legend.t-town { fill: #c9a25a; color: #c9a25a; }
.t-sect circle, .legend.t-sect { fill: #7a8fb5; color: #7a8fb5; }
.t-clan circle, .legend.t-clan { fill: #5b9a85; color: #5b9a85; }
.t-wild circle, .legend.t-wild { fill: #8a7a5a; color: #8a7a5a; }
.t-danger circle, .legend.t-danger { fill: #b5412f; color: #b5412f; }
.t-mart circle, .legend.t-mart { fill: #e0b85c; color: #e0b85c; }
.t-bigsect circle, .legend.t-bigsect { fill: #a7b8e8; color: #a7b8e8; }
.t-sea circle, .legend.t-sea { fill: #4f8fb8; color: #4f8fb8; }
svg.map .road.gate { stroke-dasharray: 6 5; stroke: var(--accent); opacity: .7; }
svg.map .node.far { opacity: .45; }
svg.map .region { fill: var(--muted); font-size: 22px; text-anchor: middle; opacity: .35; letter-spacing: .3em; }
.reqs { margin: .4em 0; display: grid; gap: .15em; }
.mtop { display: none; }
@media (max-width: 720px) { .mtop { display: block; color: var(--muted); font-size: .9em; margin-bottom: .6em; } }
label { display: inline-flex; gap: .4em; align-items: center; }

/* 界面整理：折叠、子页签、紧凑数值、长说明收两行 */
.small { font-size: .86em; }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: .15em 1em; margin-top: .4em; }
.kv > div { border-bottom: 1px dashed var(--line-soft); padding: .15em 0; display: flex; justify-content: space-between; gap: .4em; }
.fold { font-size: .9em; }
.desc { color: var(--muted); font-size: .86em; cursor: pointer; }
.desc.clamp { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tabs.sub { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: .4em 0; margin-bottom: .6em; }
.tabs.sub button { flex: 1 1 auto; }
.recent .log, .recent p { margin: .15em 0; font-size: .9em; }
.narrow-only { display: none; }
@media (max-width: 1100px) { .narrow-only { display: block; } }
.map-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
svg.map { min-width: 100%; max-width: none; }
svg.map .pname { font-size: 24px; }
svg.map .days { font-size: 17px; }
svg.map .region { font-size: 46px; }
svg.map .road { stroke-width: 3; }
.map-wrap { max-height: 62vh; overflow: auto; }
.stat > span:first-child { min-width: 0; flex: 1 1 0; }
.stat > .row { flex: 0 0 auto; }
@media (max-width: 720px) {
  .stat > .row { max-width: 46%; }
  .stat > .row button { min-height: 38px; padding: .3em .6em; }
  .kv { grid-template-columns: 1fr 1fr; }
}
.stat > span:first-child:has(+ b) { flex: 0 0 auto; white-space: nowrap; }
.stat > b { text-align: right; }

/* 此刻页：行动分页签、时长小格子、快捷栏 */
button.wide { width: 100%; margin-bottom: .6em; }
.chips { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.4em, 1fr)); gap: .4em; }
.chips.long { grid-template-columns: repeat(auto-fill, minmax(10em, 1fr)); }
.chips .chip { padding: .3em .4em; min-height: 40px; white-space: nowrap; }
.acts-tabs { gap: .3em; margin: .2em 0 .7em; }
.acts-tabs button { flex: 1 1 0; padding: .35em .3em; min-height: 40px; white-space: nowrap; }
.qbar { display: none; }
.qbar button { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qbar button.risky { background: #5c2a1c; border-color: var(--danger); }
@media (max-width: 720px) {
  .qbar { display: flex; gap: 8px; position: fixed; left: 0; right: 0; bottom: calc(53px + env(safe-area-inset-bottom, 0px)); padding: 8px calc(12px + env(safe-area-inset-right, 0px)) 6px calc(12px + env(safe-area-inset-left, 0px)); background: linear-gradient(to top, var(--bg) 75%, rgba(23, 19, 15, 0)); z-index: 39; }
  .qbar button { min-height: 48px; }
  main.p-now { padding-bottom: calc(6em + 64px + env(safe-area-inset-bottom, 0px)); }
  body:has(main.p-now .qbar) #toasts { bottom: calc(128px + env(safe-area-inset-bottom, 0px)); }
}

/* 手机横屏：导航改成左侧竖条；此刻页左栏人物与冲关，右栏做什么（钉在屏上，单独滚动） */
@media (orientation: landscape) and (max-height: 520px) {
  body { padding-left: 0; padding-right: 0; }
  .app, .app.no-aside { display: block; }
  nav.side, aside.right { display: none; }
  nav.bottom { display: flex; flex-direction: column; position: fixed; top: 0; bottom: 0; left: 0; right: auto; width: calc(64px + env(safe-area-inset-left, 0px)); padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); border-top: none; border-right: 1px solid var(--line); background: var(--panel); z-index: 40; }
  nav.bottom button { flex: 1 1 0; min-height: 0; border: none; border-radius: 0; background: transparent; font-size: .85em; padding: 0; }
  nav.bottom button.on { color: var(--accent); background: var(--panel-2); }
  main, main.p-now { margin-left: calc(64px + env(safe-area-inset-left, 0px)); padding: .5em calc(12px + env(safe-area-inset-right, 0px)) calc(1.5em + env(safe-area-inset-bottom, 0px)) 12px; }
  .mtop { display: block; color: var(--muted); font-size: .9em; margin-bottom: .4em; }
  .now-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "a b" "c b"; gap: 0 12px; align-items: start; }
  .col-a { grid-area: a; }
  .col-c { grid-area: c; }
  .col-c .grid { grid-template-columns: 1fr; }
  .col-b { grid-area: b; position: sticky; top: 0; max-height: 100vh; max-height: 100dvh; overflow-y: auto; overscroll-behavior: contain; padding-top: .2em; }
  .col-b { display: flex; flex-direction: column; }
  .qbar { display: flex; order: -1; gap: 8px; position: static; margin-bottom: .6em; padding: 0; background: none; }
  .qbar .dup { display: none; }
  .qbar:has(> .dup:only-child) { display: none; }
  .qbar button { min-height: 44px; }
  #toasts, body:has(main.p-now .qbar) #toasts { bottom: calc(1em + env(safe-area-inset-bottom, 0px)); left: calc(50% + 32px); }
  .modal-bg { padding: .5em calc(.5em + env(safe-area-inset-right, 0px)) .5em calc(.5em + env(safe-area-inset-left, 0px)); }
  .modal { max-height: 96vh; max-height: 96dvh; }
  .map-wrap { max-height: 78vh; max-height: 78dvh; }
  button { min-height: 40px; }
}

/* 采买与冲关来路 */
.reqs .src { margin: .25em 0 .35em 1.2em; gap: .35em; }
.reqs .src button { min-height: 34px; padding: .2em .6em; font-size: .9em; }
.saga-mini { border-left: 3px solid var(--accent); padding: .2em .6em; margin-bottom: .7em; background: var(--panel-2); border-radius: 0 4px 4px 0; }
.saga-mini > div { margin: .15em 0; }

/* 卡关时的“下一步” */
.guide { margin: .35em 0 .2em; padding: .45em .6em; border-left: 3px solid var(--accent); background: rgba(224,169,79,.07); border-radius: 4px; }
.guide .row.src { margin-top: .3em; }

/* AI 写的文字：和规则写的纪事分开，一眼看得出 */
.ai-note { border-left: 3px solid var(--accent); padding: .1em 0 .1em .6em; margin: .3em 0 .6em; color: var(--text); }
.ai-note .src { color: var(--muted); font-size: .8em; margin-left: .4em; }
.ai-wait { color: var(--muted); font-size: .85em; }
.ai-form .row { align-items: center; }
.ai-form input[type=password] { flex: 1 1 12em; min-width: 0; }
.ai-rejects p { font-size: .85em; margin: .3em 0; }

/* 自由输入 */
.say-box { margin: .2em 0 .6em; }
.say-row { flex-wrap: nowrap; gap: .4em; }
.say-row input { flex: 1; min-width: 0; font-size: 1em; padding: .45em .6em; }
.say-quote { font-size: 1.05em; margin: .2em 0 .5em; }
.intent-plan { margin: .4em 0; }
.intent-steps > div { margin: .3em 0; }

/* 导演模式 */
.dir-head .dir-who { margin-bottom: .4em; line-height: 1.6; }
.dir-opt { display: grid; grid-template-columns: 2.6em 1fr; align-items: center; gap: .5em; margin: .35em 0; }
.dir-opt .chips.c4 { grid-template-columns: repeat(4, 1fr); }
.dir-opt .chips.c3 { grid-template-columns: repeat(3, 1fr); }
.dir-ctl { margin: .5em 0; }
.chips .chip.on { font-weight: bold; }
.dir-log p.dir-think { margin: .5em 0 .2em; color: var(--accent); }
.dir-log p.dir-think i { color: var(--text); font-style: normal; }
.dir-log p.dir-think .src { color: var(--muted); font-size: .8em; margin-left: .4em; }
.dir-heart > summary { cursor: pointer; list-style: none; }
.dir-heart > summary::-webkit-details-marker { display: none; }
.dir-heart > summary h3 { display: inline; }
.dir-heart > summary h3::after { content: ' ▾'; color: var(--muted); font-size: .8em; }
.dir-heart[open] > summary h3::after { content: ' ▴'; }
.dir-heart[open] > summary { margin-bottom: .5em; }

</style>
</head>
<body>
<div id="app"><p style="padding:2em">载入中……若长时间无反应，请确认浏览器已启用 JavaScript。</p></div>
<!-- ===== 模拟核心（config / rng / … / api）：不访问 DOM，可在 Node 中无头运行 ===== -->
<script>
/* ---------- core/config.js ---------- */
/* ============================================================
 * config —— 全部数值、概率、名字库、文本模板
 * 逻辑中不得硬编码平衡数值，一律在此调整。
 * 遭遇定义见 encounters.js（同属 config 区块）。
 *
 * 世界与设定取自鹓扶君《仙业》（东弥州南域一带）：境界、地名、宗门、物产只用设定事实，
 * 文字一律自写，不搬原文。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});

    if (m >= 2) {
      const t = P().techOf(s, p);
      if (t.kind !== 'none') F.push({ label: '法门《' + t.name + '》', value: t.mult });
      const place = s.places[p.locationId];
      if (opts && opts.coin) {
        F.push({ label: '以符钱修行（符钱属「元」，人人可炼）', value: cf.attrFit.coin });
        F.push({ label: '符钱灵气', value: cc.qiMult[cc.coin.qi] });
      } else {
        const fit = CU.attrFit(s, p, place);
        F.push({ label: fit.label, value: fit.value });
        const qi = CU.qiFor(s, p);
        F.push({ label: '灵机 ' + qi + ' 级' + (place ? '（' + place.name + (qi < place.qi ? '，外人只能在山门外修炼' : '') + '）' : ''), value: cc.qiMult[qi] });
      }
      if (opts && opts.pill) F.push({ label: '中孚丹', value: 1 + cc.qijuBonus });
      const aux = FX.Ars.cultFactor(s, p);
      if (aux) F.push(aux);
      const dz = FX.Sect.perkOf(s, p, 'dazhi'); // 大知殿：不理俗务，专心清修
      if (dz) F.push({ label: '大知殿清修', value: 1 + 0.1 * dz });
    }
    if (P().isOld(s, p)) F.push({ label: '年老', value: cc.oldAgeCoef });
    if (!(opts && opts.healthy) && (p.health.state === 'light' || p.health.state === 'heavy')) F.push({ label: p.health.state === 'heavy' ? '重伤' : '轻伤', value: cc.injury[p.health.state] });
    let total = 1;
    for (const f of F) total *= f.value;
    return { total: Math.round(total * 100) / 100, factors: F };
  };

  CU.updateLifespan = (s, p) => { p.lifespanMax = P().lifespanMaxFor(p.realm.major, p.realm.stage); };

  // 返虚这一段修满时有没有一关（按所选道途；第十三段修满是纯阳三灾的风灾）
  CU.isFanxuGate = (p) => p.realm.major === 8 && (p.realm.stage >= C().realms.maxStage[8] || P().fanxuPath(p).gates.includes(p.realm.stage));
  // 修为封顶（到了要冲关、或缺练炁术的地方）
  CU.capped = (p) => {
    const m = p.realm.major;
    if (m === 1) return !P().lianqiOf(p);
    if (m === 2) return p.realm.stage === 9;
    if (m === 8) return CU.isFanxuGate(p);
    return true;
  };

  // 自动晋升：胎息壮大到头且有练炁术 → 练炁一层；练炁一至八层修满 → 下一层。返回晋升的层数
  CU.autoAdvance = (s, p) => {
    let n = 0;
    const isPlayer = P().isPlayer(s, p);
    if (p.realm.major === 1 && P().lianqiOf(p) && p.progress >= P().need(p)) {
      p.progress -= P().need(p);
      p.realm = { major: 2, stage: 1 };
      CU.updateLifespan(s, p);
      n++;
      if (isPlayer) H().add(s, { type: 'realm', tags: ['修炼'], actors: [p.id], key: 'lianqi_start', params: { name: p.name, tech: P().lianqiOf(p).name }, severity: 3, pov: true });
    }
    while (p.realm.major === 2 && p.realm.stage < 9 && p.progress >= P().need(p) && n < 12) {
      p.progress -= P().need(p);
      p.realm.stage++;
      CU.updateLifespan(s, p);
      n++;
      if (isPlayer) H().add(s, { type: 'realm', tags: ['修炼'], actors: [p.id], key: 'realm_up', params: { name: p.name, realm: P().realmName(p) }, severity: 2, pov: true });
    }
    // 返虚：九等轮转、玄中三限两途，没有劫关的那几段修满便自然接续
    while (p.realm.major === 8 && !CU.isFanxuGate(p) && p.progress >= P().need(p) && n < 20) {
      p.progress -= P().need(p);
      p.realm.stage++;
      CU.updateLifespan(s, p);
      n++;
    }
    const rk = P().realmRank(p);
    if (rk > p.peakRank) p.peakRank = rk;
    return n;
  };

  // 从凡人起累计的修为（用来算跨层增长）
  CU.total = (p) => {
    const cf = C().realms;
    let b = 0;
    for (let m = 0; m < p.realm.major; m++) for (let st = 1; st <= cf.maxStage[m]; st++) b += P().needAt(p, m, st);
    for (let st = 1; st < p.realm.stage; st++) b += P().needAt(p, p.realm.major, st);
    return b + p.progress;
  };

  // 加修为（已到瓶颈时封顶，等待突破）；返回实际增加的修为
  CU.addProgress = (s, p, amount) => {
    if (amount <= 0) return 0;
    const before = CU.total(p);
    p.progress += amount;
    if (CU.capped(p)) p.progress = Math.min(p.progress, P().need(p));
    CU.autoAdvance(s, p);
    if (CU.capped(p)) p.progress = Math.min(p.progress, P().need(p));
    return Math.max(0, CU.total(p) - before);
  };

  /* ---------- 突破 ---------- */
  CU.gateKind = (p) => {
    const m = p.realm.major, st = p.realm.stage;
    if (m === 0) return 'taixi';
    if (m === 2 && st === 9) return 'zhuji';
    if (m >= 3 && m <= 6) return st < 3 ? 'minor' : ['zifu', 'dongxuan', 'jindan', 'yuanshen'][m - 3];
    const ms = C().realms.maxStage;
    if (m === 7) return st < ms[7] ? 'zhangguan' : 'fanxu';
    if (m === 8) return st >= ms[8] ? 'chunyang' : CU.isFanxuGate(p) ? 'mizhang' : null;
    if (m === 9) return st < 3 ? 'sanzai' : 'hedao';
    if (m === 10) return 'jiunan';
    return null;
  };
  const NEXT = { taixi: { major: 1, stage: 1 }, zhuji: { major: 3, stage: 1 }, zifu: { major: 4, stage: 1 }, dongxuan: { major: 5, stage: 1 }, jindan: { major: 6, stage: 1 }, yuanshen: { major: 7, stage: 1 }, fanxu: { major: 8, stage: 1 }, chunyang: { major: 9, stage: 1 }, hedao: { major: 10, stage: 1 } };
  // 返虚、渡劫、合道九难都要在自家洞天里；返虚破障另有灵脉的讲究（见 mizhangSite）
  const IN_DONGTIAN = ['fanxu', 'chunyang', 'sanzai', 'hedao', 'jiunan'];
  // 冲关的说法
  const VERB = { taixi: '参悟', zhangguan: '坐关破', mizhang: '破', jiunan: '渡' };
  // 返虚道途：冲返虚时要选的那一条（NPC 一律走十二迷障）
  CU.pathOk = (s, p, key) => {
    const fp = C().realms.fanxuPaths[key];
    if (!fp) return { ok: false, reason: '没有这条道途' };
    if (!P().isPlayer(s, p)) return { ok: key === 'shier', reason: key === 'shier' ? '' : '没有门路' };
    if (fp.needItem && !(s.player.inv[fp.needItem] > 0)) return { ok: false, reason: '没有吃透' + C().items[fp.needItem].name + '（' + C().items[fp.needItem].where + '）' };
    if (fp.minXiang && (p.xiang || 0) < fp.minXiang) return { ok: false, reason: '感悟不足：要' + C().realms.xiangNames[fp.minXiang] + '以上才敢试天考' };
    return { ok: true, reason: '' };
  };
  // 返虚破障的灵脉：在自家洞天、或用得上的灵窟里；玉宸门人凭天谷符诏可进宵明大泽的天谷
  CU.mizhangSite = (s, p) => {
    const B = C().breakthrough.mizhang;
    if (!P().isPlayer(s, p)) return { ok: true, mult: 1, chance: 0, label: '' };
    const place = s.places[p.locationId];
    const qi = CU.qiFor(s, p);
    if (place && place.key === 'yuchen' && qi >= B.minQi && s.player.inv.tiangu > 0) return { ok: true, tiangu: true, mult: B.tiangu.death, chance: B.tiangu.chance, label: '宵明大泽天谷（先天奇府、太乙含真）' };
    if (qi < B.minQi) return { ok: false, qi, mult: 1, chance: 0, label: '' };
    const home = s.player.dongtian === p.locationId;
    return { ok: true, mult: B.deathByQi[Math.min(7, qi)] || 1, chance: 0, label: home ? '自家洞天' : '灵机 ' + qi + ' 级的灵窟' };
  };
  // 此人眼下要渡的是哪一灾（纯阳：返虚冲纯阳是风灾，纯阳一重渡火灾，二重渡雷灾）
  CU.zaiName = (p) => { const k = CU.gateKind(p); return k === 'chunyang' ? C().breakthrough.sanzaiNames[0] : k === 'sanzai' ? C().breakthrough.sanzaiNames[p.realm.stage] : ''; };
  // 元神的「地」、返虚的洞天
  CU.diNote = '大派山门（八派六宗各占一座灵窟，门人才用得上），或在鹤鸣山、九危山这样的六级无主福地开辟洞府';
  CU.nextRealm = (p) => {
    const k = CU.gateKind(p);
    if (k === 'minor' || k === 'sanzai' || k === 'zhangguan' || k === 'mizhang') return { major: p.realm.major, stage: p.realm.stage + 1 };
    if (k === 'jiunan') return p.realm.stage < C().realms.maxStage[10] ? { major: 10, stage: p.realm.stage + 1 } : { major: 11, stage: 1 };
    // 给一份拷贝：境界对象之后会被原地改（小境界 +1），不能和常量表共用
    return NEXT[k] ? Object.assign({}, NEXT[k]) : null;
  };
  CU.targetName = (p, path) => {
    const n = CU.nextRealm(p);
    if (!n) return '';
    const k = CU.gateKind(p);
    if (k === 'sanzai' || k === 'chunyang') return C().realms.names[n.major] + (k === 'sanzai' ? C().realms.stageNames[9][n.stage - 1] : '') + '（渡' + CU.zaiName(p) + '）';
    if (k === 'zhangguan') return '元神第' + P().cn(n.stage) + '重障关';
    if (k === 'mizhang') { const fp = P().fanxuPath(p), i = P().fanxuPassed(p) + 1; return '返虚第' + P().cn(i) + (fp.unit === '障' ? '重迷障' : fp.unit === '等' ? '等轮转' : '限天考'); }
    if (k === 'jiunan') return '合道第' + P().cn(p.realm.stage) + '难';
    if (k === 'fanxu') return '返虚' + (path ? '（' + C().realms.fanxuPaths[path].name + '）' : '');
    return k === 'minor' ? P().realmTitle({ realm: n }) : C().realms.names[n.major];
  };
  // 本重修到下一重需要的外药
  CU.minorNeed = (p) => (CU.gateKind(p) === 'minor' ? C().breakthrough.minorNeeds[p.realm.major + '.' + p.realm.stage] || null : null);

  // 主角手上最好的开府真法
  CU.bestKaifu = (s) => s.player.manuals.filter((t) => C().techniques[t].kind === 'kaifu').sort((a, b) => C().techniques[b].grade - C().techniques[a].grade)[0] || null;
  const pickKaifuByGrade = (g) => Object.keys(C().techniques).find((k) => C().techniques[k].kind === 'kaifu' && C().techniques[k].grade === g);

  CU.canAttempt = (s, p, opts) => {
    if (!P().alive(p)) return { ok: false, reason: '已故' };
    const k = CU.gateKind(p);
    const isPlayer = P().isPlayer(s, p);
    if (!k) {
      if (p.realm.major === 1) return { ok: false, reason: P().lianqiOf(p) ? '胎息壮大到头，便自然转入练炁' : '缺一门练炁术，胎息壮大到头也转不进练炁' };
      if (p.realm.major === 2) return { ok: false, reason: '练炁一至八层没有关隘，修满自动晋升' };
      if (p.realm.major === 8) return { ok: false, reason: P().fanxuPath(p).name + '这一段没有劫关，修满自然接续' };
      return { ok: false, reason: '已到本版境界上限' };
    }
    if (!P().isFull(p)) return { ok: false, reason: (k === 'taixi' ? '气感尚浅' : '修为未圆满') + '（' + Math.floor(p.progress) + '/' + P().need(p) + '）' };
    if (s.t < p.restUntil) return { ok: false, reason: '上次失败后需休养，至 ' + FX.T.fmt(p.restUntil) };
    if (p.health.state === 'heavy') return { ok: false, reason: '重伤未愈' };
    const B = C().breakthrough;
    const need = CU.minorNeed(p);
    if (need && isPlayer && !(inv(s, p)[need.item] >= need.qty)) return { ok: false, reason: '缺' + C().items[need.item].name + (need.qty > 1 ? '（需 ' + need.qty + ' 份）' : '') + '：' + need.why };
    if (need && !isPlayer && !(opts && opts.items)) return { ok: false, reason: '缺外药' };
    if (k === 'zifu' && isPlayer && !CU.bestKaifu(s)) return { ok: false, reason: '缺一篇开府真法，开辟不了紫府' };
    if (k === 'zifu' && !isPlayer && !(opts && opts.kaifu)) return { ok: false, reason: '缺开府真法' };
    if (k === 'jindan') {
      if (CU.qiFor(s, p) < B.jindan.minQi) return { ok: false, reason: '需在灵机 ' + B.jindan.minQi + ' 级以上之地结丹' };
      if (isPlayer && !(inv(s, p).ningdan > 0)) return { ok: false, reason: '缺凝丹大药（' + C().items.ningdan.where + '）' };
      if (!isPlayer && !(opts && opts.items)) return { ok: false, reason: '缺凝丹大药' };
    }
    if (k === 'yuanshen' && CU.qiFor(s, p) < B.yuanshen.minQi) return { ok: false, reason: '成就元神要有一处「地」：在灵机六级、你用得上的灵窟福地里冲关（' + CU.diNote + '）' };
    if (IN_DONGTIAN.includes(k)) {
      if (!isPlayer) return { ok: false, reason: '没有洞天' };
      if (!s.player.dongtian) return { ok: false, reason: (k === 'fanxu' ? '返虚' : '渡劫') + '要先在东海开辟一座洞天' };
      if (p.locationId !== s.player.dongtian) return { ok: false, reason: '要回到自家洞天里' + (k === 'fanxu' ? '冲关' : '渡劫') };
    }
    if (k === 'fanxu') {
      const po = CU.pathOk(s, p, (opts && opts.path) || 'shier');
      if (!po.ok) return { ok: false, reason: po.reason };
    }
    if (k === 'mizhang' && !CU.mizhangSite(s, p).ok) return { ok: false, reason: '破障要以灵脉护住法躯：回自家洞天，或到你用得上的灵窟里（灵机 ' + B.mizhang.minQi + ' 级以上）' };
    return { ok: true, kind: k };
  };

  // 下一步的前置条件清单（界面逐条打勾）。没有关隘的地方也列出来，好让玩家知道缺什么
  CU.requirements = (s, p) => {
    const k = CU.gateKind(p);
    const B = C().breakthrough;
    const I = C().items;
    const has = (item, n) => P().isPlayer(s, p) && (s.player.inv[item] || 0) >= (n || 1);
    if (p.realm.major === 1) {
      const t = P().lianqiOf(p);
      return [
        { label: '胎息壮大到头', ok: P().isFull(p), note: Math.floor(p.progress) + ' / ' + P().need(p) },
        { label: '一门练炁术', lianqi: true, ok: !!t, note: t ? '《' + t.name + '》' : '金谷墟市常备劣等练炁术，凡人国集市偶有；拜入玄真派可向长老房请授' },
      ];
    }
    if (!k) return [];
    const out = [{ label: k === 'taixi' ? '气感积累圆满' : '修为圆满', ok: P().isFull(p), note: Math.floor(p.progress) + ' / ' + P().need(p) }];
    if (k === 'taixi') {
      const near = p.nearDeathT !== null && s.t - p.nearDeathT <= B.taixi.lifeDeathYears * C().daysPerYear;
      out.push({ label: '近 ' + B.taixi.lifeDeathYears + ' 年在生死之间走过一遭（可选：+' + B.taixi.lifeDeath + '%）', ok: near, optional: true, note: '死生畏怖，神明自得；身受重伤后活下来的人更容易悟得胎息' });
    }
    if (k === 'zhuji') out.push({ label: I.zhuji.name + '（可选：+' + B.zhuji.pill + '%）', item: 'zhuji', ok: has('zhuji'), optional: true, note: I.zhuji.where + '，约 ' + I.zhuji.price + ' 符钱' });
    const need = CU.minorNeed(p);
    if (need) out.push({ label: I[need.item].name + (need.qty > 1 ? ' ×' + need.qty : ''), item: need.item, ok: has(need.item, need.qty), note: need.why + '。' + I[need.item].where + '，约 ' + I[need.item].price + ' 符钱一份' });
    if (k === 'zifu') {
      const kf = P().isPlayer(s, p) ? CU.bestKaifu(s) : null;
      out.push({ label: '一篇开府真法', kaifu: true, ok: !!kf, note: kf ? '《' + C().techniques[kf].name + '》' : '金谷墟市常备下乘开府真法；宗门弟子筑基后可向长老房请授；上乘的只在大派世族流转' });
    }
    if (k === 'jindan') {
      out.push({ label: '在灵机 ' + B.jindan.minQi + ' 级以上、你能用的地方', qi: B.jindan.minQi, ok: CU.qiFor(s, p) >= B.jindan.minQi, note: '此处你能借到 ' + CU.qiFor(s, p) + ' 级' });
      out.push({ label: I.ningdan.name, item: 'ningdan', ok: has('ningdan'), note: I.ningdan.where + '，约 ' + I.ningdan.price + ' 符钱' });
      if (P().isPlayer(s, p)) out.push(FX.Yao.requirement(s, p));
    }
    if (k === 'yuanshen') {
      out.push({ label: '一处「地」：灵机六级、你用得上的灵窟福地', qi: B.yuanshen.minQi, ok: CU.qiFor(s, p) >= B.yuanshen.minQi, note: CU.diNote + '。此处你能借到 ' + CU.qiFor(s, p) + ' 级' });
      out.push({ label: I.dingshen.name + '（可选：+' + B.yuanshenPill + '%）', item: 'dingshen', ok: has('dingshen'), optional: true, note: I.dingshen.where + '，约 ' + I.dingshen.price + ' 符钱' });
      if (has('xudu')) out.push({ label: I.xudu.name + '（可选：+' + B.xuduPill + '%）', ok: true, optional: true, note: '丹元大会魁首所得' });
    }
    if (k === 'zhangguan' && P().isPlayer(s, p)) out.push({ label: I.dadong.name + '（可选：服下助长感悟）', item: 'dadong', ok: has('dadong'), optional: true, note: '元神第一外药，修为 +本重所需的三成。' + I.dadong.where });
    // 返虚三途在界面上单列（见 app.js 的 fanxuPaths），这里只提玄中三限的门槛
    if (k === 'fanxu' && P().isPlayer(s, p)) { const po = CU.pathOk(s, p, 'sanxian'); out.push({ label: '可选「玄中三限」：' + I.xuanzhong.name + '，' + C().realms.xiangNames[C().realms.fanxuPaths.sanxian.minXiang] + '以上', item: (s.player.inv.xuanzhong || 0) > 0 ? null : 'xuanzhong', ok: po.ok, optional: true, note: po.ok ? '' : po.reason }); }
    if (k === 'mizhang') {
      const site = CU.mizhangSite(s, p);
      out.push({ label: '以灵脉护住法躯：自家洞天，或用得上的灵窟', ok: site.ok, note: site.ok ? site.label + (site.tiangu ? '，失道之祸大减' : '') : '此处你能借到 ' + CU.qiFor(s, p) + ' 级灵机' });
      if (P().isPlayer(s, p) && p.factionId && s.factions[p.factionId] && s.factions[p.factionId].key === 'yuchen') out.push({ label: I.tiangu.name + '（可选：在宵明大泽破障）', item: 'tiangu', ok: has('tiangu'), optional: true, note: I.tiangu.desc });
    }
    if (IN_DONGTIAN.includes(k)) {
      const dt = P().isPlayer(s, p) && s.player.dongtian;
      out.push({ label: '一座自家洞天', ok: !!dt, note: dt ? '在' + s.places[dt].name : '元神真人可在东海开辟洞天，要 ' + C().dongtian.cost + ' 符钱、三年工夫' });
      out.push({ label: '人在自家洞天里' + (k === 'fanxu' ? '' : '（三灾临头，只有洞天护得住）'), ok: !!dt && p.locationId === dt });
      if ((k === 'chunyang' || k === 'sanzai') && has('xudu')) out.push({ label: I.xudu.name + '（可选：+' + B.xuduZai + '%）', ok: true, optional: true, note: '天运青睐，消弭些灾数' });
    }
    out.push({ label: '没有重伤', ok: p.health.state !== 'heavy' });
    if (p.restUntil > s.t) out.push({ label: '上回冲关失败，还在休养', ok: false, note: '到 ' + FX.T.fmt(p.restUntil) + ' 才能再冲' });
    return out;
  };

  // 成功率与每一项修正（决定前必须列出）。opts.pill：NPC 是否有大造元珠；opts.kaifuGrade：NPC 开府真法品第
  CU.chance = (s, p, opts) => {
    const B = C().breakthrough;
    const k = CU.gateKind(p);
    if (!k) return null;
    const isPlayer = P().isPlayer(s, p);
    const parts = [];
    const cfg = B[k];
    const path = k === 'fanxu' ? (opts && opts.path) || 'shier' : null;
    const fp = P().fanxuPath(p);
    const site = k === 'mizhang' ? CU.mizhangSite(s, p) : null;
    if (k === 'zhangguan' || k === 'jiunan') parts.push({ label: '基础成功率（第' + P().cn(k === 'zhangguan' ? p.realm.stage + 1 : p.realm.stage) + (k === 'zhangguan' ? '重' : '难') + '）', value: cfg.base - cfg.perStage * (p.realm.stage - 1) });
    else if (k === 'mizhang') parts.push({ label: '基础成功率（' + fp.name + '）', value: fp.base });
    else parts.push({ label: '基础成功率', value: cfg.base });
    parts.push({ label: '资质 ' + p.aptitude, value: U.round1((p.aptitude - 50) * (cfg.aptFactor || B.aptitudeFactor)) });
    if (k === 'taixi') {
      if (p.nearDeathT !== null && s.t - p.nearDeathT <= cfg.lifeDeathYears * C().daysPerYear) parts.push({ label: '借生死得胎息', value: cfg.lifeDeath });

    if (k === 'zhuji') {
      const t = P().lianqiOf(p);

      hasPill = isPlayer ? inv(s, p).zhuji > 0 : !!(opts && opts.pill);
      if (hasPill) parts.push({ label: '服用' + C().items.zhuji.name, value: cfg.pill });
    }
    if (k === 'zifu' || k === 'dongxuan' || k === 'jindan') {
      if (p.daoji) parts.push({ label: C().daojiNames[p.daoji], value: B.daojiMod[p.daoji] });
    }
    if (k === 'zifu') {
      kaifu = isPlayer ? CU.bestKaifu(s) : pickKaifuByGrade((opts && opts.kaifuGrade) || 1);
      if (kaifu) parts.push({ label: '《' + C().techniques[kaifu].name + '》（' + C().gradeNames[C().techniques[kaifu].grade] + '）', value: B.yixiangMod[C().techniques[kaifu].grade] });
    }
    if ((k === 'dongxuan' || k === 'jindan') && p.yixiang) parts.push({ label: C().yixiangNames[p.yixiang], value: B.yixiangMod[p.yixiang] });
    if (k === 'jindan' && p.jinhong) parts.push({ label: P().jinhongName(p), value: C().realms.jinhongBreak[p.jinhong] });
    if (k === 'jindan' && isPlayer) { const yp = FX.Yao.breakPart(s, p); if (yp) parts.push(yp); }

    if (k === 'yuanshen') {

      if (hasShen) parts.push({ label: '点上' + C().items.dingshen.name, value: B.yuanshenPill });
      hasXudu = isPlayer && inv(s, p).xudu > 0;

    }
    if ((IN_DONGTIAN.includes(k) || k === 'zhangguan' || k === 'mizhang') && p.xiang) parts.push({ label: P().xiangName(p), value: (p.xiang - 2) * C().realms.xiangBreak });
    if (site && site.chance) parts.push({ label: site.label, value: site.chance });

    if (k === 'chunyang' || k === 'sanzai') {
      hasXudu = isPlayer && inv(s, p).xudu > 0;
      if (hasXudu) parts.push({ label: '服下' + C().items.xudu.name + '（天运青睐）', value: B.xuduZai });

    if (accYears > 0) parts.push({ label: '圆满后积累 ' + accYears + ' 年', value: Math.min(B.accumMax, accYears * B.accumPerYear) });
    // 屡败渐有心得：每一关都一样，失败一次添一点把握，有上限

    if (p.health.state === 'light') parts.push({ label: '轻伤', value: -5 });
    let total = parts.reduce((a, x) => a + x.value, 0);

  CU.attempt = (s, p, opts) => {
    const can = CU.canAttempt(s, p, opts);

      const carry = ch.kind === 'zhangguan' || ch.kind === 'mizhang' || ch.kind === 'jiunan' ? Math.max(0, p.progress - P().need(p)) : 0;

      if (p.realm.major === 8) CU.autoAdvance(s, p);
      if (P().realmRank(p) > p.peakRank) p.peakRank = P().realmRank(p);
      const extra = ch.kind === 'zhangguan' ? '，感悟已足，法力自然而动，粉碎了这一重障关；法力浑厚了一层，命寿也拔高一筹' + (p.realm.stage === C().realms.maxStage[7] ? '。十二重障关破尽，元神功满' : p.realm.stage === 6 ? '。元神之功已成其半' : '')
        : ch.kind === 'fanxu' ? '，窥破返虚之谜，自判道途「' + P().fanxuPath(p).name + '」'

      if (isPlayer) {

          type: 'breakthrough', tags: ['突破', '成功'], actors: [p.id], key: ch.kind === 'taixi' ? 'taixi_ok' : 'break_ok', pov: true,

          severity: ch.kind === 'minor' ? 3 : ch.kind === 'zhangguan' || ch.kind === 'mizhang' ? 4 : 5, causeIds: causes,

          params: { name: p.name, faction: fac, target, ok: true }, severity: p.realm.major >= 4 ? 4 : 2, causeIds: causes,

      } else if (ch.kind === 'mizhang') {

        P().injure(s, p, 'heavy');

      } else {
        const frac = R.range(r, cfg.failLossMin, cfg.failLossMax);
        p.progress = Math.floor(p.progress * (1 - frac));

  /* ---------- NPC 一年的修炼（世界模拟）---------- */
  CU.npcYear = (s, p) => {
    if (!P().alive(p)) return;

    const dil = R.range(s.rng, cc.npcDiligence[0], cc.npcDiligence[1]);

/* ---------- core/world.js ---------- */
/* ============================================================
 * world —— 世界数据库的生成：地点、道路、势力、人物、坊市
 * 世界骨架只由种子决定（可复现）；以后 AI 只能在此基础上补写来历与秘密。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;

  const W = {};

  const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  // 同一前缀尽量不重复（免得出现“松涛山”“松涛原”“松涛峰”三处）
  function uniqueName(s, r, parts, used) {
    for (let i = 0; i < 40; i++) {
      const a = R.pick(r, parts.a);
      const n = a + R.pick(r, parts.b);
      if (!used[n] && (!used['a:' + a] || i >= 30)) { used[n] = 1; used['a:' + a] = 1; return n; }
    }
    const n = R.pick(r, parts.a) + R.pick(r, parts.b) + (Object.keys(used).length + 1);
    used[n] = 1;
    return n;
  }

  /* ---------- 地点与道路 ---------- */
  W.genPlaces = (s, opts) => {
    const r = s.rng, cw = C().world;
    const used = {};
    const cells = {};
    const list = [];
    // 容氏、童家在前，其余随机；修道家族出身的主角，本族排第一
    const base = C().names.clanSurnames.filter((x) => x !== opts.clanSurname);
    const clanSurnames = base.slice(0, 2).concat(R.shuffle(r, base.slice(2)));
    if (opts.clanSurname) clanSurnames.unshift(opts.clanSurname);
    let clanIdx = 0;
    for (const type of Object.keys(cw.placeTypes)) {
      const def = cw.placeTypes[type];
      for (let i = 0; i < def.count; i++) {
        let x = 0, y = 0;
        for (let k = 0; k < 200; k++) {
          x = R.int(r, 0, cw.gridW - 1); y = R.int(r, 0, cw.gridH - 1);
          if (cells[x + ',' + y]) continue;
          if (k < 150 && list.some((q) => Math.abs(q.x - x) + Math.abs(q.y - y) < 2)) continue;
          break;
        }
        cells[x + ',' + y] = 1;
        let name;
        if (type === 'clan') { const sn = clanSurnames[clanIdx++ % clanSurnames.length]; name = sn + R.pick(r, C().names.place.clan.b); used[name] = 1; }
        else if (def.fixed && def.fixed[i]) { name = def.fixed[i]; used[name] = 1; }
        else if (type === 'sect') name = 'sect' + i; // 宗门山门在 genFactions 里按宗门命名
        else name = uniqueName(s, r, C().names.place[type], used);
        const id = 'l' + (list.length + 1);
        list.push({
          id, name, type, x, y,
          qi: R.int(r, def.qi[0], def.qi[1]),
          attr: R.pick(r, C().attrs), // 此地灵气的属相
          danger: R.int(r, def.danger[0], def.danger[1]),
          factionId: null,
          surname: type === 'clan' ? name.replace(new RegExp('(' + C().names.place.clan.b.join('|') + ')$'), '') : null,
          links: [],
        });
      }
    }
    // 最小连通树（Prim），再按比例补几条近路
    const inTree = new Set([list[0].id]);
    const link = (a, b) => {
      if (a.links.some((l) => l.to === b.id)) return;
      const days = Math.max(2, Math.round(dist(a, b) * cw.daysPerUnit));
      a.links.push({ to: b.id, days });
      b.links.push({ to: a.id, days });
    };
    while (inTree.size < list.length) {
      let best = null;
      for (const a of list) {
        if (!inTree.has(a.id)) continue;
        for (const b of list) {
          if (inTree.has(b.id)) continue;
          const d = dist(a, b);
          if (!best || d < best.d || (d === best.d && b.id < best.b.id)) best = { a, b, d };
        }
      }
      link(best.a, best.b);
      inTree.add(best.b.id);
    }
    for (const a of list) {
      if (!R.chance(r, cw.linkExtra)) continue;
      const near = list.filter((b) => b !== a && !a.links.some((l) => l.to === b.id)).sort((p, q) => dist(a, p) - dist(a, q) || (p.id < q.id ? -1 : 1))[0];
      if (near && dist(a, near) <= 4.5) link(a, near);
    }
    for (const p of list) { p.links.sort((a, b) => (a.to < b.to ? -1 : 1)); s.places[p.id] = p; }
  };

  /* ---------- 东弥州腹地 ----------
   * 南域以北的中域、西域、东域、北域与东海：地点、道路固定，三家八派六宗与门人在此生成。
   * 新开局与旧存档迁移都调用它；与南域只有一条路相连，金丹以后才走得通。 */
  // 东弥州腹地：按 config.world.outer 补齐地点（以 key 认人，旧存档按旧地名认），刷新方位，重连道路，补齐三家大派
  W.genOuter = (s) => {
    const O = C().world.outer;
    for (const pl of Object.values(s.places)) if (!pl.region) pl.region = '南域';
    const byKey = {};
    for (const pl of Object.values(s.places)) {
      if (!pl.outer) continue;
      if (!pl.key && O.oldNames[pl.name]) pl.key = O.oldNames[pl.name];
      if (pl.key) byKey[pl.key] = pl;
    }
    let n = Object.keys(s.places).length;
    for (const d of O.places) {
      let pl = byKey[d.key];
      if (!pl) {
        let id = 'l' + ++n;
        while (s.places[id]) id = 'l' + ++n;
        pl = { id, factionId: null, surname: null, links: [], outer: true };
        s.places[id] = pl;
        byKey[d.key] = pl;
      }
      Object.assign(pl, { key: d.key, name: d.name, type: d.type, x: d.x, y: d.y, qi: d.qi, attr: d.attr, danger: d.danger, region: d.region, blurb: d.blurb || '' });
    }
    // 重连腹地的道路：先拆掉所有通往腹地的旧路，再照配置连上
    const outerIds = new Set(Object.values(byKey).map((x) => x.id));
    for (const pl of Object.values(s.places)) pl.links = outerIds.has(pl.id) ? [] : pl.links.filter((l) => !outerIds.has(l.to));
    // 关口：南域最北边、离中域最近的一处凡人国、墟市或荒野
    const south = Object.values(s.places).filter((x) => x.region === '南域' && ['city', 'town', 'wild'].includes(x.type));
    const zy = byKey[O.links[0][1]];
    byKey.gate = south.sort((a, b) => a.y - b.y || Math.abs(a.x - zy.x) - Math.abs(b.x - zy.x) || (a.id < b.id ? -1 : 1))[0];
    const cw = C().world;
    for (const [ka, kb] of O.links) {
      const a = byKey[ka], b = byKey[kb];
      const gate = ka === 'gate';
      const days = gate ? O.gate.days : Math.max(4, Math.round(dist(a, b) * cw.daysPerUnit));
      const l1 = { to: b.id, days }, l2 = { to: a.id, days };
      if (gate) { l1.minMajor = l2.minMajor = O.gate.minMajor; }
      a.links.push(l1); b.links.push(l2);
      a.links.sort((x, y) => (x.to < y.to ? -1 : 1)); b.links.sort((x, y) => (x.to < y.to ? -1 : 1));
    }
    let fn = Object.keys(s.factions).length;
    for (const def of C().factionDefs.filter((d) => d.outer)) {
      const seat = byKey[def.key];
      let f = Object.values(s.factions).find((x) => x.key === def.key);
      if (!f) {
        let id = 'f' + ++fn;
        while (s.factions[id]) id = 'f' + ++fn;
        f = { id, key: def.key, name: def.name, type: def.type, tier: def.tier, tech: def.tech || null, blurb: '', seatId: seat.id, leaderId: null, relToPlayer: 0 };
        s.factions[id] = f;
        seat.factionId = f.id;
        W.genMembers(s, f);
      }
      f.blurb = def.blurb || '';
      seat.factionId = f.id;
    }
    for (const pl of Object.values(byKey)) if (pl.outer && W.hasMarket(s, pl.id) && !(s.markets && s.markets[pl.id] && s.markets[pl.id].stock && s.markets[pl.id].stock.length)) W.refreshMarket(s, pl.id);
  };

  /* ---------- 原著人物 ----------
   * 只放配角，不放陈珩这样的主角，免得压过玩家。他们和别的 NPC 一样修炼、老去、陨落。 */
  W.genNotables = (s) => {
    const placeOf = (d) => {
      if (d.placeKey) return Object.values(s.places).find((x) => x.key === d.placeKey) || null;
      if (d.placeName) return Object.values(s.places).find((x) => x.name === d.placeName) || null;
      return null;
    };
    for (const d of C().notables) {
      if (Object.values(s.people).some((q) => q.notable === d.key)) continue;
      const f = d.faction ? Object.values(s.factions).find((x) => x.key === d.faction) : null;
      if (d.faction && !f) continue;
      const place = placeOf(d) || (f ? s.places[f.seatId] : null);
      if (!place) continue;
      const q = W.spawnNpc(s, { realm: { major: d.realm[0], stage: d.realm[1] }, age: d.age, factionId: f ? f.id : null, locationId: place.id, role: d.role || (f ? 'member' : 'loose'), techniqueId: d.tech });
      q.name = d.name; q.sex = d.sex; q.notable = d.key; q.bio = d.bio;
      q.progress = 0;
      if (d.aptitude) q.aptitude = d.aptitude;
      for (const k of ['daoji', 'yixiang', 'jinhong', 'danPin', 'xiang']) if (d[k] !== undefined) q[k] = d[k];
      if (d.traits) q.traits = d.traits.slice();
      // 原著里写明的随身法器、道术
      if (d.gear) { q.gear = d.gear.map((g, i) => Object.assign({ id: 'n' + i, cap: g.grade, ling: 100 }, g)); }
      if (d.arts) { q.arts = {}; for (const k in d.arts) q.arts[k] = C().arts.xp[C().techniques[k].rank][d.arts[k] - 1]; }
      s.usedNames[d.name] = 1;
      if (d.role === 'leader' && f) {
        const old = s.people[f.leaderId];
        if (old && old.id !== q.id) old.role = 'elder';
        f.leaderId = q.id;
      }
    }
  };
  // 这条路此人走不走得通（南域通往中域的关口要金丹）
  W.linkOpen = (p, l) => !l.minMajor || p.realm.major >= l.minMajor;

  /* ---------- 势力 ---------- */
  W.genFactions = (s) => {
    const r = s.rng;
    const places = Object.values(s.places);
    let n = 1;
    const add = (def, type, name, seat) => {
      const f = { id: 'f' + n++, key: def.key || null, name, type, tier: def.tier || 1, tech: def.tech || null, blurb: def.blurb || '', seatId: seat.id, leaderId: null, relToPlayer: 0 };
      s.factions[f.id] = f;
      if (seat.type !== 'town' && seat.type !== 'city') seat.factionId = f.id;
      return f;
    };
    const sects = places.filter((x) => x.type === 'sect');
    let si = 0;
    for (const def of C().factionDefs) {
      if (def.outer) continue; // 八派六宗在东弥州腹地，由 genOuter 生成
      if (def.type === 'sect') {
        const seat = sects[si++];
        if (!seat) continue;
        seat.name = def.seat || def.name;
        if (def.tech) seat.attr = C().techniques[def.tech].attrs[0]; // 山门灵气合本门传承
        add(def, 'sect', def.name, seat);
      } else if (def.seat === 'town') {
        const seat = places.find((x) => x.type === 'town');
        const f = add(def, def.type, def.name, seat);
        seat.factionId = f.id; // 墟市由建墟市的人管着
      } else if (def.seat === 'hide') {
        const hide = places.filter((x) => (x.type === 'wild' && x.danger >= 2 && !C().world.placeTypes.wild.fixed.includes(x.name)) || (x.type === 'danger' && !C().world.placeTypes.danger.fixed.includes(x.name)));
        const seat = R.pick(r, hide);
        seat.name = def.name;
        add(def, def.type, def.name, seat);
      }
    }
    for (const p of places.filter((x) => x.type === 'clan')) add({ blurb: p.surname + '氏是南域一个小修道家族' }, 'clan', p.surname + '氏', p);
  };

  /* ---------- 人物 ---------- */
  // 按境界给出合理年龄（入道 16 岁起，修得越高越老，且不越过寿元）
  // 按境界给出合理年龄（十六岁起，修得越高越老，且不越过寿元）
  W.ageFor = (r, realm) => {
    const rank = P().rankOf(realm.major, realm.stage);
    const life = P().lifespanMaxFor(realm.major, realm.stage);
    let age = 16 + Math.round(rank * R.range(r, 2, 4.5)) + R.int(r, 0, 12);
    if (realm.major === 3) age = Math.max(age, R.int(r, 45, 130));
    if (realm.major === 4) age = Math.max(age, R.int(r, 90, 200));
    if (realm.major === 5) age = Math.max(age, R.int(r, 150, 320));
    if (realm.major === 6) age = Math.max(age, R.int(r, 300, 900));
    if (realm.major === 7) age = Math.max(age, R.int(r, 900, 2200));
    if (realm.major === 7) age = Math.max(age, 900 + realm.stage * R.int(r, 40, 110));
    if (realm.major === 8) age = Math.max(age, R.int(r, 2500, 5000));
    return Math.min(age, life - R.int(r, 3, 25));
  };
  const L = (st) => ({ major: 2, stage: st });
  const RM = (major, lo, hi) => (r) => ({ major, stage: R.int(r, lo, hi) });
  // 各类人物的境界分布：小宗掌门洞玄，二流宗门掌门金丹；南域穷土，筑基已算一方人物
  const ROLL = {
    sect1_leader: RM(5, 1, 2),
    sect1_elder: (r) => (R.chance(r, 0.4) ? RM(4, 1, 2)(r) : RM(3, 1, 3)(r)),
    sect1_member: (r) => (R.chance(r, 0.15) ? { major: 1, stage: 1 } : R.chance(r, 0.06) ? { major: 3, stage: 1 } : L(R.int(r, 1, 9))),
    sect2_leader: RM(6, 1, 2),
    sect2_elder: (r) => (R.chance(r, 0.4) ? RM(5, 1, 2)(r) : RM(4, 1, 3)(r)),
    sect2_member: (r) => (R.chance(r, 0.12) ? RM(3, 1, 2)(r) : L(R.int(r, 2, 9))),
    // 八派六宗：掌门元神（多已破了好几重障关），长老金丹，门人多是筑基、紫府
    sect3_leader: RM(7, 4, 10),
    sect3_elder: (r) => (R.chance(r, 0.6) ? RM(6, 1, 3)(r) : RM(5, 2, 3)(r)),
    sect3_member: (r) => (R.chance(r, 0.1) ? RM(6, 1, 2)(r) : R.chance(r, 0.3) ? RM(4, 1, 3)(r) : R.chance(r, 0.6) ? RM(3, 1, 3)(r) : L(R.int(r, 6, 9))),
    clan_leader: RM(3, 1, 2),
    clan_elder: (r) => (R.chance(r, 0.4) ? { major: 3, stage: 1 } : L(R.int(r, 8, 9))),
    clan_member: (r) => (R.chance(r, 0.2) ? { major: 1, stage: 1 } : L(R.int(r, 1, 7))),
    league_leader: RM(5, 1, 1),
    league_member: (r) => L(R.int(r, 3, 9)),
    evil_leader: RM(3, 2, 3),
    evil_member: (r) => L(R.int(r, 3, 9)),
    loose: (r) => (R.chance(r, 0.15) ? { major: 1, stage: 1 } : R.chance(r, 0.05) ? { major: 3, stage: 1 } : L(Math.min(9, 1 + Math.floor(Math.pow(R.next(r), 1.6) * 9)))),
  };
  W.rollRealm = (r, kind) => (ROLL[kind] || ROLL.loose)(r);

  // NPC 的练炁术：本门传承或散修常见货色。腹地大派门人出身各异，带进来的真炁也不一样（techs 按权重抽）
  W.npcTech = (r, f, role) => {
    const d = f && f.key && f.type === 'sect' ? C().factionDefs.find((x) => x.key === f.key) : null;
    if (d && d.techs) { const ks = Object.keys(d.techs); return R.weighted(r, ks, (k) => d.techs[k]); }
    if (f && f.tech && (f.type === 'sect' && (role !== 'member' || R.chance(r, 0.7)))) return f.tech;
    return R.weighted(r, ['linghe', 'guiyuan', 'chiyang', 'xuanshui', 'handou'], (k) => ({ linghe: 5, guiyuan: 4, chiyang: 2, xuanshui: 2, handou: 0.3 }[k]));
  };

  W.spawnNpc = (s, o) => {
    const r = s.rng;
    const realm = o.realm || W.rollRealm(r, o.kind || 'loose');
    const age = o.age !== undefined ? o.age : W.ageFor(r, realm);
    const f = o.factionId ? s.factions[o.factionId] : null;
    const tech = o.techniqueId || W.npcTech(r, f, o.role || 'member');
    const B = C().breakthrough;
    const kaifuGrade = realm.major >= 4 ? R.weighted(r, [1, 2, 3], (g) => B.npcKaifu[g] * (f && f.tier >= 2 ? [1, 0.6, 1.5, 3][g] * (f.tier >= 3 ? [1, 0.5, 1, 2][g] : 1) : 1)) : 0;
    const big = f && f.tier >= 3;
    const p = P().create(s, {
      surname: o.surname, realm, birthYear: s.year - age,
      progress: Math.floor(R.next(r) * Math.min(P().need({ realm }), 9999) * 0.8),
      techniqueId: tech,
      daoji: realm.major >= 3 ? P().daojiOf(C().techniques[tech].tier) : 0,
      kaifuId: kaifuGrade ? Object.keys(C().techniques).find((k) => C().techniques[k].kind === 'kaifu' && C().techniques[k].grade === kaifuGrade) : null,
      yixiang: kaifuGrade,
      daoId: realm.major >= 6 ? (big ? R.pick(r, ['dao_mid', 'dao_mid', 'dao_high']) : 'dao_low') : null,
      locationId: o.locationId, factionId: o.factionId || null, role: o.role || (o.factionId ? 'member' : 'loose'),
    });
    if (realm.major > 5 || (realm.major === 5 && realm.stage === 3)) p.jinhong = CU().jinhongFor(p, R.int(r, 0, 1));
    if (realm.major >= 6) p.danPin = CU().danPinFor(p, R.int(r, 0, 2), FX.Yao.npcCount(r, f));
    if (realm.major >= 7) p.xiang = CU().xiangFor(p, R.int(r, 0, 3));
    if (P().isFull(p) && !CU().gateKind(p)) CU().autoAdvance(s, p);
    FX.Ars.npcKit(s, p);
    return p;
  };
  const CU = () => FX.CU;

  W.genMembers = (s, f) => {
    const r = s.rng, cw = C().world;
    const seat = s.places[f.seatId];
    const [lo, hi] = cw.factionMembers[f.type];
    const n = R.int(r, lo, hi) + (f.tier >= 3 ? 6 : 0);
    const sn = f.type === 'clan' ? seat.surname : null;
    const prefix = f.type === 'sect' ? 'sect' + f.tier : f.type;
    for (let i = 0; i < n; i++) {
      const role = i === 0 ? 'leader' : (f.type === 'sect' && i <= (f.tier >= 3 ? 5 : 2)) || (f.type === 'clan' && i === 1) ? 'elder' : 'member';
      const p = W.spawnNpc(s, { kind: prefix + '_' + role, role, factionId: f.id, locationId: seat.id, surname: sn });
      if (role === 'leader') f.leaderId = p.id;
    }
  };

  W.genPeople = (s) => {
    const r = s.rng, cw = C().world;
    for (const f of Object.values(s.factions)) W.genMembers(s, f);
    const looseSpots = Object.values(s.places).filter((p) => p.type === 'town' || p.type === 'wild' || p.type === 'city');
    while (P().living(s).length < cw.npcCount) W.spawnNpc(s, { kind: 'loose', locationId: R.pick(r, looseSpots).id });
  };

  // 世界里的“下一代”：势力招新、散修补员，让世界长期不空
  W.replenish = (s) => {
    const r = s.rng, cw = C().world;
    for (const f of Object.values(s.factions)) {
      const members = P().living(s).filter((p) => p.factionId === f.id);
      const [lo] = cw.factionMembers[f.type];
      if (members.length < lo && R.chance(r, 0.7)) {
        const seat = s.places[f.seatId];
        W.spawnNpc(s, { realm: R.chance(r, 0.4) ? { major: 1, stage: 1 } : L(R.int(r, 1, 3)), age: R.int(r, 16, 22), factionId: f.id, locationId: seat.id, surname: f.type === 'clan' ? seat.surname : null });
      }
      // 掌门/家主身故：由在世最强者接任
      if (!P().alive(s.people[f.leaderId])) {
        const next = members.filter((p) => P().alive(p)).sort((a, b) => P().realmRank(b) - P().realmRank(a) || (a.id < b.id ? -1 : 1))[0];
        if (next) { f.leaderId = next.id; next.role = 'leader'; }
      }
    }
    const loose = P().living(s).filter((p) => !p.factionId && !P().isPlayer(s, p));
    const spots = Object.values(s.places).filter((p) => p.type === 'town' || p.type === 'wild' || p.type === 'city');
    for (let i = loose.length; i < cw.looseMin; i++) W.spawnNpc(s, { realm: R.chance(r, 0.3) ? { major: 1, stage: 1 } : L(R.int(r, 1, 4)), age: R.int(r, 16, 30), locationId: R.pick(r, spots).id });
  };

  /* ---------- 坊市 ---------- */
  W.refreshMarket = (s, placeId) => {
    const r = s.rng, M = C().market;
    const place = s.places[placeId];
    const priceOf = (key) => {
      const base = key.startsWith('tech:') ? C().techniques[key.slice(5)].price : C().items[key].price;
      return Math.max(1, Math.round(base * (1 + R.range(r, -M.priceSwing, M.priceSwing))));
    };
    const def = M[place.type] || { staples: [], rare: [], slots: 0 };
    const stock = def.staples.map((x) => ({ item: x.item, qty: R.int(r, x.qty[0], x.qty[1]), price: priceOf(x.item) }));
    const pool = def.rare.filter((x) => !stock.some((y) => y.item === x.item));
    for (let i = 0; i < def.slots; i++) {
      if (!R.chance(r, def.chance)) continue;
      const pick = R.weighted(r, pool, (x) => x.w);
      if (!pick) break;
      pool.splice(pool.indexOf(pick), 1);
      stock.push({ item: pick.item, qty: pick.qty ? R.int(r, pick.qty[0], pick.qty[1]) : 1, price: priceOf(pick.item) });
    }
    s.markets[placeId] = { year: s.year, stock };
  };
  W.hasMarket = (s, placeId) => !!C().world.placeTypes[s.places[placeId].type].market;

  W.itemName = (key) => {
    if (!key.startsWith('tech:')) return C().items[key] ? C().items[key].name : key;
    const t = C().techniques[key.slice(5)];
    return (t.kind === 'kaifu' ? '开府真法' : t.kind === 'dao' ? '道书' : t.kind === 'shu' ? C().shuRankNames[t.rank] : '练炁术') + '《' + t.name + '》';
  };
  W.sellPrice = (s, key) => Math.max(1, Math.floor(C().items[key].price * C().market.sellRatio));

  /* ---------- 道路 ---------- */
  // 最短路（按天数，Dijkstra）；返回经过的地点 id 列表（含起终点）与总天数
  W.route = (s, from, to, who) => {
    if (from === to) return { path: [from], days: 0 };
    const D = {}, prev = {}, done = new Set();
    for (const id in s.places) D[id] = Infinity;
    D[from] = 0;
    for (;;) {
      let u = null;
      for (const id in D) if (!done.has(id) && D[id] < Infinity && (u === null || D[id] < D[u] || (D[id] === D[u] && id < u))) u = id;
      if (u === null) break;
      if (u === to) break;
      done.add(u);
      for (const l of s.places[u].links) if ((!who || W.linkOpen(who, l)) && D[u] + l.days < D[l.to]) { D[l.to] = D[u] + l.days; prev[l.to] = u; }
    }
    if (D[to] === Infinity) return null;
    const path = [to];
    while (path[0] !== from) path.unshift(prev[path[0]]);
    return { path, days: D[to] };
  };

  FX.World = W;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/events.js ---------- */
/* ============================================================
 * events —— 待决事件：绑定、选项视图、结算、延迟后续、引用校验
 * 事件定义（数据）在 encounters.js。阶段 3 起 AI 生成的事件提案
 * 经规则验证后也走这里结算。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;
  const H = () => FX.H;

  const Ev = {};
  Ev.def = (id) => FX.EVENTS[id];
  // 数据事件（钩子长出来的事）的标题、选项随实例而定
  Ev.title = (s, inst) => { const d = Ev.def(inst.defId); return d ? (typeof d.name === 'function' ? d.name(s, inst.bound) : d.name) : inst.defId; };
  Ev.opts = (s, inst) => { const d = Ev.def(inst.defId); return typeof d.options === 'function' ? d.options(s, inst.bound) : d.options; };
  const isPid = (v) => typeof v === 'string' && /^p\d+$/.test(v);

  // 绑定对象有效性：人物需在世，势力与地点需存在
  Ev.valid = (s, b) => {
    for (const k in b) {
      const v = b[k];
      if (k.startsWith('_')) continue;
      if (k === 'faction') { if (!s.factions[v]) return false; continue; }
      if (k === 'place') { if (!s.places[v]) return false; continue; }
      if (isPid(v) && !P().alive(s.people[v])) return false;
    }
    return true;
  };

  Ev.names = (s, b) => {
    const n = {};
    for (const k in b) {
      const v = b[k];
      if (isPid(v)) n[k] = s.people[v] ? s.people[v].name : '（已不在）';
      else if (k === 'faction' && s.factions[v]) n[k] = s.factions[v].name;
      else if (k === 'place' && s.places[v]) n[k] = s.places[v].name;
      else n[k] = v;
    }
    return n;
  };

  Ev.spawn = (s, defId, bound, causeIds) => {
    if (!Ev.def(defId) || !Ev.valid(s, bound || {})) return null;
    const inst = { id: 'e' + s.nextId++, defId, bound: bound || {}, t: s.t, causeIds: (causeIds || []).filter(Boolean) };
    s.pending.push(inst);
    return inst;
  };

  Ev.schedule = (s, defId, afterDays, bound, causeIds, chance) => {
    const q = { id: 'd' + s.nextId++, defId, bound: bound || {}, fireT: s.t + afterDays, chance: chance === undefined ? 1 : chance, causeIds: (causeIds || []).filter(Boolean) };

  };

  Ev.processQueue = (s) => {
    const due = s.eventQueue.filter((q) => q.fireT <= s.t);
    if (!due.length) return;
    s.eventQueue = s.eventQueue.filter((q) => q.fireT > s.t);
    for (const q of due) {
      const def = Ev.def(q.defId);
      if (!def) continue;
      if (!Ev.valid(s, q.bound)) continue;
      if (def.cond && !def.cond(s, q.bound)) continue;
      if (!R.chance(s.rng, q.chance)) continue;
      if (def.auto) {
        const txt = def.auto(s, q.bound, q.causeIds);
        if (txt) H().add(s, { type: 'event', tags: ['事件'], actors: Object.values(q.bound).filter(isPid), key: 'event', params: { title: def.name, choice: '后续', result: txt }, severity: def.severity || 3, pov: true, causeIds: q.causeIds });
      } else Ev.spawn(s, q.defId, q.bound, q.causeIds);
    }
  };

  // 待决事件引用失效（例如对手先一步死了）：取消并写明原因
  Ev.prune = (s) => {
    for (const inst of s.pending.slice()) {
      if (Ev.valid(s, inst.bound)) continue;
      s.pending = s.pending.filter((x) => x !== inst);
      const def = Ev.def(inst.defId);
      H().add(s, { type: 'event', tags: ['事件', '终止'], key: 'event', params: { title: def ? Ev.title(s, inst) : inst.defId, choice: '未及处置', result: '当事人已不在，事情自行了结' }, severity: 1, pov: true, causeIds: inst.causeIds });
    }
  };

  Ev.view = (s, inst) => {
    const def = Ev.def(inst.defId);
    const n = Ev.names(s, inst.bound);
    return {
      id: inst.id,
      defId: inst.defId,
      name: Ev.title(s, inst),
      category: def.category,
      text: typeof def.text === 'function' ? def.text(s, inst.bound, n) : U.fill(def.text, n),
      people: Object.entries(inst.bound).filter(([k, v]) => !k.startsWith('_') && isPid(v)).map(([, v]) => v),
      causes: inst.causeIds.map((c) => H().get(s, c)).filter(Boolean).map((e) => H().text(e)),
      options: Ev.opts(s, inst).map((o) => {
        const av = o.avail ? o.avail(s, inst.bound) : true;
        return {
          id: o.id, label: o.label,
          cost: o.cost ? o.cost(s, inst.bound, n) : '无',
          risk: o.risk ? o.risk(s, inst.bound, n) : '无明显风险',
          outcome: o.outcome ? o.outcome(s, inst.bound, n) : '',
          chance: o.chance ? o.chance(s, inst.bound) : null,
          irreversible: !!o.irreversible,
          available: av === true, reason: av === true ? '' : av,
        };
      }),
    };
  };

  Ev.resolve = (s, instId, optId) => {
    const inst = s.pending.find((x) => x.id === instId);
    if (!inst) return { ok: false, error: '事件不存在或已处理' };
    const def = Ev.def(inst.defId);
    const opt = Ev.opts(s, inst).find((o) => o.id === optId);
    if (!opt) return { ok: false, error: '无此选项' };

    const av = opt.avail ? opt.avail(s, inst.bound) : true;
    if (av !== true) return { ok: false, error: av };
    s.pending = s.pending.filter((x) => x !== inst);
    // 先写决策记录，让后果可以引用它作为前因
    const hid = H().add(s, {
      type: 'event', tags: ['事件', def.category], actors: Object.entries(inst.bound).filter(([k, v]) => !k.startsWith('_') && isPid(v)).map(([, v]) => v),
      places: inst.bound.place ? [inst.bound.place] : [], key: 'event', params: { title: Ev.title(s, inst), choice: opt.label, result: '' },
      severity: def.severity || 2, pov: true, causeIds: inst.causeIds,
    });
    const out = opt.apply(s, inst.bound, { hid, names: Ev.names(s, inst.bound), inst }) || {};
    const result = typeof out === 'string' ? out : out.text || '';
    const e = H().get(s, hid);
    e.params.result = result;
    e.params.defId = inst.defId;
    if (inst.bound._kind) e.params.kind = inst.bound._kind;
    return { ok: true, result, hid, gain: !!out.gain, days: out.days || 0 };
  };

  FX.Ev = Ev;

/* ============================================================
 * encounters（config 区块）—— 斗法检定与需要玩家决断的遭遇
 * 成败一律由这里的规则掷骰决定；文字只描述规则算出的结果。
 * 阶段 3 起，这些模板只在没有 AI 时兜底。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;
  const H = () => FX.H;

  /* ---------- 斗法与逃遁 ---------- */
  const Combat = {};
  Object.defineProperty(Combat, 'beastNames', { get: () => C().encounter.beastNames });

  Combat.fightChance = (s, p, foePower) => {
    const E = C().encounter;
    const my = P().powerBreakdown(s, p);
    const raw = (my.total / (my.total + foePower)) * 100;
    const chance = Math.round(U.clamp(raw, E.winChanceMin, E.winChanceMax));
    const parts = my.factors.map((f) => ({ label: f.label, value: '×' + f.value })).concat([{ label: '我方战力', value: my.total }, { label: '对方战力', value: Math.round(foePower * 10) / 10 }]);
    return { chance, parts, my: my.total };
  };

  Combat.fleeChance = (s, p, foePower) => {
    const E = C().encounter;
    const parts = [{ label: '基础', value: E.fleeBase }, { label: '资质 ' + p.aptitude, value: U.round1((p.aptitude - 50) * E.fleePerApt) }];
    const my = P().power(s, p);
    const ratio = foePower / Math.max(0.1, my);
    if (ratio > 1) parts.push({ label: '对方强出 ' + U.round1(ratio) + ' 倍', value: -Math.round(Math.min(30, (ratio - 1) * 10)) });
    else parts.push({ label: '对方不如你', value: Math.round(Math.min(20, (1 / ratio - 1) * 10)) });
    if (p.traits.includes('谨慎')) parts.push({ label: '谨慎', value: C().traits.cautiousFlee });
    if (p.health.state !== 'healthy') parts.push({ label: '带伤', value: p.health.state === 'heavy' ? -25 : -10 });
    for (const x of FX.Ars.fleeParts(s, p)) parts.push(x);
    const chance = Math.round(U.clamp(parts.reduce((a, x) => a + x.value, 0), 5, 95));
    return { chance, parts };
  };

  // 落败受伤；对手远强于自己且伤重时可能身死。返回描述与是否身死
  Combat.hurt = (s, p, foePower, foeName, causeIds) => {
    const E = C().encounter;
    const cut = FX.Ars.hurtCut(s, p); // 护身法器、护身道术挡下几成
    const heavy = R.chance(s.rng, E.lossHeavyShare * (1 - cut));
    const my = P().power(s, p); // 强弱按交手时算，不按受伤之后算
    P().injure(s, p, heavy ? 'heavy' : 'light');
    if (heavy && foePower >= 2 * my && R.chance(s.rng, E.deathWhenOutmatched * (1 - cut))) {
      P().kill(s, p, '败于' + foeName + '之手', causeIds, { key: 'fight' });
      return { text: '伤重不治', died: true };
    }
    return { text: heavy ? '身受重伤' : '受了轻伤', died: false };
  };

  const pl = (s) => P().player(s);
  const inv = (s) => s.player.inv;
  const giveItem = (s, key, n) => { inv(s)[key] = (inv(s)[key] || 0) + n; };
  const lootBeast = (s, danger) => {
    const hide = R.int(s.rng, 1, 2 + Math.floor(danger / 2));
    giveItem(s, 'beastHide', hide);
    const parts = [C().items.beastHide.name + '×' + hide];
    if (R.chance(s.rng, 0.35 + danger * 0.1)) { const c = 1 + (danger >= 4 && R.chance(s.rng, 0.3) ? 1 : 0); giveItem(s, 'beastCore', c); parts.push(C().items.beastCore.name + '×' + c); }
    return parts.join('、');
  };
  const fightOpt = (foe) => ({
    id: 'fight', label: '迎战',
    chance: (s, b) => Combat.fightChance(s, pl(s), foe(s, b).power),
    cost: () => '无',
    risk: (s, b) => { const ch = Combat.fightChance(s, pl(s), foe(s, b).power); return `胜率 ${ch.chance}%；落败会受伤（${Math.round(C().encounter.lossHeavyShare * 100)}% 为重伤）${foe(s, b).power >= 2 * ch.my ? '，对方远强于你，重伤时可能身死' : ''}`; },
    outcome: (s, b) => foe(s, b).winText,
    apply(s, b, ctx) {
      const f = foe(s, b);

      const st = s.player.stats;
      st.fights++;
      if (R.next(s.rng) * 100 < ch.chance) {
        st.wins++;
        const loot = f.onWin(s, b, ctx);
        H().add(s, { type: 'fight', tags: ['斗法', '胜'], actors: [s.player.id].concat(b.foe ? [b.foe] : []), places: [b.place], key: 'fight_win', pov: true, params: { name: pl(s).name, foe: f.name, chance: ch.chance, loot }, severity: 2, causeIds: [ctx.hid] });
        return { text: `胜（${ch.chance}%），${loot}`, gain: true };

      return { text: `败（${ch.chance}%），${h.text}` };
    },

  const fleeOpt = (foe) => ({

    chance: (s, b) => Combat.fleeChance(s, pl(s), foe(s, b).power),
    cost: () => '无',
    risk: (s, b) => `成功率 ${Combat.fleeChance(s, pl(s), foe(s, b).power).chance}%；失败会受伤`,
    outcome: () => '全身而退，但一无所得',
    apply(s, b, ctx) {

      if (R.next(s.rng) * 100 < ch.chance) {
        H().add(s, { type: 'fight', tags: ['逃遁'], actors: [s.player.id], places: [b.place], key: 'flee_ok', pov: true, params: { name: pl(s).name, foe: f.name, chance: ch.chance }, severity: 1, causeIds: [ctx.hid] });
        return { text: `脱身（${ch.chance}%）` };

    onWin(s2, b2) {

  });
  const npcFoe = (s, b) => {

    return {
      name: p.name, power: P().power(s, p), winText: '击退对方，缴获其随身符钱；从此结仇',
      onWin(s2, b2) {
        const got = R.int(s2.rng, 5, 15) * Math.max(1, P().realmRank(p));
        s2.player.stone += got;

        P().adjustRelation(s2, s2.player.id, p.id, -60, '交手');
        const g = FX.Ars.loot(s2, p);

      },
      onLose(s2) { const lost = Math.floor(s2.player.stone * R.range(s2.rng, 0.3, 0.6)); s2.player.stone -= lost; P().adjustRelation(s2, s2.player.id, p.id, -30, '交手'); },

  };

    text: (s, b, n) => `${n.place}，${b._why || '一头'}${b._beast}拦在前方（战力约 ${b._power}）。你如今${P().realmName(pl(s))}，战力 ${P().power(s, pl(s))}。`,
    options: [fightOpt(beastFoe), fleeOpt(beastFoe)],

    text: (s, b, n) => { const p = s.people[b.foe]; return `${n.place}，${n.foe}（${P().realmName(p)}，${P().factionName(s, p)}，战力 ${P().power(s, p)}）拦住去路，要你留下买路符钱。你身上有符钱 ${s.player.stone}，战力 ${P().power(s, pl(s))}。`; },
    options: [
      fightOpt(npcFoe),
      {
        id: 'pay', label: '破财消灾',
        cost: (s) => `符钱 −${Math.ceil(s.player.stone * 0.4)}`, risk: () => '无', outcome: () => '对方拿钱走人',
        apply(s, b) { const lost = Math.ceil(s.player.stone * 0.4); s.player.stone -= lost; return { text: `交出符钱 ${lost}` }; },

        outcome: () => '若有所得，可能是丹药、符钱、符器，甚至一卷练炁术',

        apply(s, b, ctx) {

            const st = R.int(s.rng, 80, 200); s.player.stone += st; return { text: `寻得一卷你已会的道术玉简，另有符钱 ${st}`, gain: true, days: 10 };

          const t = R.weighted(s.rng, ['guiyuan', 'chiyang', 'xuanshui', 'chimei', 'jingyi', 'handou', 'dongling', 'kaifu_low'],
            (k) => ({ guiyuan: 3, chiyang: 3, xuanshui: 3, chimei: 1, jingyi: 1, handou: 1, dongling: 0.3, kaifu_low: 1 }[k]));

          return { text: `寻得${FX.World.itemName('tech:' + t)}的玉简`, gain: true, days: 10 };
        },

 * ============================================================ */
(function (G) {

  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;

  const W = () => FX.World;
  const CU = () => FX.CU;
