/* ============================================================
 * arsenal —— 法器与道术、神通
 * 照《仙业》：
 *  · 祭器法首重炼形，其次禁制。炼形一次、十道禁制是下品符器，再炼形一次又能打入十道，以此类推；
 *    上品符器之上是法器（生出真识，有器灵），再往上是道器。粗胚的材质决定能炼形几次。
 *  · 正统仙道里道术分下、中、上三乘，道术之上才是神通；金丹真人的法力才撑得起神通。
 *    道术要参习，分入门、小成、中成、大成。
 * 主角和 NPC 用同一套算法：p.gear 是随身法器，p.arts 是各门道术已参习的天数。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;
  const H = () => FX.H;
  const Sim = () => FX.Sim;
  const T = () => FX.T;
  const W = () => FX.World;

  const Ars = {};
  const GC = () => C().gear;
  const AC = () => C().arts;
  const TQ = (k) => C().techniques[k];
  const me = (s) => P().player(s);
  const SLOTS = ['atk', 'def', 'dun'];

  /* ---------- 法器 ---------- */
  Ars.gradeName = (g) => GC().gradeNames[g.grade];
  const lingOf = (g) => (g.ling === undefined ? 100 : g.ling);
  const lingF = (g) => (g.grade >= 4 ? 0.3 + (0.7 * lingOf(g)) / 100 : 1);
  // 按禁制多少在本品与上一品之间折算
  const interp = (tbl, g) => {
    const lo = tbl[g.grade - 1], hi = tbl[g.grade];
    return lo + (hi - lo) * U.clamp((g.jin - 10 * (g.grade - 1)) / 10, 0, 1);
  };
  // key：atk/def 是倍数，defHurt/dunFlee/dunTravel 是加成
  Ars.gearVal = (g, key) => {
    const v = interp(GC()[key], g);
    return key === 'atk' || key === 'def' ? 1 + (v - 1) * lingF(g) : v * lingF(g);
  };
  const slotKey = { atk: 'atk', def: 'def', dun: 'dunFlee' };
  // 持有人境界不够时，法器、道器只发挥得出几成（金丹才使得顺法器，纯阳以上才掌控得了道器）
  Ars.useF = (p, g) => (g.grade >= 7 ? (p.realm.major >= 9 ? 1 : GC().underUse) : g.grade >= 4 ? (p.realm.major >= 6 ? 1 : GC().underUse) : 1);
  Ars.gearValFor = (p, g, key) => { const v = Ars.gearVal(g, key), f = Ars.useF(p, g); return key === 'atk' || key === 'def' ? 1 + (v - 1) * f : v * f; };
  Ars.best = (p, slot) => {
    let best = null, bv = -1;
    for (const g of p.gear || []) if (g.slot === slot) { const v = Ars.gearValFor(p, g, slotKey[slot]); if (v > bv) { bv = v; best = g; } }
    return best;
  };
  Ars.title = (g) => g.name + '（' + Ars.gradeName(g) + ' · ' + g.jin + ' 道禁制' + (g.grade >= 4 && lingOf(g) < 100 ? ' · 器灵炼化 ' + Math.floor(lingOf(g)) + '%' : '') + '）';
  Ars.value = (g) => Math.round(interp(GC().value, g));
  Ars.make = (s, spec) => {
    s.player.gearSeq = (s.player.gearSeq || 0) + 1;
    return { id: 'g' + s.player.gearSeq, name: spec.name, slot: spec.slot, grade: spec.grade, jin: spec.jin, cap: spec.cap || spec.grade, ling: spec.ling === undefined ? 100 : spec.ling };
  };

  /* ---------- 道术、神通 ---------- */
  Ars.isArt = (k) => !!TQ(k) && TQ(k).kind === 'shu';
  // 进境：-1 没有玉简；0 未入门；1 入门 … 4 大成
  Ars.level = (p, k) => {

    const th = AC().xp[TQ(k).rank];

        const top = mat === 'lingtian' ? G.maxGrade : G.capMax;
        if (g.cap >= top) continue;
        add({ type: 'chongzhu', gid: g.id, item: mat, days: 30, label: '把' + cf.items[mat].name + '熔进' + g.name + '重铸（材质上限到' + G.gradeNames[Math.min(top, mat === 'lingtian' ? top : g.cap + G.matCap[mat])] + '）', group: '法器' });
      }
      if (market) add({ type: 'sell_gear', gid: g.id, days: 0, gain: Math.round(Ars.value(g) * G.sellRatio), label: '卖掉' + g.name + '（' + Math.round(Ars.value(g) * G.sellRatio) + ' 符钱）', group: '法器' });
    }
  };

  /* ---------- 结算 ---------- */
  const DO = {};
  const gearOf = (s, id) => (me(s).gear || []).find((g) => g.id === id);

  // 参习：资质高的快；境界高出这门道术一档，参习也快些
  Ars.practiceRate = (p, k, s) => {
    const t = TQ(k);
    const lu = s ? FX.Sect.perkOf(s, p, 'daolu') : 0; // 道录殿收藏典籍，参习快些
    return (0.6 + p.aptitude / 100) * (1 + 0.25 * Math.max(0, p.realm.major - AC().rankBase[t.rank])) * (lu ? 1.2 + 0.1 * lu : 1);
  };
  // 灵宝殿专擅打造法宝：祭炼、炼形少花符钱
  Ars.costMult = (s) => { const k = FX.Sect.perkOf(s, me(s), 'lingbao'); return k ? 0.8 - 0.1 * k : 1; };
  DO.practice = (s, a) => {
    const p = me(s), t = TQ(a.tech);
    if (t.need && p.arts[a.tech] === undefined) { s.player.inv[t.need]--; p.arts[a.tech] = 0; }
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    const before = Ars.level(p, a.tech);
    p.arts[a.tech] = (p.arts[a.tech] || 0) + r.used * Ars.practiceRate(p, a.tech, s);
    const after = Ars.level(p, a.tech);
    const up = after > before;
    const state = up ? '修至' + Ars.levelName(after) : after >= 4 ? '已到大成' : '离' + Ars.levelName(after + 1) + '还差些火候';
    H().add(s, { type: 'learn', tags: ['道术'], actors: [p.id], key: up ? 'art_up' : 'practice', pov: true, severity: up ? 2 : 1, params: { name: p.name, tech: t.name, dur: T().dur(r.used), state, rank: C().shuRankNames[t.rank] } });
    return { text: '参习《' + t.name + '》' + T().dur(r.used) + '，' + state, interrupted: r.interrupted };
  };

  DO.jilian = (s, a) => {
    const p = me(s), g = gearOf(s, a.gid), G = GC();
    s.player.stone -= a.cost;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    const done = Math.min(a.n, Math.floor(r.used / G.jinDays[g.grade] + 1e-9));
    if (done < a.n) s.player.stone += Math.round((a.n - done) * (a.cost / a.n)); // 没祭完的退回
    g.jin += done;
    H().add(s, { type: 'item', tags: ['法器'], actors: [p.id], key: 'jilian', pov: true, severity: 1, params: { name: p.name, gear: g.name, n: done, title: Ars.title(g) } });
    return { text: '给' + g.name + '打入 ' + done + ' 道禁制，如今是' + Ars.title(g), interrupted: r.interrupted };
  };

  DO.lianxing = (s, a) => {
    const p = me(s), g = gearOf(s, a.gid);
    s.player.stone -= a.cost;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    if (r.used < a.days) { s.player.stone += a.cost; return { text: '炼形到一半出了变故，只得停手（符钱没耗掉）', interrupted: true }; }
    g.grade++;
    let extra = '';
    // 以本命精血和法力祭成法器，器灵初生就认你为主
    if (g.grade === 4) { g.ling = 100; extra = '，器中孕出真识，生了器灵'; }
    H().add(s, { type: 'item', tags: ['法器'], actors: [p.id], key: 'lianxing', pov: true, severity: g.grade >= 4 ? 4 : 2, params: { name: p.name, gear: g.name, grade: Ars.gradeName(g), extra } });
    return { text: g.name + '炼形为' + Ars.gradeName(g) + extra + '，可以接着打入禁制' };
  };

  DO.lianhua = (s, a) => {
    const p = me(s), g = gearOf(s, a.gid), G = GC();
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    const speed = p.realm.major >= 6 ? 1 + 0.5 * (p.realm.major - 6) : 0.25;
    g.ling = Math.min(100, lingOf(g) + (r.used / G.lingDays[g.grade]) * 100 * speed);
    const done = g.ling >= 100;
    H().add(s, { type: 'item', tags: ['法器'], actors: [p.id], key: done ? 'lianhua_done' : 'lianhua', pov: true, severity: done ? 3 : 1, params: { name: p.name, gear: g.name, ling: Math.floor(g.ling) } });
    return { text: done ? g.name + '的器灵认你为主了' : '炼化' + g.name + '的器灵，到了 ' + Math.floor(g.ling) + '%', interrupted: r.interrupted };
  };

  DO.chongzhu = (s, a) => {
    const p = me(s), g = gearOf(s, a.gid), G = GC();
    s.player.inv[a.item]--;
    const r = Sim().passDays(s, a.days, 'other');
    if (!P().alive(p)) return { text: '' };
    g.cap = a.item === 'lingtian' ? G.maxGrade : Math.min(G.capMax, g.cap + G.matCap[a.item]);
    H().add(s, { type: 'item', tags: ['法器'], actors: [p.id], key: 'chongzhu', pov: true, severity: 2, params: { name: p.name, gear: g.name, item: C().items[a.item].name, cap: G.gradeNames[g.cap] } });
    return { text: '熔进' + C().items[a.item].name + '，' + g.name + '的材质够炼形到' + G.gradeNames[g.cap] + '了', interrupted: r.interrupted };
  };

  DO.sell_gear = (s, a) => {
    const p = me(s), g = gearOf(s, a.gid);
    p.gear = p.gear.filter((x) => x.id !== g.id);
    s.player.stone += a.gain;
    H().add(s, { type: 'trade', tags: ['坊市'], actors: [p.id], places: [p.locationId], key: 'sell_gear', pov: true, severity: 1, params: { name: p.name, gear: Ars.title(g), gain: a.gain } });
    return { text: '卖掉' + g.name + '，得符钱 ' + a.gain };
  };
  Ars.DO = DO;

  /* ---------- 斗法缴获：打退的人身上最好的一件法器 ---------- */
  Ars.loot = (s, foe) => {
    const p = me(s);
    if (!foe.gear || !foe.gear.length || !R.chance(s.rng, GC().lootChance)) return null;
    const g = foe.gear.slice().sort((x, y) => Ars.value(y) - Ars.value(x))[0];
    foe.gear = foe.gear.filter((x) => x !== g);
    const mine = Ars.make(s, g);
    if (mine.grade >= 4) mine.ling = 0; // 器灵不认新主，要慢慢炼化
    p.gear.push(mine);
    return Ars.title(mine);
  };

  /* ---------- NPC 的随身法器与道术：按境界、出身配齐，境界升了就补上 ---------- */
  // 每个大境界：各类法器 [有的机会, 最低品, 最高品]
  const NPC_GEAR = {
    2: { atk: [0.5, 1, 1] },
    3: { atk: [0.8, 1, 2], def: [0.4, 1, 1] },
    4: { atk: [0.9, 2, 2], def: [0.6, 1, 2], dun: [0.3, 1, 2] },
    5: { atk: [1, 2, 3], def: [0.8, 2, 2], dun: [0.6, 2, 2] },
    6: { atk: [1, 3, 3], def: [0.9, 2, 3], dun: [0.8, 2, 3] },
    7: { atk: [1, 4, 5], def: [1, 3, 4], dun: [1, 3, 4] },
    8: { atk: [1, 5, 6], def: [1, 4, 5], dun: [1, 4, 5] },
    9: { atk: [1, 5, 6], def: [1, 5, 6], dun: [1, 5, 6] },
    10: { atk: [1, 6, 7], def: [1, 6, 7], dun: [1, 6, 7] },
    11: { atk: [1, 7, 7], def: [1, 7, 7], dun: [1, 7, 7] },
  };
  // 每个大境界：[有道术的机会, 寻常道术最高 rank, 大派门人最高 rank, 进境下限, 进境上限]
  const NPC_ART = { 1: [0.3, 1, 1, 1, 2], 2: [0.6, 1, 2, 1, 3], 3: [0.7, 2, 2, 1, 3], 4: [0.8, 2, 3, 1, 3], 5: [0.9, 3, 3, 1, 4], 6: [1, 3, 4, 2, 4], 7: [1, 3, 5, 2, 4], 8: [1, 3, 5, 3, 4], 9: [1, 3, 5, 3, 4], 10: [1, 3, 5, 4, 4], 11: [1, 3, 5, 4, 4] };
  const libArts = (f) => {
    const d = f && f.key && C().factionDefs.find((x) => x.key === f.key);
    return d && d.library ? d.library.map((e) => e.tech).filter(Ars.isArt) : [];
  };
  const sectOnly = () => {
    const set = {};
    for (const d of C().factionDefs) if (d.tier >= 3 && d.library) for (const e of d.library) if (Ars.isArt(e.tech)) set[e.tech] = 1;
    return set;
  };
  Ars.npcKit = (s, p) => {
    const r = s.rng, m = p.realm.major;
    p.gear = p.gear || [];
    p.arts = p.arts || {};
    const f = p.factionId ? s.factions[p.factionId] : null;
    const big = !!(f && f.tier >= 3);
    const gt = NPC_GEAR[m];
    if (gt) for (const slot of SLOTS) {
      const row = gt[slot];
      if (!row || !R.chance(r, row[0])) continue;
      let grade = R.int(r, row[1], row[2]);
      if (big && (m === 5 || m === 6) && slot === 'atk' && R.chance(r, 0.5)) grade++;
      const cur = Ars.best(p, slot);
      if (cur && cur.grade >= grade) continue;
      p.gear = p.gear.filter((g) => g.slot !== slot);
      p.gear.push({ id: 'n' + slot, name: R.pick(r, GC().names[slot]), slot, grade, jin: 10 * (grade - 1) + R.int(r, 3, 10), cap: grade, ling: 100 });
    }
    const at = NPC_ART[m];
    if (!at || !R.chance(r, at[0])) return;
    const only = sectOnly(), lib = libArts(f);
    const top = big ? at[2] : at[1];
    const pool = Object.keys(C().techniques).filter((k) => {
      const t = TQ(k);
      if (t.kind !== 'shu' || t.minMajor > m || t.merge || t.need || (t.needQi && p.techniqueId !== t.needQi)) return false;
      if (only[k]) return big && lib.includes(k) && t.rank <= top;
      return t.rank <= Math.min(top, 3);
    });
    if (!pool.length) return;
    const bestRank = Math.max.apply(null, pool.map((k) => TQ(k).rank));
    const pickFrom = (list) => (list.length ? R.pick(r, list) : null);
    // 一门攻伐的（尽量取最高一乘），一半的人另有一门护身或遁法
    const atk = pickFrom(pool.filter((k) => TQ(k).type.includes('atk') && TQ(k).rank >= bestRank - 1));
    const other = R.chance(r, 0.5) ? pickFrom(pool.filter((k) => !TQ(k).type.includes('atk') && !TQ(k).type.includes('xiu'))) : null;
    for (const k of [atk, other]) {
      if (!k || p.arts[k] !== undefined) continue;
      const lv = R.int(r, at[3], at[4]);
      p.arts[k] = AC().xp[TQ(k).rank][lv - 1];
    }
  };

  FX.Ars = Ars;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/dayao.js ---------- */
/* ============================================================
 * dayao —— 金丹十三味大药
 * 照《仙业》：凝金丹要采齐十三味大药，六门外药向身外天地求（云华龙膏、天游泥、明合砂、玄室水、
 * 七明九光芝、老仙须），七门内药向身内天地索（神符火、三奇焰、五宫雷、玉鼎风、圣人土、正念锋、湛然虚精炁）。
 * 十三味一个不缺才可能丹成上三品；大派都有让弟子外出寻药的规矩，采药途中打磨道心，好凝出内药。
 *  · 外药：在荒山、险地、海外“外出寻药”，金谷墟市可托人代寻，宗门库藏可用道功换。结丹时耗掉。
 *  · 内药：在洞玄三重温养，年数够了自然凝成（资质越好越快）；神符火要肉身血气（护身道术练到小成快一倍）；
 *    五宫雷在摄取五精时用了先天五行之精便自显；湛然虚精炁是不传之秘，要先得修法。内药在身，结丹不耗。
 * NPC 不细算，按出身掷一个“采得几味”。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const P = () => FX.P;
  const H = () => FX.H;
  const Sim = () => FX.Sim;
  const T = () => FX.T;

  const Yao = {};
  const DC = () => C().dayao;
  const me = (s) => P().player(s);

  /* ---------- 采得几味 ---------- */
  Yao.waiHave = (s) => DC().wai.filter((k) => (s.player.inv[k] || 0) > 0);
  Yao.neiHave = (p) => (p.neiyao || []).slice();
  Yao.count = (s, p) => {
    if (P().isPlayer(s, p)) return Yao.waiHave(s).length + Yao.neiHave(p).length;
    return p.dayaoN || 0;
  };
  // NPC 结丹时采得几味：大派弟子多半齐全，散修多半凑不齐
  Yao.npcCount = (r, f) => { const rg = DC().npc[f ? Math.min(3, f.tier || 1) : 0]; return R.int(r, rg[0], rg[1]); };
  // 品第：每采齐几味高一档；不齐十三味，丹成不了上三品
  Yao.pinBonus = (n) => { for (const [k, v] of DC().pinBonus) if (n >= k) return v; return 0; };
  Yao.pinCap = (n) => (n >= DC().total ? 1 : DC().capWithout);
  // 冲金丹成功率的修正
  Yao.breakPart = (s, p) => { const n = Yao.count(s, p); return n ? { label: '十三味大药采得 ' + n + ' 味', value: Math.round(n * DC().breakPer) } : null; };

  // 结丹前的一条清单
  Yao.requirement = (s, p) => {
    const I = C().items, N = DC().nei;
    const wh = Yao.waiHave(s), nh = Yao.neiHave(p);
    const wMiss = DC().wai.filter((k) => !wh.includes(k)).map((k) => I[k].name);
    const nMiss = Object.keys(N).filter((k) => !nh.includes(k)).map((k) => N[k].name);
    const n = wh.length + nh.length;
    const note = '外药 ' + wh.length + '/6' + (wMiss.length ? '（缺' + wMiss.join('、') + '：荒山、险地、海外寻药，金谷墟市可托人代寻，宗门库藏可换）' : '') +
      '；内药 ' + nh.length + '/7' + (nMiss.length ? '（缺' + nMiss.join('、') + '：洞玄三重温养自然凝成' + (nh.includes('zhanran') || (s.player.inv.zhanranfa || 0) > 0 ? '' : '，湛然虚精炁要先得修法') + '）' : '') +
      '。十三味不齐丹成不了上三品；外药结丹时耗掉';
    return { label: '金丹十三味大药（可选：采得 ' + n + ' 味）', ok: n >= DC().total, optional: true, note };
  };

  /* ---------- 内药：在洞玄三重温养，年数够了自然凝成 ---------- */
  Yao.neiYears = (s, p, k) => {
    const d = DC().nei[k];
    let y = d.years * (DC().aptYears[0] - p.aptitude / 100);
    // 神符火：肉身血气鼎沸才凝得出——身上有一门护身道术练到小成，快一倍
    if (d.fast === 'def') { const b = FX.Ars.bestArt(p, 'def'); if (b && FX.Ars.level(p, b.k) >= 2) y /= 2; }
    if (d.need === 'wujing' && p.flags.includes('wujing')) y = 0;
    return Math.max(0, Math.round(y * 10) / 10);
  };
  Yao.neiReady = (s, p, k) => { const d = DC().nei[k]; return !(d.need === 'zhanranfa' && !((s.player.inv.zhanranfa || 0) > 0)); };
  // 每月调用：洞玄三重的日子累计起来，到了就凝成
  Yao.grow = (s, days) => {
    const p = me(s);
    if (!P().alive(p) || p.realm.major !== 5 || p.realm.stage !== 3) return;
    p.neiyao = p.neiyao || [];
    p.dxDays = (p.dxDays || 0) + days;
    const N = DC().nei;
    for (const k of Object.keys(N)) {
      if (p.neiyao.includes(k) || !Yao.neiReady(s, p, k)) continue;
      // 湛然虚精炁从得了修法那天算起
      const from = N[k].need === 'zhanranfa' ? (p.zhanranFrom === undefined ? (p.zhanranFrom = p.dxDays) : p.zhanranFrom) : 0;
      if (p.dxDays - from >= Yao.neiYears(s, p, k) * C().daysPerYear) {
        p.neiyao.push(k);
        H().add(s, { type: 'realm', tags: ['修炼', '大药'], actors: [p.id], key: 'neiyao', pov: true, severity: 2, params: { name: p.name, yao: N[k].name, desc: N[k].desc, n: Yao.count(s, p) } });
      }
    }
  };

  /* ---------- 外出寻药 ---------- */
  Yao.list = (s, add) => {
    const p = me(s), place = s.places[p.locationId], D = DC();
    if (p.realm.major !== D.seekMajor || !D.where[place.type]) return;
    const why = p.health.state === 'heavy' ? '重伤未愈' : '';
    add({ type: 'xunyao', days: D.seekDays, label: '在' + place.name + '寻凝丹外药 ' + T().dur(D.seekDays), group: '外出', ok: !why, reason: why });
  };
  Yao.DO = {
    xunyao(s, a) {
      const p = me(s), place = s.places[p.locationId], D = DC(), I = C().items;
      const r = Sim().passDays(s, a.days, 'other');
      if (!P().alive(p)) return { text: '' };
      if (r.interrupted || s.pending.length) return { text: '寻药途中出了事', interrupted: true };
      s.player.stats.explores++;
      const pool = D.where[place.type];
      let hurt = false;
      if (D.hurt[place.type] && R.chance(s.rng, D.hurt[place.type])) { P().injure(s, p, 'light'); hurt = true; }
      if (!R.chance(s.rng, D.seekChance[place.type])) {
        FX.Act.seek(s, false); s.player.stats.exploreNothing++;
        H().add(s, { type: 'explore', tags: ['大药'], actors: [p.id], places: [place.id], key: 'yao_none', pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(a.days), hurt: hurt ? '，还受了些轻伤' : '' } });
        return { text: '没寻到外药' + (hurt ? '，还受了轻伤' : '') };
      }
      // 先找手上还缺的
      const miss = pool.filter((k) => !((s.player.inv[k] || 0) > 0));
      const k = R.pick(s.rng, miss.length ? miss : pool);
      s.player.inv[k] = (s.player.inv[k] || 0) + 1;
      FX.Act.seek(s, true);
      H().add(s, { type: 'explore', tags: ['大药'], actors: [p.id], places: [place.id], key: 'yao_found', pov: true, severity: 2, params: { name: p.name, place: place.name, dur: T().dur(a.days), yao: I[k].name, hurt: hurt ? '，途中受了些轻伤' : '' } });
      return { text: '寻得' + I[k].name + (hurt ? '，受了轻伤' : '') };
    },
  };

  // 结丹时耗掉外药（不论成败）；内药在身不耗
  Yao.consume = (s) => { for (const k of Yao.waiHave(s)) s.player.inv[k]--; };

  FX.Yao = Yao;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/save.js ---------- */
/* ============================================================
 * save（核心部分）—— 序列化、校验、迁移、校验和
 * 真正读写 IndexedDB / localStorage 的适配器在 ui 一侧。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const U = FX.U;

  const SV = {};

  SV.hashState = (s) => U.hash(JSON.stringify(s));

  SV.meta = (s) => {
    const p = FX.P.player(s);
    const r = FX.Sim.rating(s);
    return {
      name: p.name,
      origin: s.origin,
      originName: FX.CONFIG.origins[s.origin].name,
      seed: s.seed,
      year: s.year,
      age: FX.P.age(s, p),
      realm: FX.P.realmName(p),
      ratingPreview: r.grade + ' ' + r.total,
      ended: !!s.ended,
    };
  };

  SV.serialize = (s, savedAt) => {
    const stateStr = JSON.stringify(s);
    const save = { schemaVersion: s.schemaVersion, gameVersion: s.gameVersion, meta: Object.assign(SV.meta(s), { savedAt: savedAt || null }), state: s, checksum: U.hash(stateStr) };
    return JSON.stringify(save);
  };

  // 迁移函数表：从 vN 升到 vN+1
  SV.migrations = {
    // v3 → v4：加入宗门道功、拜入记录、献书记录、墟市代寻
    3: (st) => { Object.assign(st.player, { merit: 0, joinTried: {}, submitted: [], orders: [] }); st.schemaVersion = 4; return st; },
    // v4 → v5：天下大事排期、洞府、门中职位、自动服药
    4: (st) => { Object.assign(st.player, { autoPill: true, dongfu: null, post: 0, tuijuDeclined: null }); FX.Saga.init(st); st.schemaVersion = 5; return st; },
    // v5 → v6：金丹以后（元神、返虚、金丹品第）、东弥州腹地与三家大派、天魔潮
    5: (st) => {
      st.player.dongtian = null;
      for (const p of Object.values(st.people)) {
        if (p.danPin === undefined) p.danPin = 0;
        if (p.daoId === undefined) p.daoId = null;
        // 已结丹的人补定金丹品第（不掷骰，机缘按中等算）；先补上先天金汞，品第才算得准
        if (p.realm.major >= 6 && !p.jinhong) p.jinhong = FX.CU.jinhongFor(p, 0);
        if (p.realm.major >= 6 && !p.danPin) p.danPin = FX.CU.danPinFor(p, 1, 13); // 那时还没有十三味大药，不设上限
        if (p.realm.major >= 6 && !p.daoId && st.player.id !== p.id) p.daoId = 'dao_low';
        if (p.realm.major === 6 && p.realm.stage > 1) p.realm.stage = 1;
      }
      FX.World.genOuter(st);
      FX.Saga.init(st);
      st.schemaVersion = 6;
      return st;
    },
    // v6 → v7：按原著校正——金丹分三重、先天金汞、元神法相；东弥州腹地方位重排；原著人物入世；丹元大会
    6: (st) => {
      const need6 = FX.CONFIG.realms.need[6];
      const total6 = need6.reduce((a, b) => a + b, 0);
      for (const p of Object.values(st.people)) {
        for (const k of ['jinhong', 'xiang']) if (p[k] === undefined) p[k] = 0;
        if (p.notable === undefined) p.notable = null;
        if (p.bio === undefined) p.bio = '';
        // 洞玄三重以上补定先天金汞、元神以上补定法相（不掷骰，机缘按中下算）
        if (!p.jinhong && (p.realm.major > 5 || (p.realm.major === 5 && p.realm.stage === 3))) p.jinhong = FX.CU.jinhongFor(p, 0);
        if (!p.xiang && p.realm.major >= 7) p.xiang = FX.CU.xiangFor(p, 1);
        // 金丹分了三重：原来的金丹修为（满数 50000）按比例摊到三重里
        if (p.realm.major === 6) {
          let left = Math.min(1, (p.progress || 0) / 50000) * total6, stg = 1;
          while (stg < 3 && left >= need6[stg - 1]) { left -= need6[stg - 1]; stg++; }
          p.realm.stage = stg;
          p.progress = Math.min(Math.round(left), need6[stg - 1]);
          FX.CU.updateLifespan(st, p);
        }
        // 境界序号顺延：金丹多了两重，元神以上的序号各加二
        if (p.peakRank >= 21) p.peakRank += 2;
      }
      FX.World.genOuter(st);
      FX.World.genNotables(st);
      for (const pl of Object.values(st.places)) if (pl.outer && pl.type === 'mart') FX.World.refreshMarket(st, pl.id);
      FX.Saga.init(st);
      st.schemaVersion = 7;
      return st;
    },
    // v7 → v8：法器（炼形、禁制、器灵）与道术、神通。旧的符器收进法器一栏，NPC 配上随身法器和道术
    7: (st) => {
      const CF = FX.CONFIG;
      st.player.gearSeq = st.player.gearSeq || 0;
      for (const p of Object.values(st.people)) {
        if (!p.gear) p.gear = [];
        if (!p.arts) p.arts = {};
        if (p.id === st.player.id || !FX.P.alive(p)) continue;
        const d = p.notable && CF.notables.find((x) => x.key === p.notable);
        if (d && d.gear) p.gear = d.gear.map((g, i) => Object.assign({ id: 'n' + i, cap: g.grade, ling: 100 }, g));
        else FX.Ars.npcKit(st, p);
        if (d && d.arts) for (const k in d.arts) p.arts[k] = CF.arts.xp[CF.techniques[k].rank][d.arts[k] - 1];
      }
      FX.Ars.sync(st);
      // 货架补上新货
      for (const pl of Object.values(st.places)) if (FX.World.hasMarket(st, pl.id)) FX.World.refreshMarket(st, pl.id);
      st.schemaVersion = 8;
      return st;
    },
    // v8 → v9：按原著细分后期境界。元神分十二重障关、返虚分三途（旧档一律按十二迷障）、合道分九难，九难之后是大冶。
    // 旧档里元神、返虚都只有一格（满数 200000、400000）：按比例摊进新的小境界，停在那一重的圆满处。
    8: (st) => {
      const CF = FX.CONFIG, R9 = CF.realms;
      // 旧的境界序号 → 新的：旧布局每个大境界的格数
      const oldMax = [1, 1, 9, 3, 3, 3, 3, 1, 1, 3, 1];
      const fromOldRank = (rk) => {
        let acc = 0;
        for (let m = 0; m < oldMax.length; m++) {
          if (rk < acc + oldMax[m] || m === oldMax.length - 1) return FX.P.rankOf(m, Math.min(R9.maxStage[m], rk - acc + 1));
          acc += oldMax[m];
        }
        return rk;
      };
      const spread = (p, major, oldFull) => {
        const ms = R9.maxStage[major];
        let total = 0;
        for (let st = 1; st <= ms; st++) total += FX.P.needAt(p, major, st);
        let left = Math.min(1, (p.progress || 0) / oldFull) * total, stg = 1;
        while (stg < ms && left >= FX.P.needAt(p, major, stg)) { left -= FX.P.needAt(p, major, stg); stg++; }
        p.realm.stage = stg;
        p.progress = Math.min(Math.round(left), FX.P.needAt(p, major, stg));
      };
      for (const p of Object.values(st.people)) {
        // 主角的最高境界记录按旧布局换算；NPC 只按眼下境界重记（迁移途中新生成的人物已是新布局）
        p.peakRank = p.id === st.player.id ? fromOldRank(p.peakRank || 0) : 0;
        if (p.realm.major === 7 && p.realm.stage === 1) spread(p, 7, 200000);
        else if (p.realm.major === 8 && p.realm.stage === 1) { p.fanxuPath = p.fanxuPath || 'shier'; spread(p, 8, 400000); }
        else if (p.realm.major === 10) p.progress = Math.min(p.progress || 0, FX.P.need(p));
        // 原著人物按新设定摆回位置（君尧元神第七重、颜熙返虚破九障）
        const d = p.notable && CF.notables.find((x) => x.key === p.notable);
        if (d && FX.P.alive(p) && p.realm.major === d.realm[0] && p.realm.stage < d.realm[1]) { p.realm.stage = d.realm[1]; p.progress = 0; }
        FX.CU.updateLifespan(st, p);
        const rk = FX.P.realmRank(p);
        if (rk > p.peakRank) p.peakRank = rk;
      }
      // 坊市补上大洞精玉
      for (const pl of Object.values(st.places)) if (FX.World.hasMarket(st, pl.id)) FX.World.refreshMarket(st, pl.id);
      st.schemaVersion = 9;
      return st;
    },
    // v9 → v10：金丹十三味大药。主角补上内药记录；已在洞玄三重的，圆满后坐过的日子算作温养；
    // 已过摄取五精的，当年必定用过先天五行之精（那一重要它），五宫雷可自显
    9: (st) => {
      const p = st.people[st.player.id];
      p.neiyao = p.neiyao || [];
      p.dxDays = p.realm.major === 5 && p.realm.stage === 3 ? p.fullDays || 0 : 0;
      if ((p.realm.major === 5 && p.realm.stage >= 2) || p.realm.major > 5) { if (!p.flags.includes('wujing')) p.flags.push('wujing'); }
      for (const pl of Object.values(st.places)) if (FX.World.hasMarket(st, pl.id)) FX.World.refreshMarket(st, pl.id);
      st.schemaVersion = 10;
      return st;
    },
    // v10 → v11：玉宸四院大比排期（二十五正法、九殿职名不改存档结构）
    10: (st) => {
      FX.Saga.init(st);
      st.schemaVersion = 11;
      return st;
    },
    // v11 → v12：真炁九阶三十六品。腹地大派门人按出身重抽一门真炁（都是七阶以上，道基不变）；
    // 坊市重新进货（散景敛形术不再上架，添了几门原著真炁）
    11: (st) => {
      for (const p of Object.values(st.people)) {
        if (p.id === st.player.id || p.notable || p.status !== 'alive' || !p.factionId) continue;
        const f = st.factions[p.factionId];
        if (f && f.tier >= 3 && f.type === 'sect') p.techniqueId = FX.World.npcTech(st.rng, f, p.role);
      }
      for (const pl of Object.values(st.places)) if (FX.World.hasMarket(st, pl.id)) FX.World.refreshMarket(st, pl.id);
      st.schemaVersion = 12;
      return st;
    },
  };

  const REQUIRED = {
    state: ['schemaVersion', 'seed', 'origin', 'rng', 't', 'year', 'places', 'factions', 'people', 'relations', 'markets', 'pending', 'eventQueue', 'history', 'records', 'player', 'aiLog', 'saga'],
    player: ['id', 'stone', 'inv', 'manuals', 'visited', 'stats', 'merit', 'joinTried', 'submitted', 'orders'],
  };

  // 依次：解析 → 版本 → 结构 → 校验和 → 引用完整性。任何一步失败都返回可读错误，不进入半加载状态。
  SV.deserialize = (text) => {
    let save;
    try { save = typeof text === 'string' ? JSON.parse(text) : text; } catch (e) { return { ok: false, error: '存档不是有效的 JSON：' + e.message }; }
    if (!save || typeof save !== 'object' || !save.state) return { ok: false, error: '存档结构缺失 state 字段' };
    const cur = FX.CONFIG.schemaVersion;
    let st = save.state;
    if (typeof save.schemaVersion !== 'number') return { ok: false, error: '缺少 schemaVersion' };
    if (save.schemaVersion === 1) return { ok: false, error: '这是旧版“经营家族”的存档，个人主角版无法读取' };
    if (save.schemaVersion === 2) return { ok: false, error: '这是换成《仙业》世界之前的存档（灵根、炼气那一套），世界和境界都变了，无法读取' };
    if (save.schemaVersion > cur) return { ok: false, error: `存档版本 ${save.schemaVersion} 比游戏版本 ${cur} 新，请更新游戏` };
    // 校验和针对原始 state 计算
    if (save.checksum && U.hash(JSON.stringify(st)) !== save.checksum) return { ok: false, error: '校验和不符，存档可能已损坏或被改动' };
    let v = save.schemaVersion;
    while (v < cur) {
      const m = SV.migrations[v];
      if (!m) return { ok: false, error: `无法从存档版本 ${v} 迁移到 ${cur}` };
      st = m(JSON.parse(JSON.stringify(st)));
      v++;
    }
    for (const k of REQUIRED.state) if (!(k in st)) return { ok: false, error: '存档缺少字段 state.' + k };
    for (const k of REQUIRED.player) if (!(k in st.player)) return { ok: false, error: '存档缺少字段 player.' + k };
    if (!Array.isArray(st.rng.s) || st.rng.s.length !== 4) return { ok: false, error: '随机数状态损坏' };
    if (typeof st.t !== 'number' || typeof st.year !== 'number') return { ok: false, error: '时间字段类型错误' };
    // 引用完整性
    try {
      FX.Sim.check(st);
    } catch (e) {
      return { ok: false, error: '引用完整性检查失败：' + e.message };
    }
    return { ok: true, state: st, meta: save.meta };
  };

  FX.Save = SV;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/api.js ---------- */
/* ============================================================
 * api —— 界面与测试脚本共用的公开函数。界面只通过这里操作核心。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const P = FX.P;
  const C = () => FX.CONFIG;

  const Game = {
    newGame: (opts) => FX.Sim.newGame(opts || {}),
    // 此刻规则允许的行动（界面按钮、测试策略、以后的 AI 意图解析都从这里挑）
    actions: (s) => FX.Act.list(s),
    act: (s, a) => FX.Act.run(s, a),
    buy: (s, item, qty) => FX.Act.run(s, { type: 'buy', item, qty }),
    sell: (s, item, qty) => FX.Act.run(s, { type: 'sell', item, qty }),
    // 玩家偏好（白名单内的开关，不影响规则校验）
    setOption: (s, key, val) => {
      const OPTS = { autoPill: 'bool' };
      if (!OPTS[key]) return { ok: false, error: '没有这个选项' };
      s.player[key] = !!val;
      return { ok: true };
    },
    pendingEvents: (s) => s.pending.map((i) => FX.Ev.view(s, i)),
    choose: (s, instId, optId) => {
      if (s.ended) return { ok: false, error: '这一生已经结束' };
      const r = FX.Ev.resolve(s, instId, optId);
      if (r.ok && r.days && FX.P.alive(FX.P.player(s))) FX.Sim.passDays(s, r.days, 'other');
      FX.Ars.sync(s);
      FX.Sim.checkEnd(s);
      return r;
    },

    /* ---------- 视图数据（只读）---------- */
    view: {
      overview(s) {
        const p = P.player(s);
        const place = s.places[p.locationId];
        const bt = FX.CU.gateKind(p) ? FX.CU.chance(s, p) : null;
        return {
          t: s.t, year: s.year, date: FX.T.fmt(s.t),
          me: p, age: P.age(s, p), realm: P.realmName(p), realmTitle: P.realmTitle(p), title: P.title(p), need: P.need(p), full: P.isFull(p),
          left: P.lifespanLeft(s, p), lifespan: P.lifespanTotal(p),
          speed: FX.CU.breakdown(s, p, { pill: s.player.qijuUntil > s.t }),
          power: P.powerBreakdown(s, p),
          tech: P.techOf(s, p), lianqi: P.lianqiOf(p), fit: FX.CU.attrFit(s, p, place),
          coinPerYear: FX.CU.coinPerYear(p),
          reqs: FX.CU.requirements(s, p),
          faction: p.factionId ? s.factions[p.factionId] : null,
          place, stone: s.player.stone, merit: s.player.merit, inv: s.player.inv, manuals: s.player.manuals,
          pillUntil: s.player.qijuUntil > s.t ? s.player.qijuUntil : null,
          breakthrough: bt ? Object.assign({ can: FX.CU.canAttempt(s, p) }, bt) : null,
          pending: s.pending.length, ended: s.ended, stats: s.player.stats,
        };
      },
      place(s, id) {
        const pl = s.places[id];
        if (!pl) return null;
        const me = P.player(s);
        return {
          place: pl,
          typeName: C().world.placeTypes[pl.type].name,
          fit: FX.CU.attrFit(s, me, pl),
          faction: pl.factionId ? s.factions[pl.factionId] : null,
          visited: s.player.visited.includes(id),
          here: me.locationId === id,
          route: FX.World.route(s, me.locationId, id, me),
          // 走不通时说明原因（南域通往中域的关口要金丹）
          blocked: !FX.World.route(s, me.locationId, id, me) && FX.World.route(s, me.locationId, id) ? C().world.outer.gate.why : '',
          people: P.at(s, id).filter((q) => q.id !== me.id).map((q) => ({ id: q.id, name: q.name, realm: P.realmName(q), faction: P.factionName(s, q), rel: P.relValue(s, me.id, q.id) })),
          market: FX.World.hasMarket(s, id) ? s.markets[id] : null,
        };
      },
      person(s, id) {
        const p = s.people[id];
        if (!p) return null;
        const me = P.player(s);
        const isMe = p.id === me.id;
        return {
          p, isMe,
          age: P.age(s, p),
          realm: P.realmName(p),
          realmTitle: P.realmTitle(p),
          need: P.need(p),
          left: P.lifespanLeft(s, p),
          power: P.power(s, p),
          faction: P.factionName(s, p),
          place: s.places[p.locationId].name,
          rel: isMe ? null : P.relationBetween(s, me.id, p.id),
          relations: isMe ? P.relationsOf(s, p.id).map((r) => ({ other: r.a === p.id ? r.b : r.a, name: P.name(s, r.a === p.id ? r.b : r.a), type: r.type, strength: r.strength, tags: r.tags })) : [],
          life: FX.H.lifeSummary(s, p),
          history: s.history.filter((e) => e.actors.includes(p.id) && (e.pov || isMe)).slice(-30).map((e) => ({ id: e.id, t: e.t, text: FX.H.text(e) })),
        };
      },
      // 宗门页：本门本族的传功、库藏、俸禄；没有门派时列出各宗门的拜入条件
      house(s) {
        const p = P.player(s), Sect = FX.Sect, cf = C();
        const f = Sect.mine(s);
        if (f) {
          return {
            member: true, faction: f, seat: s.places[f.seatId], atSeat: Sect.atSeat(s, f), merit: s.player.merit,
            stipend: Sect.stipend(s, f), taskMerit: Sect.taskMerit(p), missionMerit: Sect.missionMerit(p),
            library: Sect.library(f).map((e) => ({ tech: e.tech, t: cf.techniques[e.tech], merit: e.merit || 0, zf: e.zf || '', minMajor: e.minMajor || 0, note: e.note || '', owned: s.player.manuals.includes(e.tech), using: p.techniqueId === e.tech || p.kaifuId === e.tech,
              req: [e.minPin ? cf.realms.danPinNames[e.minPin] + '以上' : '', e.minXiang ? cf.realms.xiangNames[e.minXiang] + '以上' : '', e.minDaoji ? cf.daojiNames[e.minDaoji] + '以上' : '', e.needTech ? '先修过《' + cf.techniques[e.needTech].name + '》' : ''].filter(Boolean).join('、') })),
            store: Sect.store(f).map((e) => ({ item: e.item, it: cf.items[e.item], merit: e.merit, minMajor: e.minMajor || 0, have: s.player.inv[e.item] || 0 })),
            submit: cf.house.submit,
            post: Sect.post(s, f, p), postName: Sect.postName(s, f, p),
            leader: f.leaderId && s.people[f.leaderId] ? s.people[f.leaderId] : null,
          };
        }
        return {
          member: false,
          other: p.factionId ? s.factions[p.factionId] : null,
          sects: Object.values(s.factions).filter((g) => g.type === 'sect').map((g) => {
            const can = Sect.canJoin(s, g);
            return { f: g, seat: s.places[g.seatId], join: Sect.def(g).join || null, can, chance: Sect.joinChance(s, g), route: FX.World.route(s, p.locationId, g.seatId) };
          }),
        };
      },
      // 天下大事：已有风声或正在进行的
      sagas: (s) => FX.Saga.view(s),
      feed: (s, n) => FX.H.feed(s, n),
      rating: (s) => FX.Sim.rating(s),
      historyText: (e) => FX.H.text(e),
    },

    save: {
      serialize: (s, savedAt) => FX.Save.serialize(s, savedAt),
      deserialize: (t) => FX.Save.deserialize(t),
      hash: (s) => FX.Save.hashState(s),
    },
  };

  FX.Game = Game;
})(typeof globalThis !== 'undefined' ? globalThis : this);

</script>

<script>
/* ---------- ui/storage.js ---------- */
/* ============================================================
 * 存储适配器（ui 一侧）：IndexedDB 为主，失败降级 localStorage；
 * 导出：下载 .json 或复制压缩文本；导入：选择文件或粘贴文本。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const DB = 'family-xiuxian', STORE = 'saves', LS = 'family-xiuxian:';

  const Store = { kind: 'none', db: null, lsWarnBytes: 4 * 1024 * 1024 * 0.9 };

  Store.init = () => new Promise((resolve) => {
    const fallback = () => {
      try { localStorage.setItem(LS + '_probe', '1'); localStorage.removeItem(LS + '_probe'); Store.kind = 'ls'; } catch (e) { Store.kind = 'none'; }
      resolve(Store.kind);
    };
    try {
      if (!G.indexedDB) return fallback();
      const req = indexedDB.open(DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(STORE);
      req.onsuccess = () => { Store.db = req.result; Store.kind = 'idb'; resolve('idb'); };
      req.onerror = () => fallback();
      req.onblocked = () => fallback();
    } catch (e) { fallback(); }
  });

  const tx = (mode, fn) => new Promise((resolve, reject) => {
    const t = Store.db.transaction(STORE, mode);
    const os = t.objectStore(STORE);
    const r = fn(os);
    t.oncomplete = () => resolve(r && r.result);
    t.onerror = () => reject(t.error);
  });

  Store.put = async (key, text) => {
    if (Store.kind === 'idb') { await tx('readwrite', (os) => os.put(text, key)); return { ok: true }; }
    if (Store.kind === 'ls') {
      try { localStorage.setItem(LS + key, text); } catch (e) { return { ok: false, error: '浏览器存储已满，请导出存档' }; }
      return { ok: true, warn: text.length * 2 > Store.lsWarnBytes ? '存档接近 4MB，建议导出备份' : null };
    }
    return { ok: false, error: '浏览器不允许本地存储，请使用导出或复制文本保存' };
  };
  Store.get = async (key) => {

        ${bt.can.ok ? '' : `<p class="bad" style="margin:.3em 0">暂不能${bt.kind === 'taixi' ? '参悟' : '冲关'}：${esc(bt.can.reason)}</p>`}
        <div>${foldBtn('btParts', false, '成功率怎么算')}</div>${isOpen('btParts', false) ? `<p class="muted">${bt.parts.map((x) => esc(x.label) + ' ' + (x.value > 0 ? '+' : '') + x.value).join('；')}</p>` : ''}</div>`
      : ov.reqs.length ? `<div class="card"><h3>转入练炁</h3>${reqList(ov.reqs)}<p class="muted">练炁没有关隘：两样齐了，胎息便自然转入练炁一层。</p></div>` : '';
    // 做什么：一口气修到圆满放在最前；冲关按钮已在上面
    const until = A.find((a) => a.type === 'cultivate' && a.until);
    const groups = ['大事', '修炼', '外出', '营生', '宗门', '物品'].map((g) => {
      let list = grp(g).filter((a) => g !== '宗门' || a.ok || !/^要回到/.test(a.reason));
      if (bt) list = list.filter((a) => a.type !== 'breakthrough');
      if (g === '修炼') list = list.filter((a) => a !== until);
      if (g === '修炼' && until) list.unshift(until);
      return list.length ? `<div class="act-group"><span class="muted">${g}</span><div class="row">${list.map((a) => btn(a, a === until && a.ok ? 'primary' : '')).join('')}</div></div>` : '';
    }).join('');
    return `
      ${recentCard}
      <div class="card hl">
        <div class="row between"><h2 style="margin:0">${esc(me.name)}</h2><span class="muted">${me.sex === 'M' ? '男' : '女'} · ${ov.age} 岁 · ${esc(ov.faction ? ov.faction.name : '散修')}</span></div>
        <div class="big">${esc(ov.realmTitle)}${ov.title ? ' <span class="tag">' + esc(ov.title) + '</span>' : ''}</div>
        ${need ? `<div class="row between"><span class="muted">${progLabel(me.realm.major)}</span><span class="num">${n1(me.progress)} / ${need}${ov.full ? ' <span class="warn">已圆满</span>' : ''}</span></div>${bar(prog, ov.full ? 'good' : '')}` : ''}
        <div class="kv">
          <div><span class="muted">寿元</span> <b class="${ov.left < 15 ? 'bad' : ''}">余 ${n0(ov.left)} 年</b></div>
          <div><span class="muted">伤势</span> <b>${health}</b></div>
          <div><span class="muted">${trace('修炼', ov.speed.factors.map((f) => f.label + ' ×' + f.value).join('；'))}</span> <b>${ov.speed.total}/年</b></div>
          <div><span class="muted">${trace('战力', ov.power.factors.map((f) => f.label + ' ×' + f.value).join('；'))}</span> <b>${n1(ov.power.total)}</b></div>
          <div><span class="muted">符钱</span> <b>${n0(ov.stone)}</b></div>
          ${member ? `<div><span class="muted">${esc(CF.house.meritName)}</span> <b>${n0(ov.merit)}</b> <button class="link" data-act="page" data-p="sect">${ov.faction.type === 'clan' ? '族中' : '长老房'}</button></div>` : ''}
        </div>
        <div style="margin-top:.3em">${foldBtn('meMore', false, '根基、法门、采气')}</div>
        ${isOpen('meMore', false) ? `
          <div class="stat"><span>寿元上限</span><b>${n0(ov.lifespan)} 年</b></div>
          <div class="stat"><span>资质</span><b>${me.aptitude}${P.rootNames(me).length ? ' · ' + esc(P.rootNames(me).join(' · ')) : ''}</b></div>
          <div class="stat"><span>${me.realm.major >= 4 ? '法门' : '练炁术'}</span><b>${ov.tech.kind === 'none' ? '<span class="muted">尚无</span>' : '《' + esc(ov.tech.name) + '》'}</b></div>
          ${fit ? `<div class="stat"><span>${trace('采气', fit.label)}</span><b class="${fit.value >= 1 ? 'good' : fit.value < 0.5 ? 'bad' : ''}">${esc(fit.short)} ×${fit.value}</b></div>` : ''}
          ${member ? `<div class="stat"><span>职位</span><b>${esc(FX.Sect.postName(s, ov.faction, me))}</b></div>` : ''}
          ${ov.pillUntil || (me.realm.major >= 2 && s.player.inv.qiju) ? `<div class="stat"><span>${esc(CF.items.qiju.name)}</span><b>${ov.pillUntil ? '药力至 ' + T.fmt(ov.pillUntil) + ' · ' : ''}${autoPillBtn()}</b></div>` : ''}
          <div class="stat"><span>性格</span><span>${me.traits.map((t) => `<span class="tag" title="${esc(CF.traits.desc[t])}">${t}</span>`).join('')}</span></div>` : ''}
      </div>
      ${btCard}
      <div class="card"><h3>做什么</h3>${disabled ? '<p class="warn">眼前的事要先处理。</p>' : ''}
        ${groups}
        <p class="muted small" style="margin-bottom:0">闭关一年以上可能被打扰，被打扰就停下；游历多半一无所获，偶有遭遇。练炁以后可以把符钱炼进去修行，奢费但不挑地方。</p>
      </div>
      <div class="grid">
        <div class="card">
          <div class="row between"><h2 style="margin:0">${placeLink(place.id)}</h2><span class="tag">${esc((place.region || '南域') + ' · ' + pv.typeName)}</span></div>
          <div class="stat"><span>灵机</span><b>${stars(place.qi)} ${QI[place.qi]} · 属「${esc(place.attr)}」${FX.CU.qiFor(s, me) < place.qi ? ' <span class="bad">（你是外人，只能借到 ' + FX.CU.qiFor(s, me) + ' 级）</span>' : ''}</b></div>
          <div class="stat"><span>危险</span><b class="${place.danger >= 3 ? 'bad' : ''}">${stars(Math.min(5, place.danger))} ${DANGER[place.danger]}</b></div>
          ${s.player.dongfu ? `<div class="stat"><span>洞府</span><b>${s.player.dongfu === place.id ? '<span class="good">就在此地</span> <span class="muted">（灵机 +' + CF.dongfu.qiBonus + '，闭关少受打扰）</span>' : placeLink(s.player.dongfu) + ' <button class="link" data-act="goto" data-id="' + s.player.dongfu + '">回去</button>'}</b></div>` : ''}
          <div class="stat"><span>势力</span><b>${pv.faction ? esc(pv.faction.name) : '无人管辖'}</b></div>
          <div class="stat"><span>此地的人</span><b>${pv.people.length} 人 <button class="link" data-act="page" data-p="people">看看</button></b></div>
          ${pv.market ? `<div class="stat"><span>${place.type === 'city' ? '集市' : '货架'}</span><b><button class="link" data-act="page" data-p="bag" data-tab="market">去逛逛</button></b></div>` : ''}
          <h3 style="margin-top:.8em">道路 <span class="muted small">远路去地图页一键赶过去</span></h3><div class="col">${travel || '<span class="muted">无路可走</span>'}</div>
        </div>
        ${sagaCard(s)}
      </div>`;
  };

  /* ---------- 地图 ---------- */
  const MAP = { K: 110, pad: 60, scale: 0.45 };
  PAGE.map = () => {
    const s = UI.s, me = P.player(s);
    const cw = CF.world, K = MAP.K, pad = MAP.pad;
    const places = Object.values(s.places);
    const xs = places.map((p) => p.x), ys = places.map((p) => p.y);
    const x0 = Math.min(...xs), y0 = Math.min(...ys);
    const W = (Math.max(...xs) - x0) * K + pad * 2, H = (Math.max(...ys) - y0) * K + pad * 2;
    const X = (p) => pad + (p.x - x0) * K, Y = (p) => pad + (p.y - y0) * K;
    const canGo = me.realm.major >= cw.outer.gate.minMajor;
    const lines = [];
    for (const a of places) for (const l of a.links) if (a.id < l.to) {
      const b = s.places[l.to];
      lines.push(`<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" class="road${l.minMajor ? ' gate' : ''}"/><text x="${(X(a) + X(b)) / 2}" y="${(Y(a) + Y(b)) / 2 - 6}" class="days">${l.days}天</text>`);
    }
    // 地域名字（南域、中域……）写在各自地点的中间
    const regions = {};
    for (const p of places) { const k = p.region || '南域'; (regions[k] = regions[k] || []).push(p); }
    const labels = Object.keys(regions).map((k) => { const l = regions[k]; const cx = l.reduce((a, p) => a + X(p), 0) / l.length, cy = l.reduce((a, p) => a + Y(p), 0) / l.length; return `<text x="${cx}" y="${cy - 40}" class="region">${esc(k)}</text>`; }).join('');
    const nodes = places.map((p) => {
      const here = p.id === me.locationId, seen = s.player.visited.includes(p.id);
      const far = p.outer && !canGo && !seen;
      return `<g class="node t-${p.type} ${here ? 'here' : ''} ${seen ? 'seen' : ''} ${far ? 'far' : ''}" data-act="place" data-id="${p.id}" tabindex="0" role="button" aria-label="${esc(p.name)}">
        <circle cx="${X(p)}" cy="${Y(p)}" r="${here ? 18 : 13}"/>
        <text x="${X(p)}" y="${Y(p) + 38}" class="pname">${esc(p.name)}</text></g>`;
    }).join('');
    // 地点一览：按地域分组，写明从这里过去要几天，可一键赶过去
    const order = ['南域', '中域', '东域', '北域', '西域', '东海'];
    const regionKeys = Object.keys(regions).sort((a, b) => (order.indexOf(a) + 99) % 99 - (order.indexOf(b) + 99) % 99);
    const list = regionKeys.map((k) => {
      const rows = regions[k].slice().sort((a, b) => a.name.localeCompare(b.name, 'zh')).map((p) => {
        const v = Game.view.place(s, p.id);
        const go = v.here ? '<span class="tag t-good">你在这里</span>' : v.route ? `<button data-act="goto" data-id="${p.id}">赶过去 ${v.route.days} 天</button>` : `<span class="muted small">${esc(v.blocked || '走不通')}</span>`;
        return `<div class="stat"><span><button class="link" data-act="place" data-id="${p.id}">${esc(p.name)}</button> <span class="muted small">${esc(v.typeName)}${v.faction ? ' · ' + esc(v.faction.name) : ''} · 灵机${p.qi} · ${DANGER[p.danger]}${v.visited ? '' : ' · 没去过'}</span></span><span class="row">${go}</span></div>`;
      }).join('');
      const mine = regions[k].some((p) => p.id === me.locationId), fk = 'map-' + k;
      return `<div class="row between" style="margin-top:.5em"><h3 style="margin:0">${esc(k)} <span class="muted small">${regions[k].length} 处</span></h3>${foldBtn(fk, mine, '展开')}</div>${isOpen(fk, mine) ? rows : ''}`;
    }).join('');
    return `<h2>地图 <span class="muted">东弥州</span></h2>
      <div class="card map-wrap" id="map-wrap"><svg viewBox="0 0 ${W} ${H}" class="map" style="width:${Math.round(W * MAP.scale)}px" role="img" aria-label="世界地图">${labels}${lines.join('')}${nodes}</svg></div>
      <p class="muted small">可左右拖动；点地点看详情。${Object.keys(cw.placeTypes).map((k) => `<span class="legend t-${k}">●</span>${esc(cw.placeTypes[k].name)}`).join(' ')}；描金边的是去过的地方，大圈是你所在之处，虚线要${esc(CF.realms.names[cw.outer.gate.minMajor])}才过得去。</p>
      <div class="card"><h3 style="margin:0">地点一览 <span class="muted small">一段一段地走，路上出事就停下</span></h3>${list}</div>
      <p class="muted small">南域是东弥州有名的穷土。往北隔着万里荒原是中域；玉宸派本宗在东域宵明大泽，赤明派在北域鹿台山，魔道的怙照宗在西域极西，再往东是东海龙宫。${canGo ? '你已能驾遁光过去。' : '要到金丹，才驾得起遁光越过荒原。'}</p>`;
  };
  // 地图打开时把你所在之处滚到中间
  const centerMap = () => {
    const wrap = document.getElementById('map-wrap'), here = wrap && wrap.querySelector('.node.here circle');
    if (!wrap || !here) return;
    const svg = wrap.querySelector('svg'), vb = svg.viewBox.baseVal, k = svg.clientWidth / vb.width;
    wrap.scrollLeft = Math.max(0, Number(here.getAttribute('cx')) * k - wrap.clientWidth / 2);
    wrap.scrollTop = Math.max(0, Number(here.getAttribute('cy')) * k - wrap.clientHeight / 2);
  };

  /* ---------- 人物 ---------- */
  PAGE.people = () => {
    const s = UI.s, me = P.player(s);
    const A = Game.actions(s);
    const tab = UI.people.tab;
    let body;
    if (tab === 'here') {
      const pv = Game.view.place(s, me.locationId);
      body = pv.people.length ? `<table class="resp"><thead><tr><th>姓名</th><th>境界</th><th>势力</th><th>交情</th><th></th></tr></thead><tbody>${pv.people.map((q) => {
        const acts = A.filter((a) => a.npc === q.id);
        return `<tr><td data-l="姓名">${pl(q.id)}</td><td data-l="境界">${esc(q.realm)}</td><td data-l="势力">${esc(q.faction)}</td><td data-l="交情" class="${q.rel < 0 ? 'bad' : q.rel >= 40 ? 'good' : ''}">${q.rel || '素不相识'}</td>
          <td>${acts.map((a) => `<button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.reason)}">${a.type === 'befriend' ? '拜访' : '请教'}</button>`).join(' ')}</td></tr>`;
      }).join('')}</tbody></table>` : '<p class="muted">此地没有别人。</p>';
    } else {
      const rels = P.relationsOf(s, me.id).map((r) => ({ r, q: s.people[r.a === me.id ? r.b : r.a] })).sort((a, b) => (P.alive(b.q) - P.alive(a.q)) || b.r.strength - a.r.strength);
      body = rels.length ? `<table class="resp"><thead><tr><th>姓名</th><th>境界</th><th>势力</th><th>所在</th><th>交情</th></tr></thead><tbody>${rels.map(({ r, q }) => `<tr class="${P.alive(q) ? '' : 'dead'}"><td data-l="姓名">${pl(q.id)}</td><td data-l="境界">${P.alive(q) ? esc(P.realmName(q)) : '已故'}</td><td data-l="势力">${esc(P.factionName(s, q))}</td><td data-l="所在">${P.alive(q) ? placeLink(q.locationId) + (q.locationId !== me.locationId ? ' <button class="link" data-act="goto" data-id="' + q.locationId + '">去找</button>' : '') : '—'}</td><td data-l="交情" class="${r.strength < 0 ? 'bad' : r.strength >= 40 ? 'good' : ''}">${r.strength}${r.tags.length ? ' <span class="muted">' + esc(r.tags.join('/')) + '</span>' : ''}</td></tr>`).join('')}</tbody></table>` : '<p class="muted">你还不认识谁。去拜访或游历时会结识人。</p>';
    }
    return `<h2>人物</h2><div class="row tabs"><button class="${tab === 'here' ? 'on' : ''}" data-act="peopleTab" data-k="here">此地的人</button><button class="${tab === 'known' ? 'on' : ''}" data-act="peopleTab" data-k="known">我认识的人</button></div>
      <div class="card">${body}</div><p class="muted">交情到 ${CF.relations.consultMin} 以上，可以向修为比你高的人请教，每人每年一次，对方也可能婉拒。</p>`;
  };

  /* ---------- 行囊与坊市 ---------- */
  PAGE.bag = (ov) => {
    const s = UI.s;
    const A = Game.actions(s);
    const inv = Object.entries(ov.inv).filter(([, n]) => n > 0);
    const useBtn = (k) => { const a = A.find((x) => x.type === 'use' && x.item === k); return (a ? `<button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.reason)}">服用</button>` : '') ; };
    const buyBtns = (x) => {
      const can = Math.min(x.qty, Math.floor(ov.stone / x.price));
      if (x.item.startsWith('tech:')) return `<button data-act="buy" data-k="${esc(x.item)}" data-n="1" ${can >= 1 ? '' : 'disabled'}>买下</button>`;
      return `<button data-act="buy" data-k="${esc(x.item)}" data-n="1" ${can >= 1 ? '' : 'disabled'}>买 1</button>${x.qty >= 5 ? `<button data-act="buy" data-k="${esc(x.item)}" data-n="5" ${can >= 5 ? '' : 'disabled'}>买 5</button>` : ''}${can > 1 && can !== 5 ? `<button data-act="buy" data-k="${esc(x.item)}" data-n="${can}">${can === x.qty ? '全买' : '买得起的全买'}（${can}）</button>` : ''}`;
    };
    const m = s.markets[ov.place.id];
    const sellable = inv.filter(([k]) => CF.items[k]);
    const learn = A.filter((a) => a.type === 'learn');
    const orders = A.filter((a) => a.type === 'order');
    const coming = s.player.orders;
    const orderCard = orders.length || coming.length ? `<div class="card"><h3>托人代寻 <span class="muted small">今年没上架的稀罕货，加五成价托墟市去别处寻，到期一定送到</span></h3>
        ${coming.length ? `<p>在途：${coming.map((o) => esc(FX.World.itemName(o.item)) + '（约 ' + T.fmt(o.due) + ' 到）').join('、')}</p>` : ''}
        ${orders.map((a) => `<div class="stat"><span>${esc(FX.World.itemName(a.item))}</span><span class="row"><b>${a.cost} 符钱</b><button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.reason)}">托人代寻</button></span></div>`).join('')}
        ${orders.length ? '' : '<p class="muted">要托人代寻，得去金谷墟市（浮玉泊）。</p>'}</div>` : '';
    // 道术与神通
    const me = ov.me, artsK = ov.manuals.filter((t) => CF.techniques[t].kind === 'shu');
    const prac = A.filter((a) => a.type === 'practice');
    const artsCard = `<div class="card"><h3>道术与神通</h3><p class="muted small">得了玉简还要参习：入门、小成、中成、大成。攻伐、护身各算最好的一门；神通要金丹法力才使得出。</p>
      ${artsK.length ? artsK.map((k) => {
        const t = CF.techniques[k], lv = FX.Ars.level(me, k), xp = (me.arts || {})[k] || 0, th = CF.arts.xp[t.rank];
        const mine = prac.filter((a) => a.tech === k), why = (mine.find((a) => !a.ok) || {}).reason;
        const eff = lv ? artEff(me, k) : '';
        return `<div class="stat"><span>《${esc(t.name)}》 <span class="tag">${esc(CF.shuRankNames[t.rank])}</span> <b>${esc(FX.Ars.levelName(lv))}</b>${lv < 4 ? ` <span class="muted">${Math.floor(xp)}/${th[lv]}</span>` : ''}<br><span class="muted small">${esc(typeLine(t))}${eff ? ' · 眼下' + esc(eff) : ''}</span><br>${desc(t.desc)}</span>
          <span class="row">${lv < 4 ? mine.map((a) => `<button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.reason)}">参习 ${esc(T.dur(a.days))}</button>`).join('') : '<span class="tag t-good">大成</span>'}${why ? ' <span class="muted small">' + esc(why) + '</span>' : ''}</span></div>`;
      }).join('') : '<p class="muted">还没有道术。坊市里十几枚符钱就能买到下乘道术，宗门长老房也传；大派的神通要拿道功换。</p>'}</div>`;
    const books = ov.manuals.filter((t) => CF.techniques[t].kind !== 'shu');
    const bookCard = `<div class="card"><h3>法门</h3>${books.length ? books.map((t) => `<div class="stat"><span>《${esc(CF.techniques[t].name)}》 <span class="muted small">${esc(techLine(CF.techniques[t]))}</span><br>${desc(CF.techniques[t].desc)}</span><span>${t === ov.me.techniqueId || t === ov.me.kaifuId ? '<span class="tag t-good">正在修</span>' : (() => { const a = learn.find((x) => x.tech === t); return a ? `<button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.reason)}">${ov.me.techniqueId ? '改修' : '研习'}（1 个月）</button>` : ''; })()}</span></div>`).join('') : '<p class="muted">还没有任何法门。胎息之后要有一门练炁术才能往下修。</p>'}</div>`;
    // 法器
    const gear = me.gear || [];
    const ga = A.filter((a) => a.group === '法器');
    const gShort = (a) => a.type === 'jilian' ? '祭炼 ' + a.n + ' 道（' + n0(a.cost) + '）' : a.type === 'lianxing' ? '炼形（' + n0(a.cost) + '）' : a.type === 'lianhua' ? '炼化 ' + T.dur(a.days) : a.type === 'chongzhu' ? '熔' + CF.items[a.item].name + '重铸' : '卖 ' + n0(a.gain);
    const gearCard = `<div class="card"><h3>法器</h3><p class="muted small">攻伐、护身、遁行三类各用最好的一件。炼形一次至多十道禁制；上品符器再炼形就成了法器，要金丹法力和本命精血；道器只有纯阳以上掌控得了。</p>
      ${gear.length ? gear.map((g) => {
        const inUse = FX.Ars.best(me, g.slot) === g;
        const acts = ga.filter((a) => a.gid === g.id);
        const lx = acts.find((a) => a.type === 'lianxing' && !a.ok) || acts.find((a) => a.type === 'jilian' && !a.ok);
        const ling = g.ling === undefined ? 100 : Math.floor(g.ling);
        return `<div class="stat"><span><b>${esc(g.name)}</b> <span class="tag">${esc(CF.gear.slotNames[g.slot])}</span> ${esc(FX.Ars.gradeName(g))} · ${g.jin} 道禁制${inUse ? ' <span class="tag t-good">在用</span>' : ''}<br><span class="muted small">${esc(gearEff(me, g))} · 材质够炼形到${esc(CF.gear.gradeNames[g.cap])}${g.grade >= 4 && ling < 100 ? ' · 器灵炼化 ' + ling + '%' : ''}${lx ? ' · ' + esc(lx.reason) : ''}</span></span>
          <span class="row">${acts.map((a) => `<button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'} title="${esc(a.label + (a.reason ? '：' + a.reason : ''))}">${esc(gShort(a))}</button>`).join('')}</span></div>`;
      }).join('') : '<p class="muted">身上没有符器。坊市里有飞剑、法衣、飞梭，宗门库藏也能拿道功换。</p>'}</div>`;
    const itemCard = `<div class="card"><div class="stat"><span>符钱</span><b class="big">${n0(ov.stone)}</b></div>
        ${inv.length ? inv.map(([k, n]) => `<div class="stat"><span>${esc(CF.items[k].name)} ×${n}<br>${desc(CF.items[k].desc)}</span><span class="row">${useBtn(k)}${m ? `<button data-act="sell" data-k="${k}" data-n="1">卖 1</button>${n > 1 ? `<button data-act="sell" data-k="${k}" data-n="${n}">全卖（${n}）</button>` : ''} <span class="muted small">${FX.World.sellPrice(s, k)}/个</span>` : ''}</span></div>`).join('') : '<p class="muted">身无长物。</p>'}
        ${ov.me.realm.major >= 2 && s.player.inv.qiju ? `<p class="muted small" style="margin:.4em 0 0">闭关、修炼时${esc(CF.items.qiju.name)}药力一尽就从行囊里续服一颗 · ${autoPillBtn()}</p>` : ''}
      </div>`;
    const marketCard = m ? `<div class="card"><h3>${esc(ov.place.name)}${ov.place.type === 'city' ? '集市' : '货架'} <span class="muted small">${m.year} 年的货，每年换一次</span></h3>
        ${m.stock.map((x) => `<div class="stat"><span>${esc(FX.World.itemName(x.item))} <span class="muted small">存 ${x.qty}</span><br>${desc(x.item.startsWith('tech:') ? techLine(CF.techniques[x.item.slice(5)]) + ' · ' + CF.techniques[x.item.slice(5)].desc : CF.items[x.item].desc)}</span><span class="row"><b>${n0(x.price)}</b>${buyBtns(x)}</span></div>`).join('')}
        ${sellable.length ? '<p class="muted small">卖东西在“物品”一栏，按七成收。</p>' : '<p class="muted small">卖东西：行囊里的灵草、妖物材料等按七成收。</p>'}</div>` : `<div class="card"><p class="muted">此地买卖不了东西。凡人国有集市，仙道墟市和宗门山门有货架。</p></div>`;

  /* ---------- 宗门 ---------- */
  PAGE.sect = (ov) => {

    const parts = (ps) => ps.map((x) => x.label + ' ' + (x.value > 0 ? '+' : '') + x.value).join('；');
    if (!v.member) {
      const cond = (j) => (!j ? '不收外人' : j.closed ? j.closed : `至少${CF.realms.names[j.minMajor]}${j.maxAge ? '，年不过 ' + j.maxAge : ''}；每年可求一回`);

        ${v.sects.map((x) => { const a = A.find((y) => y.type === 'join' && y.fid === x.f.id); return `<div class="card"><div class="row between"><h3 style="margin:0">${esc(x.f.name)}</h3><span class="muted">${placeLink(x.seat.id)}${x.route && x.route.days ? ' · 约 ' + x.route.days + ' 天路程 <button class="link" data-act="goto" data-id="' + x.seat.id + '">赶过去</button>' : x.route ? ' · 就在此地' : ''}</span></div>

          <div class="row">${a ? btn(a) : x.can === true ? '' : '<span class="muted">' + esc(x.can) + '</span>'}</div></div>`; }).join('')}`;

    const f = v.faction, clan = f.type === 'clan', major = ov.me.realm.major;

      const zfa = A.find((x) => x.type === 'sect_learn' && x.tech === e.tech && x.zf);
      const learn = A.find((x) => x.type === 'learn' && x.tech === e.tech);
      const cost = a ? a.cost : e.merit;
      const right = e.using ? '<span class="tag t-good">正在修</span>' : e.owned ? (learn ? btn(learn, (ov.me.techniqueId ? '改修' : '研习') + '（1 个月）') : '<span class="muted">已得</span>') : btn(a, cost ? `${n0(cost)} ${M}` : '请授', true) + (zfa ? btn(zfa, '凭符诏取', true) : '');
      const why = !e.owned && a && !a.ok && a.reason ? ' · <span class="bad">' + esc(a.reason) + '</span>' : '';
      return `<div class="stat"><span>《${esc(e.t.name)}》${e.zf ? ' <span class="tag">二十五正法·' + esc(e.zf) + '</span>' : ''}<br><span class="muted small">${esc(techLine(e.t))}${e.note ? ' · ' + esc(e.note) : ''}${e.minMajor ? ' · ' + CF.realms.names[e.minMajor] + '以后才传' : ''}${e.req ? ' · 要' + esc(e.req) : ''}${why}</span><br>${desc(e.t.desc)}</span><span class="row">${right}</span></div>`;

      ${libLater.length ? `<div>${foldBtn('libLater', false, '境界到了才传的', libLater.length)}</div>${isOpen('libLater', false) ? libLater.map(libRow).join('') : ''}` : ''}

    const storeRow = (e) => {
      const a = A.find((x) => x.type === 'redeem' && x.item === e.item);

      const many = a && a.ok && cost * 5 <= v.merit && ['qiju', 'heal'].includes(e.item) ? `<button data-act="doN" data-i="${A.indexOf(a)}" data-n="5">换 5 份（${n0(cost * 5)}）</button>` : '';
      return `<div class="stat"><span>${esc(e.it.name)}${e.have ? ' <span class="muted small">已有 ' + e.have + '</span>' : ''}${e.minMajor ? ' <span class="muted small">' + CF.realms.names[e.minMajor] + '以后</span>' : ''}<br>${desc(e.it.desc)}</span><span class="row">${btn(a, n0(cost) + ' ' + M, true)}${cost < e.merit ? ' <s class="muted small">' + n0(e.merit) + '</s>' : ''}${many}</span></div>`;
    };
    // 用不上的折起来：境界还没到的；低两个大境界的关隘外药；不如身上那件的法器
    const past = (e) => {
      const it = CF.items[e.item];
      if (it.gear) { const b = FX.Ars.best(ov.me, it.gear.slot); return !!b && b.grade >= it.gear.grade; }
      return !['qiju', 'heal', 'yanshou'].includes(e.item) && (e.minMajor || 0) + 2 <= major;
    };
    const stLater = v.store.filter((e) => e.minMajor > major), stPast = v.store.filter((e) => !(e.minMajor > major) && past(e));
    const stNow = v.store.filter((e) => !stLater.includes(e) && !stPast.includes(e));
    const storeHtml = `${stNow.map(storeRow).join('') || '<p class="muted">眼下没有用得上的。</p>'}${stLater.length ? `<div>${foldBtn('stLater', false, '境界到了才换的', stLater.length)}</div>${isOpen('stLater', false) ? stLater.map(storeRow).join('') : ''}` : ''}${stPast.length ? `<div>${foldBtn('stPast', false, '你如今用不上的', stPast.length)}</div>${isOpen('stPast', false) ? stPast.map(storeRow).join('') : ''}` : ''}`;
    const subs = A.filter((x) => x.type === 'submit');
    const work = A.find((x) => x.type === 'work');
    const mission = A.find((x) => x.type === 'mission');
    const canLib = libNow.filter((e) => { const a = A.find((x) => x.type === 'sect_learn' && x.tech === e.tech); return a && a.ok; }).length;
    const canStore = stNow.filter((e) => { const a = A.find((x) => x.type === 'redeem' && x.item === e.item); return a && a.ok; }).length;

    const lv = A.find((x) => x.type === 'leave');
    const up = !clan && f.key === 'xuanzhen' ? `<p class="muted">玄真派是玉宸派下辖的道脉。到了金丹，可去东域宵明大泽的玉宸派本宗持道脉符书改投，${esc(M)}照记，不看运气。宵明大泽是灵窟，日后冲击元神正用得上。</p>` : '';
    const dn = A.find((x) => x.type === 'donate');
    const ten = dn && dn.ok && dn.cost * 10 <= ov.stone ? `<button data-act="doN" data-i="${A.indexOf(dn)}" data-n="10">捐 10 份（${n0(dn.cost * 10)} 符钱）</button>` : '';
    const hundred = dn && dn.ok && dn.cost * 100 <= ov.stone ? `<button data-act="doN" data-i="${A.indexOf(dn)}" data-n="100">捐 100 份（${n0(dn.cost * 100)} 符钱）</button>` : '';
    // 玉宸九殿：元神以后入殿任职，各殿职权不同
    const halls = A.filter((x) => x.type === 'hall');
    const HD = CF.house.halls, myHall = ov.me.hall;
    const hallCard = f.key === 'yuchen' && (halls.length || myHall) ? `<div class="card ${myHall ? '' : 'hl'}"><h3>玉宸九殿</h3>
        ${myHall ? `<p>你在<b>${esc(HD.defs[myHall].name)}</b>任${esc(HD.rankNames[FX.Sect.hallRank(ov.me)])}：${esc(HD.defs[myHall].duty)}。<br><span class="good">职权：${esc(HD.defs[myHall].perk)}</span></p>` : '<p class="warn">你已成元神，可以入九殿任职了。各殿职权不同，挑一处；转殿要隔 ' + HD.every + ' 年。元神为长老，返虚为副殿主，纯阳以上为殿主，职权跟着加重。</p>'}
        ${myHall ? `<div>${foldBtn('halls', false, '其余八殿')}</div>` : ''}
        ${!myHall || isOpen('halls', false) ? halls.map((a) => { const d = HD.defs[a.hall]; return `<div class="stat"><span><b>${esc(d.name)}</b> <span class="muted small">${esc(d.duty)}</span><br><span class="small">${esc(d.perk)}</span>${a.ok ? '' : '<br><span class="bad small">' + esc(a.reason) + '</span>'}</span><span class="row"><button data-act="do" data-i="${A.indexOf(a)}" ${a.ok ? '' : 'disabled'}>${myHall ? '转入' : '入此殿'}</button></span></div>`; }).join('') : ''}
      </div>` : '';
    const tab = UI.sectTab || 'main';
    const body = tab === 'lib' ? `<div class="card">${libHtml}</div>`
      : tab === 'store' ? `<div class="card"><p class="muted small" style="margin-top:0">常备，随时可换。手头 ${n0(v.merit)} ${esc(M)}。</p>${storeHtml}</div>`
      : tab === 'give' ? `<div class="card"><h3>${clan ? '上交族中' : '功德房 · 上交'}</h3>
          ${subs.length ? `<div class="col">${subs.map((a) => `<div>${btn(a)}</div>`).join('')}</div>` : `<p class="muted">行囊里没有可上交的东西。${Object.entries(v.submit).map(([k, n]) => esc(CF.items[k].name) + '每件记 ' + n).join('、')}；本门没有的道书抄本按价值记，每部只记一次。</p>`}
          ${dn ? `<h3>功德殿 · 捐输</h3><p class="muted">八派六宗的门人可以拿符钱折${esc(M)}，每 ${n0(dn.cost)} 符钱记 ${dn.gain} ${esc(M)}。</p><div class="row">${btn(dn)}${ten}${hundred}</div>` : ''}</div>`
      : `<div class="card hl">
          <div class="stat"><span>${esc(M)}</span><b class="big">${n0(v.merit)}</b></div>
          <div class="stat"><span>职位</span><b>${esc(v.postName)}${v.leader && v.post < 3 ? ' <span class="muted">· ' + (clan ? '家主' : '掌门') + '是' + esc(v.leader.name) + '（' + esc(P.realmName(v.leader)) + '）</span>' : ''}</b></div>
          <div class="stat"><span>每年俸禄</span><b>符钱 ${n0(v.stipend.stone)}${v.stipend.qiju ? '、' + esc(CF.items.qiju.name) + '×' + v.stipend.qiju : ''}</b></div>
          <div class="stat"><span>${clan ? '族中' : '山门'}</span><b>${placeLink(v.seat.id)}${v.atSeat ? ' <span class="good">（你在这里）</span>' : ` <button class="link" data-act="goto" data-id="${v.seat.id}">赶回去</button>`}</b></div>
          ${v.atSeat ? '' : '<p class="muted small" style="margin:.3em 0 0">请授、兑换、上交、领差事都要回山门办。</p>'}
          <p class="muted small" style="margin-bottom:0">${clan ? '族里' : '奉事房'}的差事每月记 ${v.taskMerit} ${esc(M)}，另给符钱；${clan ? '替家族除妖' : '领符诏除妖'}打赢了记 ${v.missionMerit} ${esc(M)}，逃了就算没办成。</p>

        </div>
        ${hallCard}
        <div class="card"><h3>去留</h3>${up}${tr ? `<div class="row">${btn(tr)}</div>` : ''}
          ${lv ? `<div class="row"><button class="danger" data-act="doAsk" data-i="${A.indexOf(lv)}">${esc(lv.label)}</button></div>` : ''}
          <p class="muted small" style="margin-bottom:0">辞出以后就是散修，可以去求入别的宗门；八派六宗要金丹才收。</p></div>`;
    return `<h2>${clan ? '家族' : '宗门'} <span class="muted">${esc(f.name)}</span></h2>
      ${subTabs('sectTab', [['main', '概况'], ['lib', (clan ? '家传' : '传功') + (canLib ? ' · ' + canLib + ' 可换' : '')], ['store', '库藏' + (canStore ? ' · ' + canStore + ' 可换' : '')], ['give', '上交' + (dn ? '·捐输' : '') + (subs.length ? ' · ' + subs.length : '')]])}

  };

  /* ---------- 纪事 ---------- */

  /* ---------- 存档与设置 ---------- */
  PAGE.sys = () => `<h2>存档与设置</h2>
    <div class="card"><div class="row"><button data-act="openSaves">存档管理 / 导入导出</button><button data-act="life">看生平</button><button class="danger" data-act="askNew">另开一生</button></div>
