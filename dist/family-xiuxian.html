<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>家族修仙录</title>
<style>
/* ============ 古风修仙家族档案 · 固定深色主题 ============ */
:root {
  --bg: #17130f;
  --panel: #211a14;
  --panel-2: #2a2119;
  --line: #8a6d3f;
  --line-soft: #4a3b26;
  --accent: #e0a94f;
  --danger: #b5412f;
  --good: #5b9a85;
  --text: #e8dcc6;
  --muted: #a99d86;
  --title-font: "KaiTi", "STKaiti", "楷体", "SimSun", "宋体", "Noto Serif SC", "Source Han Serif SC", serif;
  --body-font: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", system-ui, sans-serif;
  --fs: 15px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--body-font); font-size: var(--fs); line-height: 1.6; }
body { min-height: 100vh; overflow-x: hidden; }
h1, h2, h3, h4 { font-family: var(--title-font); font-weight: 600; color: var(--accent); margin: 0 0 .5em; letter-spacing: .05em; }
h1 { font-size: 1.8em; } h2 { font-size: 1.35em; } h3 { font-size: 1.12em; }
a { color: var(--accent); }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--danger); } .warn { color: var(--accent); }
button, select, input, textarea { font: inherit; color: var(--text); }
button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: .45em .9em; cursor: pointer; min-height: 36px; }
button:hover:not(:disabled) { background: #3a2c1e; }
button.primary { background: #6b4a1f; border-color: var(--accent); color: #fff3dc; font-weight: 600; }
button.danger { border-color: var(--danger); color: #f0b2a6; }
button:disabled { opacity: .45; cursor: not-allowed; }
button.link { background: none; border: none; color: var(--accent); padding: 0 .1em; min-height: 0; text-decoration: underline dotted; }
select, input[type=text], input[type=number], textarea { background: #120f0b; border: 1px solid var(--line-soft); border-radius: 4px; padding: .35em .5em; min-height: 36px; }
textarea { width: 100%; min-height: 8em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* 布局 */
.app { display: grid; grid-template-columns: 200px 1fr 300px; min-height: 100vh; }
.app.no-aside { grid-template-columns: 200px 1fr; }
nav.side { background: var(--panel); border-right: 1px solid var(--line-soft); padding: 1em .6em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
nav.side .brand { font-family: var(--title-font); font-size: 1.4em; color: var(--accent); text-align: center; margin-bottom: .2em; }
nav.side .sub { text-align: center; color: var(--muted); font-size: .85em; margin-bottom: 1em; }
nav.side button { display: block; width: 100%; text-align: left; margin-bottom: .3em; background: transparent; border-color: transparent; }
nav.side button.on { border-color: var(--line); background: var(--panel-2); color: var(--accent); }
.badge { display: inline-block; min-width: 1.5em; padding: 0 .4em; border-radius: 1em; background: var(--danger); color: #fff; font-size: .8em; text-align: center; margin-left: .3em; }
main { padding: 1.2em 1.5em 5em; min-width: 0; }
aside.right { background: var(--panel); border-left: 1px solid var(--line-soft); padding: 1em; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
.card { background: var(--panel); border: 1px solid var(--line-soft); border-radius: 6px; padding: 1em; margin-bottom: 1em; }
.card.hl { border-color: var(--accent); }
.grid { display: grid; gap: 1em; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.row { display: flex; gap: .6em; flex-wrap: wrap; align-items: center; }
.between { justify-content: space-between; }
.stat { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line-soft); padding: .2em 0; gap: .5em; }
.stat:last-child { border-bottom: none; }
.stat b { font-weight: 600; }
.big { font-size: 1.6em; font-family: var(--title-font); color: var(--accent); }
.bar { height: 8px; background: #120f0b; border-radius: 4px; overflow: hidden; border: 1px solid var(--line-soft); }
.bar > i { display: block; height: 100%; background: var(--accent); }
.bar.good > i { background: var(--good); } .bar.bad > i { background: var(--danger); }
.tag { display: inline-block; border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 .4em; margin: 0 .2em .2em 0; font-size: .88em; color: var(--muted); }
.tag.t-warn { border-color: var(--accent); color: var(--accent); }
.tag.t-bad { border-color: var(--danger); color: #f0b2a6; }
.tag.t-good { border-color: var(--good); color: #9fd2c0; }
.unfinished { border: 1px dashed var(--muted); color: var(--muted); padding: .5em .8em; border-radius: 4px; font-size: .92em; }
.unfinished::before { content: "未完成 · "; color: var(--accent); }
table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .4em .5em; border-bottom: 1px solid var(--line-soft); vertical-align: top; }
th { color: var(--muted); font-weight: normal; cursor: pointer; white-space: nowrap; }
tr.attn td { background: rgba(224, 169, 79, .08); }
tr.dead td { color: var(--muted); }
.clickable { cursor: pointer; }
.trace { cursor: help; text-decoration: underline dotted var(--muted); }
.log p { margin: .2em 0 .5em; }
.log .y { color: var(--muted); font-size: .85em; margin-right: .4em; }

/* 模态 */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 1em; animation: fade .15s; }
.modal { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; max-width: 720px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 1.2em 1.4em; box-shadow: 0 10px 40px rgba(0,0,0,.6); }
.modal h2 { margin-top: 0; }
.opt { border: 1px solid var(--line-soft); border-radius: 6px; padding: .7em .9em; margin: .6em 0; background: var(--panel-2); }
.opt.disabled { opacity: .55; }
.opt .meta { font-size: .92em; color: var(--muted); }
.opt .meta b { color: var(--text); font-weight: normal; }
#toasts { position: fixed; bottom: 1em; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: .4em; align-items: center; pointer-events: none; width: max-content; max-width: 92vw; }
.toast { background: var(--panel-2); border: 1px solid var(--accent); padding: .6em 1.2em; border-radius: 6px; animation: fade .2s; box-shadow: 0 4px 16px rgba(0,0,0,.5); }
@media (max-width: 720px) { #toasts { bottom: 64px; } }
.flash { animation: flash 1.2s; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes flash { 0% { background: rgba(224,169,79,.35); } 100% { background: transparent; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* 开局 */
.start { max-width: 900px; margin: 0 auto; padding: 2em 1em; }
.origin { cursor: pointer; }
.origin.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }

nav.bottom { display: none; }
@media (max-width: 1100px) {
  .app { grid-template-columns: 180px 1fr; }
  aside.right { display: none; }
}
@media (max-width: 720px) {
  .app, .app.no-aside { display: block; }
  nav.side { display: none; }
  main { padding: .8em 16px 6em; }
  nav.bottom { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; bottom: 0; left: 0; right: 0; background: var(--panel); border-top: 1px solid var(--line); z-index: 40; }
  nav.bottom button { border: none; border-radius: 0; background: transparent; min-height: 52px; padding: .2em; font-size: .85em; }
  nav.bottom button.on { color: var(--accent); background: var(--panel-2); }
  .more-menu { position: fixed; bottom: 56px; right: 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; z-index: 45; padding: .4em; }
  .more-menu button { display: block; width: 100%; text-align: left; margin: .2em 0; min-height: 44px; }
  table.resp thead { display: none; }
  table.resp tr { display: block; border: 1px solid var(--line-soft); border-radius: 6px; margin-bottom: .6em; padding: .4em; }
  table.resp td { display: flex; justify-content: space-between; border: none; padding: .2em .3em; }
  table.resp td::before { content: attr(data-l); color: var(--muted); margin-right: 1em; }
  button { min-height: 44px; }
  .modal { padding: 1em; }
}

/* 个人主角 */
.col { display: flex; flex-direction: column; gap: .4em; }
.col button { text-align: left; }
.act-group { margin-bottom: .7em; }
.act-group > .muted { display: block; font-size: .88em; margin-bottom: .25em; }
.tabs { margin-bottom: .8em; }
.tabs button.on { border-color: var(--accent); color: var(--accent); background: var(--panel-2); }
.log p.rumor, .rumor { color: var(--muted); }
.map-wrap { overflow-x: auto; padding: .5em; }
svg.map { width: 100%; min-width: 560px; height: auto; display: block; }
svg.map .road { stroke: var(--line-soft); stroke-width: 2; }
svg.map .days { fill: var(--muted); font-size: 10px; text-anchor: middle; }
svg.map .node { cursor: pointer; }
svg.map .node circle { stroke: var(--bg); stroke-width: 2; }
svg.map .node.seen circle { stroke: var(--accent); }
svg.map .node.here circle { stroke: #fff3dc; stroke-width: 3; }
svg.map .node:focus-visible circle { stroke: #fff; stroke-width: 4; }
svg.map .pname { fill: var(--text); font-size: 12px; text-anchor: middle; }
.t-town circle, .legend.t-town { fill: #c9a25a; color: #c9a25a; }
.t-sect circle, .legend.t-sect { fill: #7a8fb5; color: #7a8fb5; }
.t-clan circle, .legend.t-clan { fill: #5b9a85; color: #5b9a85; }
.t-wild circle, .legend.t-wild { fill: #8a7a5a; color: #8a7a5a; }
.t-danger circle, .legend.t-danger { fill: #b5412f; color: #b5412f; }
.reqs { margin: .4em 0; display: grid; gap: .15em; }
.mtop { display: none; }
@media (max-width: 720px) { .mtop { display: block; color: var(--muted); font-size: .9em; margin-bottom: .6em; } }
label { display: inline-flex; gap: .4em; align-items: center; }

</style>
</head>
<body>
<div id="app"><p style="padding:2em">载入中……若长时间无反应，请确认浏览器已启用 JavaScript。</p></div>

/* ---------- core/rng.js ---------- */
/* ============================================================
 * rng —— 可序列化种子随机数（sfc32）。核心内所有随机都经由这里，
 * 状态保存在 state.rng.s 中，随存档保存。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});

  function xmur3(str) {
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    return function () {
      h = Math.imul(h ^ (h >>> 16), 2246822507);
      h = Math.imul(h ^ (h >>> 13), 3266489909);
      return (h ^= h >>> 16) >>> 0;
    };
  }

  function seedState(seed) {
    const f = xmur3(String(seed));
    const s = [f(), f(), f(), f()];
    const r = { algo: 'sfc32', s };
    for (let i = 0; i < 15; i++) nextU32(r);
    return r;
  }

  function nextU32(r) {
    const s = r.s;
    let a = s[0] >>> 0, b = s[1] >>> 0, c = s[2] >>> 0, d = s[3] >>> 0;
    const t = (((a + b) >>> 0) + d) >>> 0;
    d = (d + 1) >>> 0;
    a = b ^ (b >>> 9);
    b = (c + (c << 3)) >>> 0;
    c = (c << 21) | (c >>> 11);
    c = (c + t) >>> 0;
    s[0] = a >>> 0; s[1] = b >>> 0; s[2] = c >>> 0; s[3] = d >>> 0;
    return t;
  }

  // 以下函数都接收 rng 状态对象（state.rng）
  const R = {
    seedState,
    next(r) { return nextU32(r) / 4294967296; },
    chance(r, p) { return R.next(r) < p; },
    int(r, min, max) { return min + Math.floor(R.next(r) * (max - min + 1)); },
    range(r, min, max) { return min + R.next(r) * (max - min); },
    pick(r, arr) { return arr[Math.floor(R.next(r) * arr.length)]; },
    normal(r, mean, sd) {
      // Box–Muller，固定消耗两次随机数
      const u = Math.max(R.next(r), 1e-12);
      const v = R.next(r);
      return mean + sd * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
    },
    weighted(r, items, wf) {
      let total = 0;
      for (const it of items) total += Math.max(0, wf(it));
      if (total <= 0) return null;
      let x = R.next(r) * total;
      for (const it of items) {
        x -= Math.max(0, wf(it));
        if (x < 0) return it;
      }
      return items[items.length - 1];
    },
    shuffle(r, arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(R.next(r) * (i + 1));
        const t = a[i]; a[i] = a[j]; a[j] = t;
      }
      return a;
    },
  };

  FX.RNG = R;

  /* ---------- 通用工具（纯函数）---------- */
  FX.U = {
    clamp(x, a, b) { return x < a ? a : x > b ? b : x; },
    round1(x) { return Math.round(x * 10) / 10; },
    sum(arr, f) { let s = 0; for (const x of arr) s += f ? f(x) : x; return s; },
    // FNV-1a 32 位哈希，用于存档校验和与状态哈希
    hash(str) {
      let h = 0x811c9dc5;
      for (let i = 0; i < str.length; i++) {
        h ^= str.charCodeAt(i);
        h = Math.imul(h, 0x01000193);
      }
      return (h >>> 0).toString(16).padStart(8, '0');
    },
    fill(tpl, params) {
      return tpl.replace(/\{(\w+)\}/g, (m, k) => (params[k] !== undefined ? params[k] : m));
    },
  };
})(typeof globalThis !== 'undefined' ? globalThis : this);

(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;

  const P = {};

  /* ---------- 基础查询 ---------- */
  P.age = (s, p) => s.year - p.birthYear;
  P.alive = (p) => !!p && p.status === 'alive';
  P.hasRoot = (p) => p.root && p.root.type !== 'none';
  P.living = (s) => Object.values(s.people).filter(P.alive);
  P.at = (s, placeId) => P.living(s).filter((p) => p.locationId === placeId);
  P.name = (s, id) => (s.people[id] ? s.people[id].name : '（无名）');
  P.isPlayer = (s, p) => !!p && s.player && s.player.id === p.id;
  P.player = (s) => s.people[s.player.id];

  P.lifespanMaxFor = (major, stage) => {
    const arr = C().realms.lifespan[major];
    return arr[Math.min(arr.length - 1, Math.max(0, stage - 1))];
  };
  P.lifespanTotal = (p) => p.lifespanMax + (p.lifespanBonus || 0);
  P.lifespanLeft = (s, p) => P.lifespanTotal(p) - P.age(s, p);
  P.isOld = (s, p) => P.lifespanLeft(s, p) < P.lifespanTotal(p) * C().life.oldFrac;

  P.realmName = (p) => {
    const cf = C().realms;
    const m = p.realm.major;
    if (m === 0) return P.hasRoot(p) ? '未入道' : '凡人';
    return cf.names[m] + cf.stageNames[m][p.realm.stage - 1];
  };
  P.realmRank = (p) => (p.realm.major === 0 ? 0 : p.realm.major === 1 ? p.realm.stage : p.realm.major === 2 ? 9 + p.realm.stage : 12 + p.realm.stage);
  P.need = (p) => (p.realm.major === 0 ? Infinity : C().realms.need[p.realm.major][p.realm.stage - 1]);
  P.isFull = (p) => p.realm.major > 0 && p.progress >= P.need(p);

  P.healthCoef = (p) => (p.health.state === 'heavy' ? 0.3 : p.health.state === 'light' ? 0.7 : 1);
  P.techOf = (s, p) => C().techniques[p.techniqueId] || C().techniques.yellow_general;
  P.factionName = (s, p) => (p.factionId && s.factions[p.factionId] ? s.factions[p.factionId].name : '散修');

  // 斗法战力
  P.powerBreakdown = (s, p) => {
    const F = [];
    if (!P.alive(p) || !P.hasRoot(p) || p.realm.major === 0) return { total: C().realms.power[0][0], factors: [{ label: '凡人', value: C().realms.power[0][0] }] };
    const cf = C().realms.power[p.realm.major];
    F.push({ label: '境界 ' + P.realmName(p), value: cf[Math.min(cf.length - 1, p.realm.stage - 1)] });
    F.push({ label: '资质 ' + p.aptitude, value: U.round1((0.85 + (p.aptitude / 100) * 0.3) * 100) / 100 });
    F.push({ label: '功法 ' + P.techOf(s, p).name, value: P.techOf(s, p).mult });
    if (p.health.state !== 'healthy') F.push({ label: p.health.state === 'heavy' ? '重伤' : '轻伤', value: P.healthCoef(p) });
    if (p.root.mutant === '雷') F.push({ label: '雷灵根', value: C().roots.mutantPower });
    let total = 1;
    for (const f of F) total *= f.value;
    return { total: Math.round(total * 10) / 10, factors: F };
  };
  P.power = (s, p) => P.powerBreakdown(s, p).total;

  /* ---------- 关系对（双向，强度 −100 到 100）---------- */
  P.relationsOf = (s, id) => s.relations.filter((r) => r.a === id || r.b === id);
  P.relationBetween = (s, a, b) => s.relations.find((r) => (r.a === a && r.b === b) || (r.a === b && r.b === a));
  P.relValue = (s, a, b) => { const r = P.relationBetween(s, a, b); return r ? r.strength : 0; };
  P.adjustRelation = (s, a, b, delta, tag) => {
    if (a === b) return null;
    let r = P.relationBetween(s, a, b);
    if (!r) {
      const cap = C().relations.maxPerPerson;
      for (const id of [a, b]) {
        const mine = P.relationsOf(s, id);
        if (mine.length >= cap) {
          mine.sort((x, y) => Math.abs(x.strength) - Math.abs(y.strength));
          s.relations.splice(s.relations.indexOf(mine[0]), 1);
        }
      }
      r = { a, b, type: 'acquaint', strength: 0, tags: [], since: s.year };
      s.relations.push(r);
    }
    r.strength = U.clamp(r.strength + delta, -100, 100);
    if (tag && !r.tags.includes(tag)) r.tags.push(tag);
    const cf = C().relations;
    r.type = r.strength <= cf.feudThreshold ? 'feud' : r.strength >= cf.closeThreshold ? 'close' : 'acquaint';
    return r;
  };

  /* ---------- 生成 ---------- */
  function pickElements(r, n) {
    const all = C().roots.elements;
    const out = [];
    while (out.length < n) { const e = R.pick(r, all); if (!out.includes(e)) out.push(e); }
    return out;
  }
  P.genRootRandom = (r) => {
    const cf = C().roots;
    const type = R.weighted(r, cf.types, (t) => cf.weight[t]);
    if (type === 'mutant') return { type, elements: [], mutant: R.pick(r, cf.mutants) };
    return { type, elements: pickElements(r, cf.count[type]), mutant: null };
  };

  P.genTraits = (r) => {
    const cf = C().traits;
    const n = R.chance(r, 0.5) ? 2 : 3;
    const out = [];
    let guard = 0;
    while (out.length < n && guard++ < 50) {
      const t = R.pick(r, cf.list);
      if (out.includes(t)) continue;
      if (cf.exclusive.some((pair) => pair.includes(t) && pair.some((x) => x !== t && out.includes(x)))) continue;
      out.push(t);
    }
    return out;
  };

  P.genName = (s, sex, surname) => {
    const n = C().names;
    const pool = sex === 'M' ? n.male : n.female;
    const sn = surname || R.pick(s.rng, n.surnames);
    for (let i = 0; i < 30; i++) {
      const full = sn + R.pick(s.rng, pool) + (R.chance(s.rng, 0.6) ? R.pick(s.rng, pool) : '');
      if (!s.usedNames[full]) { s.usedNames[full] = 1; return full; }
    }
    const full = sn + R.pick(s.rng, pool) + R.pick(s.rng, pool) + R.pick(s.rng, pool);
    s.usedNames[full] = 1;
    return full;
  };

  P.create = (s, o) => {
    const r = s.rng;
    const id = 'p' + s.nextId++;
    const sex = o.sex || (R.chance(r, 0.5) ? 'M' : 'F');
    const root = o.root || P.genRootRandom(r);
    const realm = o.realm || { major: 1, stage: 1 };
    let name = o.name;
    if (name) s.usedNames[name] = 1; else name = P.genName(s, sex, o.surname);
    const p = {
      id,
      name,
      sex,
      birthYear: o.birthYear,
      deathYear: null,
      deathCause: null,
      root,
      aptitude: o.aptitude !== undefined ? o.aptitude : Math.round(U.clamp(R.normal(r, 45, 15), 5, 95)),
      realm,
      progress: o.progress || 0,
      lifespanMax: P.lifespanMaxFor(realm.major, realm.stage),
      lifespanBonus: 0,
      yanshouTaken: 0,
      traits: o.traits || P.genTraits(r),
      techniqueId: o.techniqueId || 'yellow_general',
      locationId: o.locationId,
      factionId: o.factionId || null,
      role: o.role || 'member', // leader / elder / member / loose
      health: { state: 'healthy', days: 0 },
      status: 'alive',
      flags: [],
      fullDays: 0,
      failCount: 0,
      restUntil: 0,
      peakRank: 0,
      lastConsultYear: null,
    };
    p.peakRank = P.realmRank(p);
    s.people[id] = p;
    return p;
  };

  /* ---------- 伤势 ---------- */
  P.injure = (s, p, level) => {
    const L = C().life;
    if (level === 'heavy' || p.health.state === 'heavy') p.health = { state: 'heavy', days: Math.max(p.health.state === 'heavy' ? p.health.days : 0, L.heavyInjuryDays) };
    else p.health = { state: 'light', days: Math.max(p.health.state === 'light' ? p.health.days : 0, L.lightInjuryDays) };
  };
  // 伤愈推进（天）；返回是否痊愈
  P.heal = (p, days) => {
    if (p.health.state === 'healthy') return false;
    p.health.days -= days;
    if (p.health.days > 0) return false;
    p.health = { state: 'healthy', days: 0 };
    return true;
  };

  /* ---------- 死亡 ---------- */
  P.kill = (s, p, cause, causeIds, opts) => {
    if (!P.alive(p)) return null;
    p.status = 'dead';
    p.deathYear = s.year;
    p.deathCause = cause;
    p.health = { state: 'dead', days: 0 };
    p.lastRelations = P.relationsOf(s, p.id).map((r) => ({ other: r.a === p.id ? r.b : r.a, type: r.type, strength: r.strength }));
    const isPlayer = P.isPlayer(s, p);
    // NPC 死后，只保留与主角之间的关系记录，其余清理以免越积越多
    s.relations = s.relations.filter((r) => !(r.a === p.id || r.b === p.id) || (s.player && (r.a === s.player.id || r.b === s.player.id)));
    const place = s.places[p.locationId];
    let hid;
    if (isPlayer) {
      hid = FX.H.add(s, {
        type: 'death', tags: ['死亡'], actors: [p.id], places: [p.locationId], key: 'death_' + ((opts && opts.key) || 'generic'), pov: true,
        params: { name: p.name, age: P.age(s, p), realm: P.realmName(p), cause, place: place ? place.name : '' }, severity: 5, causeIds,
      });
    } else {
      const known = P.relValue(s, p.id, s.player.id) !== 0 || (s.player && P.player(s).locationId === p.locationId);
      hid = FX.H.add(s, {
        type: 'npc_death', tags: ['死亡'], actors: [p.id], factions: p.factionId ? [p.factionId] : [], key: 'npc_death', pov: known,
        params: { name: p.name, faction: P.factionName(s, p), realm: P.realmName(p), cause, age: P.age(s, p) },
        severity: P.realmRank(p) >= 10 || p.role === 'leader' ? 4 : 1, causeIds,
      });
    }
    p.deathHist = hid;
    return hid;
  };

  FX.P = P;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ============================================================
 * cultivation —— 修炼速度、境界晋升与突破（主角与 NPC 共用一套公式）
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;
  const U = FX.U;
  const P = () => FX.P;
  const H = () => FX.H;

  const CU = {};

  CU.techFit = (s, p) => {
    const t = P().techOf(s, p);
    if (!t.elements.length) return 1;
    if (p.root.type === 'mutant') return C().fitMin + 0.1; // 变异灵根需特定功法
    const overlap = p.root.elements.filter((e) => t.elements.includes(e)).length / t.elements.length;
    return Math.round((C().fitMin + (C().fitMax - C().fitMin) * overlap) * 100) / 100;
  };

  CU.techCapped = (s, p) => {
    const t = P().techOf(s, p);
    return !!t.capMajor && (p.realm.major > t.capMajor || (p.realm.major === t.capMajor && p.realm.stage >= t.capStage)) && P().isFull(p);
  };

  // 修炼速度构成（每年，可追溯）。opts.pill：是否在聚气丹药效内
  CU.breakdown = (s, p, opts) => {
    const cf = C(), cc = cf.cultivation;
    const F = [];
    if (!P().hasRoot(p) || p.realm.major === 0) return { total: 0, factors: [{ label: '无灵根或未入道', value: 0 }] };
    F.push({ label: '境界基础值', value: cf.realms.baseGain[p.realm.major] });
    F.push({ label: '灵根（' + cf.roots.names[p.root.type] + '）', value: cf.roots.speed[p.root.type] });
    F.push({ label: '资质 ' + p.aptitude, value: Math.round((cc.aptBase + (p.aptitude / 100) * cc.aptRange) * 100) / 100 });
    const t = P().techOf(s, p);
    F.push({ label: '功法 ' + t.name + '（适配 ' + CU.techFit(s, p) + '）', value: Math.round(t.mult * CU.techFit(s, p) * 100) / 100 });
    const place = s.places[p.locationId];
    const qi = CU.qiFor(s, p);
    F.push({ label: '灵气 ' + qi + ' 级' + (place ? '（' + place.name + (qi < place.qi ? '，外人只能在山门外修炼' : '') + '）' : ''), value: cc.qiMult[qi] });
    if (opts && opts.pill) F.push({ label: '聚气丹', value: 1 + cc.qijuBonus });
    if (P().isOld(s, p)) F.push({ label: '年老', value: cc.oldAgeCoef });
    if (p.health.state === 'light' || p.health.state === 'heavy') F.push({ label: p.health.state === 'heavy' ? '重伤' : '轻伤', value: cc.injury[p.health.state] });
    if (CU.techCapped(s, p)) F.push({ label: '功法残缺，已到尽头', value: 0 });
    let total = 1;
    for (const f of F) total *= f.value;
    return { total: Math.round(total * 100) / 100, factors: F };
  };

  // 此人在所在地能借到的灵气（宗门、家族驻地只对自己人开放）
  CU.qiFor = (s, p) => {
    const place = s.places[p.locationId];
    if (!place) return 1;
    const lim = C().cultivation.outsiderQi[place.type];
    if (lim !== undefined && place.factionId && p.factionId !== place.factionId) return Math.min(place.qi, lim);
    return place.qi;
  };

  CU.updateLifespan = (s, p) => { p.lifespanMax = P().lifespanMaxFor(p.realm.major, p.realm.stage); };

  // 炼气一至八层修满自动晋升；返回晋升的层数
  CU.autoAdvance = (s, p) => {
    let n = 0;
    while (p.realm.major === 1 && p.realm.stage < 9 && p.progress >= P().need(p) && n < 10) {
      p.progress -= P().need(p);
      p.realm.stage++;
      n++;
      if (P().isPlayer(s, p)) H().add(s, { type: 'realm', tags: ['修炼'], actors: [p.id], key: 'realm_up', params: { name: p.name, realm: P().realmName(p) }, severity: 2, pov: true });
    }
    const rk = P().realmRank(p);
    if (rk > p.peakRank) p.peakRank = rk;
    return n;
  };

  // 加修为（已到瓶颈时封顶，等待突破）；返回实际增加的修为
  CU.addProgress = (s, p, amount) => {
    if (p.realm.major === 0 || amount <= 0) return 0;
    const before = p.progress + CU.levelBase(p);
    p.progress += amount;
    if (p.realm.major > 1 || p.realm.stage === 9) p.progress = Math.min(p.progress, P().need(p));
    CU.autoAdvance(s, p);
    if (p.realm.major > 1 || p.realm.stage === 9) p.progress = Math.min(p.progress, P().need(p));
    return Math.max(0, p.progress + CU.levelBase(p) - before);
  };
  // 本大境界内已累计的修为（用来算跨层增长）
  CU.levelBase = (p) => {
    if (p.realm.major !== 1) return 0;
    let b = 0;
    for (let i = 0; i < p.realm.stage - 1; i++) b += C().realms.need[1][i];
    return b;
  };

  /* ---------- 突破 ---------- */
  CU.gateKind = (p) => {
    if (p.realm.major === 1 && p.realm.stage === 9) return 'zhuji';
    if (p.realm.major === 2 && p.realm.stage < 3) return 'minor';
    if (p.realm.major === 2 && p.realm.stage === 3) return 'jindan';
    if (p.realm.major === 3 && p.realm.stage < 3) return 'minor';
    return null;
  };
  CU.targetName = (p) => {
    const k = CU.gateKind(p);
    if (k === 'zhuji') return '筑基';
    if (k === 'jindan') return '金丹';
    if (k === 'minor') return C().realms.names[p.realm.major] + C().realms.stageNames[p.realm.major][p.realm.stage];
    return '';
  };

  const inv = (s, p) => (P().isPlayer(s, p) ? s.player.inv : {});

  CU.canAttempt = (s, p) => {
    if (!P().alive(p) || p.realm.major === 0) return { ok: false, reason: '尚未入道' };
    const k = CU.gateKind(p);
    if (!k) return { ok: false, reason: p.realm.major === 3 && p.realm.stage === 3 ? '已到本版境界上限' : '炼气前八层修满自动晋升' };
    if (!P().isFull(p)) return { ok: false, reason: '修为未圆满（' + Math.floor(p.progress) + '/' + P().need(p) + '）' };
    if (s.t < p.restUntil) return { ok: false, reason: '上次失败后需休养，至 ' + FX.T.fmt(p.restUntil) };
    if (p.health.state === 'heavy') return { ok: false, reason: '重伤未愈' };
    const t = P().techOf(s, p);
    if (k === 'jindan') {
      if (t.capMajor === 2) return { ok: false, reason: t.name + '残缺，无法冲击金丹' };
      if (CU.qiFor(s, p) < C().breakthrough.jindan.minQi) return { ok: false, reason: '需在灵气 ' + C().breakthrough.jindan.minQi + ' 级以上之地结丹' };
      if (P().isPlayer(s, p) && !(inv(s, p).ningdan > 0)) return { ok: false, reason: '缺少凝丹灵物（结丹必需，坊市偶有出售，约 2400 灵石）' };
    }
    return { ok: true, kind: k };
  };

  // 冲关的前置条件清单（界面逐条打勾）
  CU.requirements = (s, p) => {
    const k = CU.gateKind(p);
    if (!k) return [];
    const B = C().breakthrough;
    const out = [{ label: '修为圆满', ok: P().isFull(p), note: Math.floor(p.progress) + ' / ' + P().need(p) }];
    if (k === 'zhuji') out.push({ label: '筑基丹（可选：有则 +' + B.zhuji.pill + '%，没有则 −' + B.zhuji.noPillPenalty + '%）', ok: P().isPlayer(s, p) && s.player.inv.zhuji > 0, optional: true, note: '坊市稀有货，约 ' + C().items.zhuji.price + ' 灵石' });
    if (k === 'jindan') {
      const t = P().techOf(s, p);
      out.push({ label: '功法能通往金丹', ok: t.capMajor !== 2, note: t.capMajor === 2 ? '《' + t.name + '》是残卷，止步筑基' : '' });
      out.push({ label: '在灵气 ' + B.jindan.minQi + ' 级以上、你能用的地方', ok: CU.qiFor(s, p) >= B.jindan.minQi, note: '此处你能借到 ' + CU.qiFor(s, p) + ' 级' });
      out.push({ label: '凝丹灵物', ok: P().isPlayer(s, p) && s.player.inv.ningdan > 0, note: '坊市、宗门偶有出售，约 ' + C().items.ningdan.price + ' 灵石' });
    }
    out.push({ label: '没有重伤', ok: p.health.state !== 'heavy' });
    if (p.restUntil > s.t) out.push({ label: '失败后休养期已过', ok: false, note: '至 ' + FX.T.fmt(p.restUntil) });
    return out;
  };

  // 成功率与每一项修正（决定前必须列出）。opts.pill：NPC 是否有筑基丹
  CU.chance = (s, p, opts) => {
    const B = C().breakthrough;
    const k = CU.gateKind(p);
    if (!k) return null;
    const parts = [];
    const cfg = k === 'minor' ? B.minor : B[k];
    parts.push({ label: '基础成功率', value: cfg.base });
    parts.push({ label: '资质 ' + p.aptitude, value: U.round1((p.aptitude - 50) * B.aptitudeFactor) });
    parts.push({ label: C().roots.names[p.root.type], value: C().roots.breakMod[p.root.type] });
    const fit = CU.techFit(s, p);
    parts.push({ label: '功法适配', value: U.round1(U.clamp(((fit - 1) / 0.25) * C().fitBreakMax, -C().fitBreakMax, C().fitBreakMax)) + (P().techOf(s, p).breakBonus || 0) });
    const hasPill = P().isPlayer(s, p) ? inv(s, p).zhuji > 0 : !!(opts && opts.pill);
    if (k === 'zhuji') {
      if (hasPill) parts.push({ label: '服用筑基丹', value: B.zhuji.pill });
      else parts.push({ label: '无筑基丹', value: -B.zhuji.noPillPenalty });
    }
    if (k === 'jindan' && (!P().isPlayer(s, p) || inv(s, p).ningdan > 0)) parts.push({ label: '凝丹灵物', value: B.jindan.pill });
    const qi = CU.qiFor(s, p);
    if (qi >= B.qiBonusMin) parts.push({ label: '灵气 ' + qi + ' 级之地', value: B.qiBonus });
    const accYears = Math.floor(p.fullDays / C().daysPerYear);
    if (accYears > 0) parts.push({ label: '圆满后积累 ' + accYears + ' 年', value: Math.min(B.accumMax, accYears * B.accumPerYear) });
    if (p.failCount > 0) parts.push({ label: '此前失败 ' + p.failCount + ' 次', value: -p.failCount * B.failPenalty });
    if (p.traits.includes('孤傲')) parts.push({ label: '孤傲', value: C().traits.proudBreak });
    if (p.root.mutant === '冰') parts.push({ label: '冰灵根', value: C().roots.mutantIceBreak });
    if (p.health.state === 'light') parts.push({ label: '轻伤', value: -5 });
    let total = parts.reduce((a, x) => a + x.value, 0);
    const max = k === 'minor' ? B.max : B.majorMax;
    total = U.clamp(total, B.min, max);
    const death = k === 'minor' ? 0 : B[k].deathChance;
    return { kind: k, target: CU.targetName(p), chance: Math.round(total), parts, max, death: Math.round(death * 1000) / 10, usesPill: k === 'zhuji' && hasPill, days: cfg.days };
  };

  CU.attempt = (s, p, opts) => {

(function (G) {

  Combat.fightChance = (s, p, foePower) => {
    const E = C().encounter;
    const my = P().powerBreakdown(s, p);
    const raw = (my.total / (my.total + foePower)) * 100;
    const chance = Math.round(U.clamp(raw, E.winChanceMin, E.winChanceMax));
    const parts = my.factors.map((f) => ({ label: f.label, value: '×' + f.value })).concat([{ label: '我方战力', value: my.total }, { label: '对方战力', value: Math.round(foePower * 10) / 10 }]);
    return { chance, parts, my: my.total };

  Combat.fleeChance = (s, p, foePower) => {
    const E = C().encounter;
    const parts = [{ label: '基础', value: E.fleeBase }, { label: '资质 ' + p.aptitude, value: U.round1((p.aptitude - 50) * E.fleePerApt) }];
    const my = P().power(s, p);
    const ratio = foePower / Math.max(0.1, my);
    if (ratio > 1) parts.push({ label: '对方强出 ' + U.round1(ratio) + ' 倍', value: -Math.round(Math.min(30, (ratio - 1) * 10)) });
    else parts.push({ label: '对方不如你', value: Math.round(Math.min(20, (1 / ratio - 1) * 10)) });
    if (p.traits.includes('谨慎')) parts.push({ label: '谨慎', value: C().traits.cautiousFlee });
    if (p.root.mutant === '风') parts.push({ label: '风灵根', value: C().roots.mutantWindFlee });
    if (p.health.state !== 'healthy') parts.push({ label: '带伤', value: p.health.state === 'heavy' ? -25 : -10 });

  const lootBeast = (s, danger) => {

    text: (s, b, n) => `${n.place}，${b._why || '一头'}${b._beast}拦在前方（战力约 ${b._power}）。你如今${P().realmName(pl(s))}，战力 ${P().power(s, pl(s))}。`,

        apply(s, b) { const lost = Math.ceil(s.player.stone * 0.4); s.player.stone -= lost; return { text: `交出灵石 ${lost}` }; },

        cost: () => '十天', risk: () => '约四成会触发残余禁制而受伤，且深处可能早已空无一物',
        outcome: () => '若有所得，可能是丹药、灵石，甚至功法',

/* ============================================================
 * sim —— 开局、时间推进（按天，跨月/跨年结算世界）、NPC 逐年模拟、结局、自检
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const C = () => FX.CONFIG;
  const R = FX.RNG;

      rng: R.seedState(seed),

      year: cf.startYear,
      nextId: 1,
      nextHistId: 1,
      places: {},
      factions: {},
      people: {},
      relations: [],
      markets: {},
      pending: [],
      eventQueue: [],
      history: [],
      records: { firsts: {} },
      usedNames: {},
      player: null,
      aiLog: [], // 阶段 3：AI 提案原文与验证结果，读档重放时用记录而不重新调用
      ended: null,
    };

    const surname = (opts.surname || '').trim().slice(0, 2) || R.pick(r, origin === 'clan' ? cf.names.clanSurnames : cf.names.surnames);
    W().genPlaces(s, { clanSurname: origin === 'clan' ? surname : null });
    W().genFactions(s);
    W().genPeople(s);

    // 主角
    let place, faction = null;
    const places = Object.values(s.places);
    if (O.faction) {
      faction = Object.values(s.factions).find((f) => f.type === O.faction && (O.faction !== 'clan' || s.places[f.seatId].surname === surname));
      place = s.places[faction.seatId];
    } else place = R.pick(r, places.filter((p) => p.type === O.place));
    const sex = opts.sex === 'F' || opts.sex === 'M' ? opts.sex : R.chance(r, 0.5) ? 'M' : 'F';
    const given = (opts.given || '').trim().slice(0, 3);
    const p = P().create(s, {
      name: given ? surname + given : null, surname, sex, birthYear: s.year - cf.life.adultAge,
      realm: Object.assign({}, O.realm), aptitude: Math.round(U.clamp(R.normal(r, 50, 15), 10, 95)),
      techniqueId: O.technique, locationId: place.id, factionId: faction ? faction.id : null, role: faction ? 'member' : 'loose',
    });

      id: p.id,
      stone: O.stone,
      inv: Object.assign({}, O.inv),
      manuals: [O.technique],
      qijuUntil: 0,
      visited: [place.id],
      lastFortuneT: -1e9,
      stats: { cultivateDays: 0, explores: 0, exploreNothing: 0, fights: 0, wins: 0, seek: 0, seekNoGain: 0, fortunes: 0, actions: 0 },
    };

    H().add(s, {
      type: 'start', tags: ['开局'], actors: [p.id], places: [place.id], key: 'start', pov: true, severity: 3,
      params: { name: p.name, origin: O.name + (faction ? '（' + faction.name + '）' : ''), age: cf.life.adultAge, realm: P().realmName(p), place: place.name },

   * mode：cultivate 修炼（积修为、闭关可被打扰）/ rest 静养（伤愈加倍）/ travel / other

      if (R.chance(s.rng, cf.actions.seclusionDisturb * (place.danger + 0.5))) {

    if (P().alive(pl) && pl.factionId && s.factions[pl.factionId]) {

    const npcs = P().living(s).filter((p) => p.id !== pl.id).sort((a, b) => (Number(a.id.slice(1)) - Number(b.id.slice(1))));
    for (const p of npcs) {

/* ============================================================

 * Act.run 执行其中一项。

  Act.DO.breakthrough = (s, a) => {

    const res = CU().attempt(s, p);

  };

  Act.DO.use = (s, a) => {

    H().add(s, { type: 'rest', tags: ['静养'], actors: [p.id], places: [place.id], key: 'rest', pov: true, severity: 1, params: { name: p.name, place: place.name, dur: T().dur(r.used), state } });

  };

  // 闭关被打扰：在野外多是妖兽，在人多处多是劫修
  Act.disturb = (s, place) => {
    if (place.type === 'wild' || place.type === 'danger') {
      const d = Math.max(1, place.danger);
      const E = C().encounter;
      const power = Math.round(E.dangerPower[d] * R.range(s.rng, E.beastSwing[0], E.beastSwing[1]) * 10) / 10;
      FX.Ev.spawn(s, 'BEAST', { place: place.id, _beast: R.pick(s.rng, FX.Combat.beastNames[d]), _power: power, _danger: d, _why: '闭关时洞府外闯来一头' }, []);
    } else {
      const foe = Act.pickRobber(s, place);
      FX.Ev.spawn(s, 'ROBBER', { place: place.id, foe: foe.id }, []);
    }
  };

  Act.spawnDanger = (s, place, why, causeIds) => {
    const E = C().encounter;
    if (R.chance(s.rng, 0.6)) {
      const d = Math.max(1, place.danger);
      const power = Math.round(E.dangerPower[d] * R.range(s.rng, E.beastSwing[0], E.beastSwing[1]) * 10) / 10;
      FX.Ev.spawn(s, 'BEAST', { place: place.id, _beast: R.pick(s.rng, FX.Combat.beastNames[d]), _power: power, _danger: d, _why: why + '一头' }, causeIds);
    } else FX.Ev.spawn(s, 'ROBBER', { place: place.id, foe: Act.pickRobber(s, place).id }, causeIds);
  };

  // 传闻：只讲世界里真实存在的事
  Act.rumor = (s) => {
    const r = s.rng;
    const kinds = ['place', 'market', 'strong'];
    const k = R.pick(r, kinds);
    if (k === 'place') {
      const unknown = Object.values(s.places).filter((x) => !s.player.visited.includes(x.id));
      const pl = unknown.length ? R.pick(r, unknown) : R.pick(r, Object.values(s.places));
      return `${pl.name}灵气${['稀薄', '稀薄', '平平', '尚可', '浓郁', '极浓'][pl.qi]}，${pl.danger >= 3 ? '据说凶险得很' : pl.danger >= 1 ? '偶有妖兽出没' : '还算太平'}。`;
    }
    if (k === 'market') {
      const rare = [];
      for (const id in s.markets) for (const x of s.markets[id].stock) if (!['qiju', 'heal'].includes(x.item) && x.qty > 0) rare.push({ id, x });
      if (rare.length) { const it = R.pick(r, rare); return `${s.places[it.id].name}的坊市里有${W().itemName(it.x.item)}出售，要价 ${it.x.price} 灵石。`; }
    }
    const strong = P().living(s).filter((q) => q.realm.major >= 2).sort((a, b) => P().realmRank(b) - P().realmRank(a) || (a.id < b.id ? -1 : 1));
    if (!strong.length) return '近来没什么大事。';
    const q = R.pick(r, strong.slice(0, 8));
    return `${P().factionName(s, q)}的${q.name}乃是${P().realmName(q)}修士，常在${s.places[q.locationId].name}。`;
  };

  /* ---------- 人物 ---------- */
  Act.DO.befriend = (s, a) => {
    const p = me(s), q = s.people[a.npc];
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p) || !P().alive(q)) { seek(s, false); return { text: '没见着人' }; }
    let delta = R.int(s.rng, 1, 8);
    if (p.traits.includes('仁慈')) delta += 3;
    if (p.traits.includes('贪婪')) delta -= 2;
    if (q.traits.includes('孤傲')) delta -= 4;
    if (q.traits.includes('仁慈')) delta += 2;
    if (P().realmRank(q) - P().realmRank(p) >= 5 && R.chance(s.rng, 0.4)) delta = 0;
    if (q.factionId && s.factions[q.factionId].type === 'evil' && p.traits.includes('正直')) delta -= 5;
    const cur = P().relValue(s, p.id, q.id);
    if (cur < 0 && delta > 0) delta = Math.floor(delta / 2); // 有过节的人难哄
    delta = Math.max(-5, delta);
    if (delta !== 0 || cur !== 0) P().adjustRelation(s, p.id, q.id, delta, '拜访');
    const how = delta >= 8 ? '甚欢' : delta >= 4 ? '融洽' : delta > 0 ? '平平' : '冷淡';
    H().add(s, { type: 'social', tags: ['人物'], actors: [p.id, q.id], places: [p.locationId], key: 'befriend', pov: true, severity: 1, params: { name: p.name, other: q.name, how, delta: (delta > 0 ? '+' : '') + delta } });
    seek(s, delta > 0);
    return { text: `与${q.name}相谈${how}（关系 ${delta > 0 ? '+' : ''}${delta}）` };
  };

  Act.DO.consult = (s, a) => {
    const p = me(s), q = s.people[a.npc], cc = C().cultivation;
    Sim().passDays(s, a.days, 'other');
    if (!P().alive(p) || !P().alive(q)) { seek(s, false); return { text: '没见着人' }; }
    q.lastConsultYear = s.year;
    const rel = P().relValue(s, p.id, q.id);
    const accept = U.clamp(0.4 + rel / 150, 0.4, 0.9);
    if (!R.chance(s.rng, accept)) {
      H().add(s, { type: 'social', tags: ['人物'], actors: [p.id, q.id], key: 'consult_refused', pov: true, severity: 1, params: { name: p.name, other: q.name } });
      seek(s, false);
      return { text: q.name + '婉拒了' };
    }
    const amount = Math.round(Math.min(P().need(p), 2000) * R.range(s.rng, cc.consultFrac[0], cc.consultFrac[1]) * 10) / 10;
    const gain = Math.round(CU().addProgress(s, p, amount) * 10) / 10;
    P().adjustRelation(s, p.id, q.id, 2, '指点');
    H().add(s, { type: 'social', tags: ['人物', '修炼'], actors: [p.id, q.id], key: 'consult', pov: true, severity: 2, params: { name: p.name, other: q.name, gain } });
    seek(s, gain > 0);
    return { text: `得${q.name}指点，修为 +${gain}` };
  };

  FX.Act = Act;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/save.js ---------- */
/* ============================================================
 * save（核心部分）—— 序列化、校验、迁移、校验和
 * 真正读写 IndexedDB / localStorage 的适配器在 ui 一侧。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const U = FX.U;

  const SV = {};

  SV.hashState = (s) => U.hash(JSON.stringify(s));

  SV.meta = (s) => {
    const p = FX.P.player(s);
    const r = FX.Sim.rating(s);
    return {
      name: p.name,
      origin: s.origin,
      originName: FX.CONFIG.origins[s.origin].name,
      seed: s.seed,
      year: s.year,
      age: FX.P.age(s, p),
      realm: FX.P.realmName(p),
      ratingPreview: r.grade + ' ' + r.total,
      ended: !!s.ended,
    };
  };

  SV.serialize = (s, savedAt) => {
    const stateStr = JSON.stringify(s);
    const save = { schemaVersion: s.schemaVersion, gameVersion: s.gameVersion, meta: Object.assign(SV.meta(s), { savedAt: savedAt || null }), state: s, checksum: U.hash(stateStr) };
    return JSON.stringify(save);
  };

  // 迁移函数表：从 vN 升到 vN+1
  SV.migrations = {
    // 2: (state) => { ...; state.schemaVersion = 3; return state; },
  };

  const REQUIRED = {
    state: ['schemaVersion', 'seed', 'origin', 'rng', 't', 'year', 'places', 'factions', 'people', 'relations', 'markets', 'pending', 'eventQueue', 'history', 'records', 'player', 'aiLog'],
    player: ['id', 'stone', 'inv', 'manuals', 'visited', 'stats'],
  };

  // 依次：解析 → 版本 → 结构 → 校验和 → 引用完整性。任何一步失败都返回可读错误，不进入半加载状态。
  SV.deserialize = (text) => {
    let save;
    try { save = typeof text === 'string' ? JSON.parse(text) : text; } catch (e) { return { ok: false, error: '存档不是有效的 JSON：' + e.message }; }
    if (!save || typeof save !== 'object' || !save.state) return { ok: false, error: '存档结构缺失 state 字段' };
    const cur = FX.CONFIG.schemaVersion;
    let st = save.state;
    if (typeof save.schemaVersion !== 'number') return { ok: false, error: '缺少 schemaVersion' };
    if (save.schemaVersion === 1) return { ok: false, error: '这是旧版“经营家族”的存档，个人主角版无法读取' };
    if (save.schemaVersion > cur) return { ok: false, error: `存档版本 ${save.schemaVersion} 比游戏版本 ${cur} 新，请更新游戏` };
    // 校验和针对原始 state 计算
    if (save.checksum && U.hash(JSON.stringify(st)) !== save.checksum) return { ok: false, error: '校验和不符，存档可能已损坏或被改动' };
    let v = save.schemaVersion;
    while (v < cur) {
      const m = SV.migrations[v];
      if (!m) return { ok: false, error: `无法从存档版本 ${v} 迁移到 ${cur}` };
      st = m(JSON.parse(JSON.stringify(st)));
      v++;
    }
    for (const k of REQUIRED.state) if (!(k in st)) return { ok: false, error: '存档缺少字段 state.' + k };
    for (const k of REQUIRED.player) if (!(k in st.player)) return { ok: false, error: '存档缺少字段 player.' + k };
    if (!Array.isArray(st.rng.s) || st.rng.s.length !== 4) return { ok: false, error: '随机数状态损坏' };
    if (typeof st.t !== 'number' || typeof st.year !== 'number') return { ok: false, error: '时间字段类型错误' };
    // 引用完整性
    try {
      FX.Sim.check(st);
    } catch (e) {
      return { ok: false, error: '引用完整性检查失败：' + e.message };
    }
    return { ok: true, state: st, meta: save.meta };
  };

  FX.Save = SV;
})(typeof globalThis !== 'undefined' ? globalThis : this);

/* ---------- core/api.js ---------- */
/* ============================================================
 * api —— 界面与测试脚本共用的公开函数。界面只通过这里操作核心。
 * ============================================================ */
(function (G) {
  'use strict';
  const FX = (G.FX = G.FX || {});
  const P = FX.P;
  const C = () => FX.CONFIG;

  const Game = {
    newGame: (opts) => FX.Sim.newGame(opts || {}),
    // 此刻规则允许的行动（界面按钮、测试策略、以后的 AI 意图解析都从这里挑）
    actions: (s) => FX.Act.list(s),
    act: (s, a) => FX.Act.run(s, a),
    buy: (s, item, qty) => FX.Act.run(s, { type: 'buy', item, qty }),
    sell: (s, item, qty) => FX.Act.run(s, { type: 'sell', item, qty }),
    pendingEvents: (s) => s.pending.map((i) => FX.Ev.view(s, i)),
    choose: (s, instId, optId) => {
      if (s.ended) return { ok: false, error: '这一生已经结束' };
      const r = FX.Ev.resolve(s, instId, optId);
      if (r.ok && r.days && FX.P.alive(FX.P.player(s))) FX.Sim.passDays(s, r.days, 'other');
      FX.Sim.checkEnd(s);
      return r;
    },

    /* ---------- 视图数据（只读）---------- */
    view: {
      overview(s) {
        const p = P.player(s);
        const place = s.places[p.locationId];
        const bt = FX.CU.gateKind(p) ? FX.CU.chance(s, p) : null;
        return {
          t: s.t, year: s.year, date: FX.T.fmt(s.t),
          me: p, age: P.age(s, p), realm: P.realmName(p), need: P.need(p), full: P.isFull(p),
          left: P.lifespanLeft(s, p), lifespan: P.lifespanTotal(p),
          speed: FX.CU.breakdown(s, p, { pill: s.player.qijuUntil > s.t }),
          power: P.powerBreakdown(s, p),
          tech: P.techOf(s, p), fit: FX.CU.techFit(s, p),
          faction: p.factionId ? s.factions[p.factionId] : null,
          place, stone: s.player.stone, inv: s.player.inv, manuals: s.player.manuals,
          pillUntil: s.player.qijuUntil > s.t ? s.player.qijuUntil : null,
          breakthrough: bt ? Object.assign({ can: FX.CU.canAttempt(s, p) }, bt) : null,
          pending: s.pending.length, ended: s.ended, stats: s.player.stats,
        };
      },
      place(s, id) {
        const pl = s.places[id];
        if (!pl) return null;
        const me = P.player(s);
        return {
          place: pl,
          typeName: C().world.placeTypes[pl.type].name,
          faction: pl.factionId ? s.factions[pl.factionId] : null,
          visited: s.player.visited.includes(id),
          here: me.locationId === id,
          route: FX.World.route(s, me.locationId, id),
          people: P.at(s, id).filter((q) => q.id !== me.id).map((q) => ({ id: q.id, name: q.name, realm: P.realmName(q), faction: P.factionName(s, q), rel: P.relValue(s, me.id, q.id) })),
          market: FX.World.hasMarket(s, id) ? s.markets[id] : null,
        };
      },
      person(s, id) {
        const p = s.people[id];
        if (!p) return null;
        const me = P.player(s);
        const isMe = p.id === me.id;
        return {
          p, isMe,
          age: P.age(s, p),
          realm: P.realmName(p),
          need: P.need(p),
          left: P.lifespanLeft(s, p),
          power: P.power(s, p),
          faction: P.factionName(s, p),
          place: s.places[p.locationId].name,
          rel: isMe ? null : P.relationBetween(s, me.id, p.id),
          relations: isMe ? P.relationsOf(s, p.id).map((r) => ({ other: r.a === p.id ? r.b : r.a, name: P.name(s, r.a === p.id ? r.b : r.a), type: r.type, strength: r.strength, tags: r.tags })) : [],
          life: FX.H.lifeSummary(s, p),
          history: s.history.filter((e) => e.actors.includes(p.id) && (e.pov || isMe)).slice(-30).map((e) => ({ id: e.id, t: e.t, text: FX.H.text(e) })),
        };
      },
      feed: (s, n) => FX.H.feed(s, n),
      rating: (s) => FX.Sim.rating(s),
      historyText: (e) => FX.H.text(e),
    },

    save: {
      serialize: (s, savedAt) => FX.Save.serialize(s, savedAt),
      deserialize: (t) => FX.Save.deserialize(t),
      hash: (s) => FX.Save.hashState(s),
    },
  };

  FX.Game = Game;
})(typeof globalThis !== 'undefined' ? globalThis : this);
